name: Propose a documentation change
description: A guide, reference page or Storybook story is missing, wrong or unclear.
labels:
  - "Type: docs"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        ### Before you start

        - Search the [open issues](https://github.com/canonical/pragma-web/issues) first. If the issue already exists, add your information there.
        - Components, styles, Storybook, applications and the documentation site are in this repository. The CLI, generators, design tokens and design-system models are in [canonical/pragma-core](https://github.com/canonical/pragma-core/issues/new/choose).
        - Issues are public. Do not include confidential information.
        - If no form fits, [raise something else](https://github.com/canonical/pragma-web/issues/new?template=10-raise-something-else.yml).
  - type: markdown
    attributes:
      value: |
        ### Is this a documentation change?

        Use this form when a page, guide or Storybook story is missing, wrong or unclear.

        - The documentation is correct, but the component does not behave as described: [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml).
        - You have a question the documentation does not answer: [ask for support](https://github.com/canonical/pragma-web/issues/new?template=08-ask-support.yml). If the answer belongs in the documentation, triage opens a documentation change.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New entry
        - Fix to an existing entry
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page, story or topic
      description: A link to the existing page or story, or the topic of a new one.
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: Who it is for
      description: Determines the level of detail the page needs.
      placeholder: Designers adopting Pragma, engineers building an app …
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested content
      description: A draft or a list of points, if you have one.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to contribute this myself.
  - type: markdown
    attributes:
      value: |
        ### What happens next

        The Pragma team triages new issues, usually within a week. Triage may add labels, ask questions or move the issue to the correct repository. Updates are posted on this issue.

        If you offered to contribute, a maintainer will confirm the approach before you start.
