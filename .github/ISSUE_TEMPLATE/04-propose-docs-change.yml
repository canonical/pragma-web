name: Propose a documentation change
description: A guide, reference page or Storybook story is missing, wrong or unclear.
labels:
  - "Type: docs"
  - "Status: needs triage"
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      description: A new entry is planned as new work; a fix to an existing entry is handled as maintenance.
      options:
        - New entry
        - Fix to an existing entry
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page, story or topic
      description: A link to the existing page or story, or the topic of a new one.
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: Who it is for
      description: Determines the level of detail the page needs.
      placeholder: Designers adopting Pragma, engineers building an app …
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong
      description: The gap or error you found.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested content
      description: A draft or a list of points, if you have one.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Used to identify whether the work has an owner.
      options:
        - label: I'd like to contribute this myself.
