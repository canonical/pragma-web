name: Propose a documentation change
description: A guide, reference page or Storybook story is missing, wrong or unclear.
labels:
  - "Type: docs"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Search the [open issues](https://github.com/canonical/pragma-web/issues) first. Issues are public: do not include confidential information.

        Use this form when documentation is missing, wrong or unclear.

        - The documentation is right but the component is not: [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml).
        - You have a question: [ask for support](https://github.com/canonical/pragma-web/issues/new?template=08-ask-support.yml).
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - New entry
        - Fix to an existing entry
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Page, story or topic
      description: A link to the existing page or story, or the topic of a new one.
    validations:
      required: true
  - type: input
    id: audience
    attributes:
      label: Who it is for
      description: Determines the level of detail the page needs.
      placeholder: Designers adopting Pragma, engineers building an app …
  - type: textarea
    id: problem
    attributes:
      label: What is missing or wrong
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested content
      description: A draft or a list of points, if you have one.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to contribute this myself.
  - type: markdown
    attributes:
      value: |
        **What happens next:** Triage usually replies within a week. Updates are posted on this issue. If you offered to contribute, wait for a maintainer to confirm the approach.
