name: Propose a design token change
description: The value of a colour, spacing, typography or other design token should change, or a new token is needed.
labels:
  - "Type: tokens"
  - "Discipline: design"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Use this form when the token itself should change. If a UI block uses the wrong token, or one that is missing or out of date, that is a bug in the block: [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml).

        Design tokens are defined in [canonical/pragma-core](https://github.com/canonical/pragma-core). A token change filed here is moved there once triaged.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      description: Adding a token affects no existing component; changing one affects every component that uses it.
      options:
        - Add a token
        - Change a token
    validations:
      required: true
  - type: textarea
    id: tokens
    attributes:
      label: Tokens affected
      description: The exact token names.
      placeholder: color.text, spacing.inline.small …
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Current and proposed values
      description: Used to review the change, including contrast and consistency.
      placeholder: "color.border: #d9d9d9 → #cfcfcf"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Tokens are shared by every product, so the reason must apply to all of them.
    validations:
      required: true
  - type: textarea
    id: components
    attributes:
      label: Components affected
      description: The components you know will change. Used to plan visual checks before release.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Used to identify whether the work has an owner.
      options:
        - label: I'd like to contribute this myself.
