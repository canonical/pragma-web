name: Propose a design token change
description: A colour, spacing, typography or other design token should be added or changed.
labels:
  - "Type: tokens"
  - "Discipline: design"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Design tokens are defined in [canonical/pragma-core](https://github.com/canonical/pragma-core). A token change filed here is moved there once triaged.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      description: Adding a token affects nothing existing; changing one affects every component that uses it.
      options:
        - Add a token
        - Change a token
    validations:
      required: true
  - type: textarea
    id: tokens
    attributes:
      label: Tokens affected
      description: The exact token names, so we change the right ones.
      placeholder: color.text, spacing.inline.small …
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Current and proposed values
      description: The before and after let us review the change and check contrast and consistency.
      placeholder: "color.border: #d9d9d9 → #cfcfcf"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Tokens are shared by every product, so a change needs a reason that holds for all of them.
    validations:
      required: true
  - type: textarea
    id: components
    attributes:
      label: Components affected
      description: The components you know will change, so we can check them visually before release.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Tells us whether the work has an owner or needs one.
      options:
        - label: I can contribute this work.
