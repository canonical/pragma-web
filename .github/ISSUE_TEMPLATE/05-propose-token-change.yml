name: Propose a design token change
description: The value of a colour, spacing, typography or other design token should change, or a new token is needed.
labels:
  - "Type: tokens"
  - "Discipline: design"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Search the [open issues](https://github.com/canonical/pragma-web/issues) first. Issues are public: do not include confidential information.

        Use this form when a token's value should change, or a new token is needed.

        - A block uses a wrong, missing or outdated token: [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml).
  - type: dropdown
    id: kind
    attributes:
      label: Kind of change
      options:
        - Add a token
        - Change a token
    validations:
      required: true
  - type: textarea
    id: tokens
    attributes:
      label: Tokens affected
      placeholder: color.text, spacing.inline.small …
    validations:
      required: true
  - type: textarea
    id: values
    attributes:
      label: Current and proposed values
      description: Used to review the change, including contrast and consistency.
      placeholder: "color.border: #d9d9d9 → #cfcfcf"
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Tokens are shared by every product, so the reason must apply to all of them.
    validations:
      required: true
  - type: textarea
    id: components
    attributes:
      label: Components affected
      description: The components you know will change. Used to plan visual checks before release.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to contribute this myself.
  - type: markdown
    attributes:
      value: |
        **What happens next:** Triage usually replies within a week. Updates are posted on this issue. If you offered to contribute, wait for a maintainer to confirm the approach.
