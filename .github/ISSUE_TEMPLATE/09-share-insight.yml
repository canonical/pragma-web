name: Share an insight
description: Share an observation about how Pragma is used, without asking for a specific change.
labels:
  - "Type: insight"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        ### Before you start

        - Search the [open issues](https://github.com/canonical/pragma-web/issues) first. If the issue already exists, add your information there.
        - Components, styles, Storybook, applications and the documentation site are in this repository. The CLI, generators, design tokens and design-system models are in [canonical/pragma-core](https://github.com/canonical/pragma-core/issues/new/choose).
        - Issues are public. Do not include confidential information.
        - If no form fits, [raise something else](https://github.com/canonical/pragma-web/issues/new?template=10-raise-something-else.yml).
  - type: markdown
    attributes:
      value: |
        ### Is this an insight?

        Use this form to share an observation, such as research findings, recurring feedback or a pattern across products, without requesting a specific change.

        - You know what should change: [propose a change](https://github.com/canonical/pragma-web/issues/new?template=03-propose-change.yml) or [propose a new UI block](https://github.com/canonical/pragma-web/issues/new?template=02-propose-ui-block.yml).
        - You need help: [ask for support](https://github.com/canonical/pragma-web/issues/new?template=08-ask-support.yml).
  - type: textarea
    id: observation
    attributes:
      label: What you observed
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Where it came from
      description: Used to assess how representative it is, and who to contact for detail.
      placeholder: User research, a support thread, a product team …
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links, screenshots or quotes.
  - type: textarea
    id: reach
    attributes:
      label: Who is affected, and how often
  - type: textarea
    id: direction
    attributes:
      label: Suggested direction (optional)
  - type: markdown
    attributes:
      value: |
        ### What happens next

        The insight is read at triage, usually within a week. It may not receive a direct reply. It is linked from any decision or issue it leads to, and closed once it has been taken into account.
