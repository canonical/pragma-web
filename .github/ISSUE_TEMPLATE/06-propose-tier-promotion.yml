name: Propose moving a component to a higher tier (upstream)
description: A component built for one product is needed by others and should move up a tier.
labels:
  - "Type: tier promotion"
  - "Discipline: design"
  - "Discipline: eng"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        ### Before you start

        - Search the [open issues](https://github.com/canonical/pragma-web/issues) first. If the issue already exists, add your information there.
        - Components, styles, Storybook, applications and the documentation site are in this repository. The CLI, generators, design tokens and design-system models are in [canonical/pragma-core](https://github.com/canonical/pragma-core/issues/new/choose).
        - Issues are public. Do not include confidential information.
        - If no form fits, [raise something else](https://github.com/canonical/pragma-web/issues/new?template=10-raise-something-else.yml).
  - type: markdown
    attributes:
      value: |
        ### Is this a tier move?

        Use this form when a block built for one product or tier is needed by others.

        - Nothing similar exists in any tier: [propose a new UI block](https://github.com/canonical/pragma-web/issues/new?template=02-propose-ui-block.yml).
        - The block must also change to serve the other products: file the move first. Changes needed by one product only can follow as separate proposals ([propose a change](https://github.com/canonical/pragma-web/issues/new?template=03-propose-change.yml)).
  - type: input
    id: block
    attributes:
      label: UI block
    validations:
      required: true
  - type: input
    id: current-tier
    attributes:
      label: Current tier
      description: For example Apps, Sites, Stores, or a product such as apps/lxd.
      placeholder: apps/lxd
    validations:
      required: true
  - type: input
    id: target-tier
    attributes:
      label: Target tier
      description: A higher tier has more consumers and a stricter review. For example Global, Apps, Sites or Stores.
      placeholder: Apps
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Other products that need it
      description: Each product that needs it, with a link to where it would be used. A block moves up a tier only when more than one product needs it.
    validations:
      required: true
  - type: textarea
    id: differences
    attributes:
      label: Differences between products
      description: Variants, behaviour or styling that differ between products, and how a shared version would handle them. Used to scope the move.
  - type: input
    id: implementation
    attributes:
      label: Link to the current implementation
  - type: markdown
    attributes:
      value: |
        ### What happens next

        The Pragma team triages new issues, usually within a week. Triage may add labels, ask questions or move the issue to the correct repository. Updates are posted on this issue.
