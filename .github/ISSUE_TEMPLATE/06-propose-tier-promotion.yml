name: Propose moving a component to a higher tier (upstream)
description: A component built for one product is needed by others and should move up a tier.
labels:
  - "Type: tier promotion"
  - "Discipline: design"
  - "Discipline: eng"
  - "Status: needs triage"
body:
  - type: input
    id: block
    attributes:
      label: UI block
      description: The component or pattern to move.
    validations:
      required: true
  - type: input
    id: current-tier
    attributes:
      label: Current tier
      description: Where the block lives today. For example Apps, Sites, Stores, or a product such as apps/lxd.
      placeholder: apps/lxd
    validations:
      required: true
  - type: input
    id: target-tier
    attributes:
      label: Target tier
      description: Where it should live. A higher tier has more consumers and a stricter review. For example Global, Apps, Sites or Stores.
      placeholder: Apps
    validations:
      required: true
  - type: textarea
    id: consumers
    attributes:
      label: Other products that need it
      description: Each product that needs it, with a link to where it would be used. A block moves up a tier only when more than one product needs it.
    validations:
      required: true
  - type: textarea
    id: differences
    attributes:
      label: Differences between products
      description: Variants, behaviour or styling that differ between products, and how a shared version would handle them. Used to scope the move.
  - type: input
    id: implementation
    attributes:
      label: Link to the current implementation
      description: Used to review the existing code and specification.
