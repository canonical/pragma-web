name: Report a bug
description: Something in a component, stylesheet or package is broken, visually or in code.
labels:
  - "Type: bug"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Search the [open issues](https://github.com/canonical/pragma-web/issues) first so the same bug is not tracked twice.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of bug
      options:
        - Design (looks wrong)
        - Code (behaves wrong)
        - Not sure
    validations:
      required: true
  - type: input
    id: package
    attributes:
      label: Package and version
      placeholder: "@canonical/react-ds-global 0.12.0"
    validations:
      required: true
  - type: input
    id: component
    attributes:
      label: Component
      placeholder: Button
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Render …
        2. Click …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should happen, or what it should look like.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happens instead.
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References (optional)
      description: Anything that shows the expected or actual result, for example screenshots, a design file, a documentation page, a working example or a reproduction (CodeSandbox, StackBlitz, a branch).
  - type: input
    id: environment
    attributes:
      label: Browser and viewport
      placeholder: Firefox 140, 375×812
  - type: checkboxes
    id: a11y
    attributes:
      label: Accessibility
      options:
        - label: This bug affects accessibility.
