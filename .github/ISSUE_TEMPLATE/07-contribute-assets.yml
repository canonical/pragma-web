name: Contribute assets
description: Add icons, illustrations or other assets you have made to Pragma.
labels:
  - "Type: assets"
  - "Discipline: design"
  - "Discipline: eng"
  - "Contribution: offered"
  - "Status: needs triage"
body:
  - type: dropdown
    id: kind
    attributes:
      label: Kind of asset
      description: Each kind of asset has its own guidelines and review.
      options:
        - Icon
        - Illustration
        - Other
    validations:
      required: true
  - type: textarea
    id: names
    attributes:
      label: Asset names
      description: The names used to find and import the assets. Used to check for clashes with existing assets.
      placeholder: |
        arrow-up-right
        cloud-sync
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: SVG files or Figma link
      description: SVG files, or a link to the Figma frame that holds them. The source files are needed to add the assets.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Intended use
      description: Where the assets will be used. Used to check them against the existing set.
    validations:
      required: true
  - type: checkboxes
    id: guidelines
    attributes:
      label: Guidelines
      description: Assets that do not follow the guidelines need to be redrawn before they can be added.
      options:
        - label: These assets follow the asset guidelines.
          required: true
