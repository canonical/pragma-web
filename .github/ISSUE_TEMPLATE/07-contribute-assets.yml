name: Contribute assets
description: Add icons, illustrations or other assets you have made to Pragma.
labels:
  - "Type: assets"
  - "Discipline: design"
  - "Discipline: eng"
  - "Contribution: offered"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Search the [open issues](https://github.com/canonical/pragma-web/issues) first. Issues are public: do not include confidential information.

        Use this form when you have icons, illustrations or other assets ready to add.

        - An existing asset is broken: [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml).
  - type: dropdown
    id: kind
    attributes:
      label: Kind of asset
      options:
        - Icon
        - Illustration
        - Other
    validations:
      required: true
  - type: textarea
    id: names
    attributes:
      label: Asset names
      placeholder: |
        arrow-up-right
        cloud-sync
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: SVG files or Figma link
      description: SVG files, or a link to the Figma frame that holds them. The source files are needed to add the assets.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Intended use
      description: Used to check the assets against the existing set.
    validations:
      required: true
  - type: checkboxes
    id: guidelines
    attributes:
      label: Guidelines
      description: Assets that do not follow the guidelines need to be redrawn before they can be added.
      options:
        - label: These assets follow the asset guidelines.
          required: true
  - type: markdown
    attributes:
      value: |
        **What happens next:** Triage usually replies within a week. Updates are posted on this issue. A designer reviews the assets before an engineer adds them.
