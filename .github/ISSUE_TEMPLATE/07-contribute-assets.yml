name: Contribute assets
description: Add icons, illustrations or other assets you have made to Pragma.
labels:
  - "Type: assets"
  - "Discipline: design"
  - "Discipline: eng"
  - "Contribution: offered"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        ### Before you start

        - Search the [open issues](https://github.com/canonical/pragma-web/issues) first. If the issue already exists, add your information there.
        - Components, styles, Storybook, applications and the documentation site are in this repository. The CLI, generators, design tokens and design-system models are in [canonical/pragma-core](https://github.com/canonical/pragma-core/issues/new/choose).
        - Issues are public. Do not include confidential information.
        - If no form fits, [raise something else](https://github.com/canonical/pragma-web/issues/new?template=10-raise-something-else.yml).
  - type: markdown
    attributes:
      value: |
        ### Is this an asset contribution?

        Use this form when you have icons, illustrations or other assets ready to add.

        - You need an interactive component, not an image: [propose a new UI block](https://github.com/canonical/pragma-web/issues/new?template=02-propose-ui-block.yml).
        - An existing asset is broken or renders incorrectly: [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml).
  - type: dropdown
    id: kind
    attributes:
      label: Kind of asset
      options:
        - Icon
        - Illustration
        - Other
    validations:
      required: true
  - type: textarea
    id: names
    attributes:
      label: Asset names
      placeholder: |
        arrow-up-right
        cloud-sync
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: SVG files or Figma link
      description: SVG files, or a link to the Figma frame that holds them. The source files are needed to add the assets.
    validations:
      required: true
  - type: textarea
    id: use
    attributes:
      label: Intended use
      description: Used to check the assets against the existing set.
    validations:
      required: true
  - type: checkboxes
    id: guidelines
    attributes:
      label: Guidelines
      description: Assets that do not follow the guidelines need to be redrawn before they can be added.
      options:
        - label: These assets follow the asset guidelines.
          required: true
  - type: markdown
    attributes:
      value: |
        ### What happens next

        The Pragma team triages new issues, usually within a week. Triage may add labels, ask questions or move the issue to the correct repository. Updates are posted on this issue.

        A designer reviews the assets against the guidelines before an engineer adds them.
