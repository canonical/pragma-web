name: Propose a change to a UI block or code
description: A UI block or package works as designed, but should gain a property, variant or behaviour, or work differently.
labels:
  - "Type: improvement"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Search the [open issues](https://github.com/canonical/pragma-web/issues) first. Issues are public: do not include confidential information.

        Use this form when a block works as designed, but the design should change.

        - It does not match its design, documentation or tokens: [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml).
        - A token's value should change: [propose a token change](https://github.com/canonical/pragma-web/issues/new?template=05-propose-token-change.yml).

        Title: **Block: what changes**, for example **Chip: add a removable variant**. One change per issue.
  - type: input
    id: target
    attributes:
      label: UI block or package
      placeholder: Accordion, @canonical/router-core …
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: A new property, variant or behaviour, or a change to an existing one.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: The problem this solves, and where. A change must work for every product that uses the block.
    validations:
      required: true
  - type: textarea
    id: visual
    attributes:
      label: Designs or screenshots (optional)
      description: A design file, prototype or screenshots.
  - type: checkboxes
    id: flags
    attributes:
      label: About this change
      options:
        - label: This is an accessibility issue.
        - label: I'd like to contribute this myself.
  - type: markdown
    attributes:
      value: |
        **What happens next:** Triage usually replies within a week. Updates are posted on this issue. If you offered to contribute, wait for a maintainer to confirm the approach.
