name: Propose a change to a UI block or code
description: A UI block or package works as designed, but should gain a property, variant or behaviour, or work differently.
labels:
  - "Type: improvement"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        **Change or bug?** Use this form when the UI block or package works as designed and you want the design itself to change. If it does not match its design, its documentation or the design tokens, including using a token that is missing or out of date, [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml). If the value of a token itself should change, [propose a token change](https://github.com/canonical/pragma-web/issues/new?template=05-propose-token-change.yml).
  - type: input
    id: target
    attributes:
      label: UI block or package
      description: Tells us which code and which maintainers the change concerns.
      placeholder: Accordion, @canonical/router-core …
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: A new property, variant or behaviour, or a change to an existing one. Being specific lets us estimate the work.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: The problem this solves, and where. A change must work for every product using the block, so we need to know what it is for.
    validations:
      required: true
  - type: textarea
    id: visual
    attributes:
      label: Designs or screenshots (optional)
      description: Link a design file or prototype, or drag screenshots here. A visual makes the change faster to understand.
  - type: checkboxes
    id: flags
    attributes:
      label: About this change
      description: Accessibility changes are reviewed separately, and a change with an owner can move faster.
      options:
        - label: This is an accessibility issue.
        - label: I'd like to contribute this myself.
