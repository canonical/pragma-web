name: Propose a change to a UI block or code
description: A UI block or package works as designed, but should gain a property, variant or behaviour, or work differently.
labels:
  - "Type: improvement"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        ### Before you start

        - Search the [open issues](https://github.com/canonical/pragma-web/issues) first. If the issue already exists, add your information there.
        - Components, styles, Storybook, applications and the documentation site are in this repository. The CLI, generators, design tokens and design-system models are in [canonical/pragma-core](https://github.com/canonical/pragma-core/issues/new/choose).
        - Issues are public. Do not include confidential information.
        - If no form fits, [raise something else](https://github.com/canonical/pragma-web/issues/new?template=10-raise-something-else.yml).
  - type: markdown
    attributes:
      value: |
        ### Is this a change?

        Use this form when the UI block or package works as designed and the design itself should change.

        - It does not match its design, documentation or the design tokens: [report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml).
        - The value of a token should change: [propose a token change](https://github.com/canonical/pragma-web/issues/new?template=05-propose-token-change.yml).
        - The change would make it a different block: [propose a new UI block](https://github.com/canonical/pragma-web/issues/new?template=02-propose-ui-block.yml).

        ### Say what changes in the title

        Write the title as **Block: what changes**, for example **Chip: add a removable variant**.

        - Start with the block or package name.
        - Then state what should change, not why: "Accordion: allow several sections open at once", not "Accordion is limiting". The reason has its own field.
        - Propose one change per issue.
  - type: input
    id: target
    attributes:
      label: UI block or package
      placeholder: Accordion, @canonical/router-core …
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change
      description: A new property, variant or behaviour, or a change to an existing one.
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: Use case
      description: The problem this solves, and where. A change must work for every product that uses the block.
    validations:
      required: true
  - type: textarea
    id: visual
    attributes:
      label: Designs or screenshots (optional)
      description: A design file, prototype or screenshots.
  - type: checkboxes
    id: flags
    attributes:
      label: About this change
      options:
        - label: This is an accessibility issue.
        - label: I'd like to contribute this myself.
  - type: markdown
    attributes:
      value: |
        ### What happens next

        The Pragma team triages new issues, usually within a week. Triage may add labels, ask questions or move the issue to the correct repository. Updates are posted on this issue.

        If you offered to contribute, a maintainer will confirm the approach before you start.
