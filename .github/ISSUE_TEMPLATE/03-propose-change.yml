name: Propose a change
description: A UI block, design token, documentation page or tool works as designed, but should work differently.
labels:
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        Search the [open issues](https://github.com/canonical/pragma-web/issues) first. Issues are public: do not include confidential information.

        Use this form when something works as designed, but the design should change. If it does not match its design, documentation or tokens, [report a problem](https://github.com/canonical/pragma-web/issues/new?template=01-report-problem.yml).

        Title: **Thing: what changes**, for example **Chip: add a removable variant**. One change per issue.
  - type: dropdown
    id: kind
    attributes:
      label: What do you want to change?
      options:
        - UI block
        - Design token
        - Documentation
        - Tooling
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should change, and what it affects
      description: "The change and why it is needed, then the products, pages or components it affects. A change must work for every product that uses it. For a token: current and proposed values."
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: Designs and references
      description: Figma, prototypes or screenshots.
  - type: dropdown
    id: contribution
    attributes:
      label: Will you do this yourself?
      options:
        - "No"
        - "Yes"
      default: 0
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        **What happens next:** Triage usually replies within a week. Updates are posted on this issue. If you will do it yourself, wait for a maintainer to confirm the approach.
