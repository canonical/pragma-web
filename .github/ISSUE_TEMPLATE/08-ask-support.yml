name: Ask for support or a review
description: Get help using Pragma, or ask the team to review how your project uses it.
labels:
  - "Type: support"
  - "Status: needs triage"
body:
  - type: input
    id: project
    attributes:
      label: Project or repository
      description: A link to the project, repository or pull request.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Question, or what to review
      description: What you need help with, or which parts to review.
    validations:
      required: true
