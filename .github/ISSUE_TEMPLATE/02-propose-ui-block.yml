name: Propose a new UI block
description: Pragma is missing a component or pattern your product needs.
title: "New UI block: "
labels:
  - "Type: UI block"
  - "Discipline: design"
  - "Discipline: eng"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        ### Before you start

        - Search the [open issues](https://github.com/canonical/pragma-web/issues) first. If the issue already exists, add your information there.
        - Components, styles, Storybook, applications and the documentation site are in this repository. The CLI, generators, design tokens and design-system models are in [canonical/pragma-core](https://github.com/canonical/pragma-core/issues/new/choose).
        - Issues are public. Do not include confidential information.
        - If no form fits, [raise something else](https://github.com/canonical/pragma-web/issues/new?template=10-raise-something-else.yml).
  - type: markdown
    attributes:
      value: |
        ### Is this a new UI block?

        Use this form when no Pragma component, pattern or layout covers the need. A UI block must serve several products, not a single application.

        - A block exists but lacks a property, variant or behaviour: [propose a change](https://github.com/canonical/pragma-web/issues/new?template=03-propose-change.yml).
        - The block exists in one product and other products need it: [propose moving it to a higher tier](https://github.com/canonical/pragma-web/issues/new?template=06-propose-tier-promotion.yml).
        - You need an icon or illustration, not a component: [contribute assets](https://github.com/canonical/pragma-web/issues/new?template=07-contribute-assets.yml).

        ### Name the block in the title

        Complete the title with the name of the block, for example **New UI block: Date picker**.

        - Name what it is, not the problem it solves: "Date picker", not "Need a way to pick dates". The problem has its own field.
        - Use the name the block is commonly known by. If unsure, give your best guess; triage may rename it.
        - Propose one block per issue.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of UI block
      options:
        - Component
        - Pattern
        - Layout
        - Not sure
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      placeholder: Lets users pick a single date or a range from a calendar.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What users cannot do today, or do badly. A new block is assessed against the problem it solves.
    validations:
      required: true
  - type: input
    id: tiers
    attributes:
      label: Tiers it serves
      description: Determines where the block lives and who maintains it. For example Global, Apps, Sites, Stores, or a product such as apps/lxd.
      placeholder: Apps, Sites
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where it will be used
      description: Products, pages and scenarios. Used to assess how widely the block is needed and to inform its design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing UI blocks you tried, and why they do not fit. Used to check whether an existing block can be extended instead.
  - type: textarea
    id: states
    attributes:
      label: States and responsive behaviour
      description: For example open and closed, and how it adapts from small screens up.
  - type: textarea
    id: visual
    attributes:
      label: Designs or sketches (optional)
      description: A design file, prototype, sketch or screenshot.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I'd like to contribute this myself.
  - type: markdown
    attributes:
      value: |
        ### What happens next

        The Pragma team triages new issues, usually within a week. Triage may add labels, ask questions or move the issue to the correct repository. Updates are posted on this issue.

        If you offered to contribute, a maintainer will confirm the approach before you start.
