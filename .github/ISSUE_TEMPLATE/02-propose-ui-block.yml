name: Propose a new UI block
description: Pragma is missing a component or pattern your product needs.
title: "New UI block: "
labels:
  - "Type: UI block"
  - "Discipline: design"
  - "Discipline: eng"
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        ### Name the block in the title

        Complete the title above with the name of the block, for example **New UI block: Date picker**. The title is how people find the proposal, spot duplicates and refer to it, so:

        - **Name what it is, not the problem it solves.** "Date picker", not "Need a way to pick dates". The problem has its own field below.
        - **Use the name people already know it by**, from another design system or from your team. If you are not sure, give your best guess; triage may rename it.
        - **Propose one block per issue**, so each can be discussed and accepted on its own.

        Before filing, check that the block does not already exist in Pragma and has not already been [proposed](https://github.com/canonical/pragma-web/issues). A UI block in Pragma must serve a range of products, not a single application.
  - type: dropdown
    id: kind
    attributes:
      label: Kind of UI block
      description: Components, patterns and layouts are specified and reviewed differently.
      options:
        - Component
        - Pattern
        - Layout
        - Not sure
    validations:
      required: true
  - type: input
    id: summary
    attributes:
      label: Summary
      description: One sentence describing what the block does.
      placeholder: Lets users pick a single date or a range from a calendar.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem it solves
      description: What users cannot do today, or do badly. A new block is assessed against the problem it solves.
    validations:
      required: true
  - type: input
    id: tiers
    attributes:
      label: Tiers it serves
      description: Determines where the block lives and who maintains it. For example Global, Apps, Sites, Stores, or a product such as apps/lxd.
      placeholder: Apps, Sites
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Where it will be used
      description: Products, pages and scenarios. Used to assess how widely the block is needed and to inform its design.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing UI blocks you tried, and why they do not fit. Used to check whether an existing block can be extended instead.
  - type: textarea
    id: states
    attributes:
      label: States and responsive behaviour
      description: Its states (for example open and closed), and how it adapts from small screens up.
  - type: textarea
    id: visual
    attributes:
      label: Designs or sketches (optional)
      description: A design file, prototype, sketch or screenshot.
  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: Used to identify whether the work has an owner.
      options:
        - label: I'd like to contribute this myself.
