name: Raise something else
description: Anything the other templates do not cover.
labels:
  - "Status: needs triage"
body:
  - type: markdown
    attributes:
      value: |
        ### Before you start

        - Search the [open issues](https://github.com/canonical/pragma-web/issues) first. If the issue already exists, add your information there.
        - Components, styles, Storybook, applications and the documentation site are in this repository. The CLI, generators, design tokens and design-system models are in [canonical/pragma-core](https://github.com/canonical/pragma-core/issues/new/choose).
        - Issues are public. Do not include confidential information.
        - If no form fits, [raise something else](https://github.com/canonical/pragma-web/issues/new?template=10-raise-something-else.yml).
  - type: markdown
    attributes:
      value: |
        ### Does another form fit?

        Use this form only if no other form fits. Most requests are a bug ([report a bug](https://github.com/canonical/pragma-web/issues/new?template=01-report-bug.yml)), a change ([propose a change](https://github.com/canonical/pragma-web/issues/new?template=03-propose-change.yml)), a new UI block ([propose a new UI block](https://github.com/canonical/pragma-web/issues/new?template=02-propose-ui-block.yml)) or a documentation change ([propose a documentation change](https://github.com/canonical/pragma-web/issues/new?template=04-propose-docs-change.yml)).
  - type: textarea
    id: description
    attributes:
      label: Description
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ### What happens next

        The Pragma team triages new issues, usually within a week. Triage may add labels, ask questions or move the issue to the correct repository. Updates are posted on this issue.
