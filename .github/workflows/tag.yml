name: Update package versions
on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type. If not 'stable', the current version will be bumped as a pre-release instead of a stable release."
        # TODO change default to stable after 1.0.0 is out
        default: "experimental"
        required: false
        type: choice
        options:
          - "experimental"
          - "alpha"
          - "beta"
          - "rc"
          - "stable"
      publish_version:
        description: "Recovery only: publish this existing release (e.g. 0.45.0, no 'v') without building or bumping. Leave empty for a normal release."
        default: ""
        required: false
        type: string
env:
  MAIN_BRANCH: "refs/heads/main"

jobs:
  build:
    name: Build
    # Publish-only recovery skips the whole bump chain: check, test and version
    # all need this job, so skipping it skips them.
    if: inputs.publish_version == ''
    runs-on: ubuntu-latest
    steps:
      - name: Validate input
        run: |
          if [[ "${{ github.ref }}" != "${{ env.MAIN_BRANCH }}" ]]; then
            echo "This action can only be run on the main branch"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env

  check:
    name: Code quality checks
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Code quality checks
        run: bun run check

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Setup environment
        uses: ./.github/actions/setup-env

        # The full suite always includes the browser suites — no detection.
      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.OS_VERSION }}-${{ hashFiles('bun.lock') }}

      - name: Install Playwright browsers
        env:
          INSTALL_PLAYWRIGHT: 'true'
        run: bash .github/actions/setup-env/install-playwright.sh

      - name: Test
        run: bun run test

  version:
    name: Bump package versions
    runs-on: ubuntu-latest
    needs: [check, test]
    outputs:
      VERSION: ${{ steps.lerna_version.outputs.VERSION }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ssh-key: ${{ secrets.DEPLOY_KEY }}
          fetch-depth: 0

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Bump package versions, commit, tag, and push to Git
        id: lerna_version
        uses: ./.github/actions/lerna-version
        with:
          release_type: ${{ github.event.inputs.release_type }}

  publish:
    name: Publish packages
    runs-on: ubuntu-latest
    needs: version
    # Runs after a successful bump, or alone to publish an existing tag that a
    # failed publish left behind. `from-package` makes either case idempotent.
    # The recovery path lives in this workflow, not a separate one, because npm
    # trusted publishing is bound to the `tag.yml` filename.
    if: ${{ !cancelled() && (needs.version.result == 'success' || inputs.publish_version != '') }}
    env:
      VERSION: ${{ inputs.publish_version || needs.version.outputs.VERSION }}
    # OIDC trusted publishing: GitHub mints a short-lived npm token at publish
    # time instead of using a long-lived NPM_AUTH_TOKEN secret.
    # contents:write lets the job create the GitHub Release for the tag.
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ env.VERSION }}
          fetch-depth: 0

      - name: Setup Environment
        uses: ./.github/actions/setup-env

      - name: Setup Node, authenticate with NPM registry
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # The tag's tree is what gets published, but the release tooling must
      # come from this workflow's own commit: a tag cut before an action existed
      # or changed would otherwise run missing or stale tooling (the v0.45.0 /
      # v0.46.0 recovery failed exactly so). Checked out untracked beside the
      # tag, which lerna's clean-tree check (`git describe --dirty`) ignores;
      # non-cone so no root files land in the workspace.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: .release-tooling
          sparse-checkout: /.github/actions/
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Publish packages
        uses: ./.release-tooling/.github/actions/npm-publish
        with:
          version: ${{ env.VERSION }}

      - name: Create GitHub Release with artifacts
        uses: ./.release-tooling/.github/actions/github-release
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          version: ${{ env.VERSION }}
