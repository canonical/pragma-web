---
# CommandPaletteTitle — a result's title as text: the link renderer the
# palette hands the rows of its listbox. An option is chosen as a whole, by
# Enter in the field or a click anywhere on its row, so the title it holds
# is a plain span, never a link (cs:react.component.link_component: a
# non-navigable item renders a plain element). It takes the href a row hands
# its link and drops it; the row's own title rule styles it.
#
# Why not a published component: the LinkComponent contract has no inert
# renderer.
node:
  uri: prism.component.command_palette_title
  edges:
    - node:
        role: text
      relation: { cardinality: "1", slotName: default }
