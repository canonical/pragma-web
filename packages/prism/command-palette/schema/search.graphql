# The search extension the command palette reads: the graph's nodes by text,
# ranked. It is no part of the contract, so the package is Tier 2: it runs
# on a provider that serves this extension beside the contract.
# `scripts/writeSchema.ts` merges it into the contract SDL for the package's
# relay project.

extend type Query {
  "Every node whose title, CURIE or definition contains `text`, ignoring case, ranked best first; `types` keeps the results whose type is one of the IRIs given."
  search(
    text: String!
    first: Int
    after: String
    types: [ID!]
  ): SearchConnection!
}

"A page of search results, ranked best first."
type SearchConnection {
  edges: [SearchEdge!]!
  pageInfo: PageInfo!
  "Every match after the `types` filter, before paging."
  total: Int!
  "One entry per type with matches, counted without the `types` filter."
  facets: [TypeFacet!]!
}

"One search result with its cursor and its match."
type SearchEdge {
  node: Node!
  cursor: String!
  match: SearchMatch!
}

"Where the search text matched a result."
type SearchMatch {
  "The predicate the match is in, as a CURIE, or `uri` for the CURIE."
  field: String!
  "At most 160 characters of the matched value around the first occurrence."
  passage: String!
  ranges: [MatchRange!]!
}

"One occurrence of the search text in a passage."
type MatchRange {
  start: Int!
  length: Int!
}

"The number of matches of one type."
type TypeFacet {
  type: OntologyClass!
  count: Int!
}
