---
# EntityPanel (lens-entity src/lib/ui/EntityPanel/): the details panel, PS15
# V2. Identity (mark, name, class, address) with Open beside the title,
# prominent values open as a KeyValueList, then every other outgoing group
# (a value, a value held by the entity such as a line's routes, a relation)
# and each Referenced by group as a closed <details> (Accordion item, works
# without JS) whose summary carries the label and the count. Not a second
# SectionedView. No useId: aria-labels and fixed ids only.
#
# Every group is a native <details> without styles of its own, so it
# keeps the browser's disclosure marker and works without JS.
#
# Token ledger (on `.ds.entity-panel`):
#   --entity-panel-gap: --grid-gutter                 between blocks
#   --entity-panel-count-color: color.text.muted      counts in summaries
node:
  uri: prism.component.entity_panel
  element: section
  styles: { layout.type: flex, layout.direction: column, spacing.gap: grid.gutter }
  edges:
    - node:
        role: identity
        element: header
        styles: { layout.type: flex, layout.direction: column, spacing.gap: grid.gutter }
        edges:
          - node:
              role: headline
              element: div
              styles: { layout.type: flex, layout.wrap: wrap, spacing.gap: grid.gutter }
              edges:
                - node: { role: title, element: h2, styles: { spacing.external.block.start: 0, spacing.external.block.end: 0 } }
                  relation: { cardinality: "1", slotName: title }   # h2, or h3 under a heading
                - node: { role: open, element: a }
                  relation: { cardinality: "0..1", slotName: open }  # Open, when the entity has a home
            relation: { cardinality: "1", slotName: headline }
          - node: { role: kind, element: p, styles: { layout.type: flex, layout.wrap: wrap, spacing.gap: grid.gutter, spacing.external.block.start: 0, spacing.external.block.end: 0 } }
            relation: { cardinality: "1", slotName: kind }   # class chip + address
      relation: { cardinality: "0..1", slotName: identity }
    - node: { role: not-found, element: p, styles: { spacing.external.block.start: 0, spacing.external.block.end: 0, typography.color: color.text.muted } }
      relation: { cardinality: "0..1", slotName: not-found }   # instead of every other part
    - node: { role: values, element: dl }
      relation: { cardinality: "0..1", slotName: values }      # the prominent values
    - node:
        role: group
        element: details
        edges:
          - node: { role: summary, element: summary }
            relation: { cardinality: "1", slotName: summary }  # label + count
          - node: { role: body, element: div }
            relation: { cardinality: "1", slotName: body }     # StatementGroup
      relation: { cardinality: "0..*", slotName: group }       # any other outgoing group, closed
    - node:
        role: referenced-by
        element: section
        styles: { layout.type: flex, layout.direction: column, spacing.gap: grid.gutter }
        edges:
          - node: { role: heading, element: h3, styles: { spacing.external.block.start: 0, spacing.external.block.end: 0 } }
            relation: { cardinality: "1", slotName: heading }
          - node:
              role: group
              element: details
              edges:
                - node: { role: summary, element: summary }
                  relation: { cardinality: "1", slotName: summary }  # label + count
                - node: { role: body, element: div }
                  relation: { cardinality: "1", slotName: body }     # StatementGroup
            relation: { cardinality: "1..*", slotName: group }   # an incoming group, closed
      relation: { cardinality: "0..1", slotName: referenced-by }
