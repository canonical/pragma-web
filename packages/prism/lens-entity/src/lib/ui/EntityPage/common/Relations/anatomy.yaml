---
# Relations — the relations the entity's class declares, its fields of
# object kind, as key values: the key is the field's name in the published
# InlineCode, the value one sentence from the catalog: the class its values
# belong to (compact, in InlineCode) and how many it takes. It lists what
# the class declares, not the entities this one is related to. A class with
# no relation says so.
#
# A section labelled by its heading, a subgrid of the page over every
# column, its gap the grid's gutter on both axes; the heading and the empty
# line span it, and the key values place themselves. The section stands
# one default step of block space below what precedes it, external spacing
# on the section.
#
# Every decision is read through a component token declared on the root
# (`--relations-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1": structure, a span in columns.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# container.gap.default.
node:
  uri: prism.subcomponent.relations
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
    spacing.external.block.start: container.gap.default
  edges:
    - node:
        role: heading (the level-2 heading)
        styles:
          layout.grid.column: "1 / -1"
      relation: { cardinality: "1", slotName: heading }
    - node:
        role: empty (the class declares no relation)
        styles:
          layout.grid.column: "1 / -1"
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: empty }
    - node:
        uri: prism.subcomponent.key_value_list
      relation: { cardinality: "0..1", slotName: key-values }
