---
# EntityHeader: the page's
# <header>: the class's mark before the name (h1), the summary, the status
# line (class, address as code, then core's CopyButton, "Copied"
# announced through its live region). Same parts as the docs component page.
# Reference: PS9 V1 header; ruling 40.
#
# Token ledger (on `.ds.entity-header`):
#   --entity-header-gap: --grid-gutter                 between rows
#   --entity-header-address-color: color.text.muted    the address only; the
#                                                      kind chip and Copy keep
#                                                      their own colours
node:
  uri: prism.subcomponent.entity_header
  element: header
  styles: { layout.type: grid, layout.grid.columns: subgrid, layout.grid.column: "1 / -1", spacing.gap: grid.gutter }
  edges:
    - node:
        role: title
        element: h1
        styles: { layout.grid.column: "1 / -1", layout.type: flex, layout.align: baseline, spacing.gap: grid.gutter }
        edges:
          - node: { role: mark, element: svg }              # EntityIcon, before the name
            relation: { cardinality: "1", slotName: mark }
      relation: { cardinality: "1", slotName: title }
    - node: { role: summary, element: p, styles: { layout.grid.column: "1 / -1", spacing.external.block.start: 0, spacing.external.block.end: 0 } }
      relation: { cardinality: "0..1", slotName: summary }
    - node:
        role: status
        element: p
        styles: { layout.grid.column: "1 / -1", layout.type: flex, layout.wrap: wrap, layout.align: baseline, spacing.gap: grid.gutter, spacing.external.block.start: 0, spacing.external.block.end: 0 }
        edges:
          - node: { role: kind, element: span }             # the class's chip, its own colours
            relation: { cardinality: "1", slotName: kind }
          # The address and its Copy wrap together: one flex item that does
          # not wrap; a long address breaks inside its own box beside Copy.
          - node:
              role: locator
              element: span
              styles: { layout.type: flex, layout.wrap: nowrap, layout.align: baseline, spacing.gap: grid.gutter, size.min.width: 0 }
              edges:
                - node: { role: address, element: code, styles: { typography.color: color.text.muted, size.min.width: 0, typography.wrap: anywhere } }
                  relation: { cardinality: "1", slotName: address }
                - node: { role: copy, element: CopyButton }   # core's; announces "Copied"
                  relation: { cardinality: "1", slotName: copy }
            relation: { cardinality: "1", slotName: locator }
      relation: { cardinality: "1", slotName: status }
