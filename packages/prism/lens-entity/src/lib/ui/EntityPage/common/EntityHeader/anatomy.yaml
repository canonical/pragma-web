---
# EntityHeader: the page's
# <header>: the class's mark before the name (h1), the summary, the status
# line (class, address as code, then core's CopyButton, "Copied"
# announced through its live region). Same parts as the docs component page.
# Reference: PS9 V1 header; ruling 40.
#
# Token ledger (on `.ds.entity-header`):
#   --entity-header-gap: --grid-gutter                 between rows
#   --entity-header-status-color: color.text.muted     status line
node:
  uri: prism.subcomponent.entity_header
  element: header
  styles: { layout.type: grid, layout.grid.columns: subgrid, layout.grid.column: "1 / -1", spacing.gap: grid.gutter }
  edges:
    - node: { role: title, element: h1, styles: { layout.grid.column: "1 / -1", layout.type: flex, layout.align: baseline, spacing.gap: grid.gutter } }
      relation: { cardinality: "1", slotName: title }       # EntityIcon mark + name
    - node: { role: summary, element: p, styles: { layout.grid.column: "1 / -1", spacing.external.block.start: 0, spacing.external.block.end: 0 } }
      relation: { cardinality: "0..1", slotName: summary }
    - node: { role: status, element: p, styles: { layout.grid.column: "1 / -1", layout.type: flex, layout.wrap: wrap, layout.align: baseline, spacing.gap: grid.gutter, typography.color: color.text.muted, spacing.external.block.start: 0, spacing.external.block.end: 0 } }
      relation: { cardinality: "1", slotName: status }      # class · address · CopyButton
