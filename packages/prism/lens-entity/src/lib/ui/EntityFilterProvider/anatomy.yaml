---
# EntityFilterProvider — the reader's filter (the search box's text),
# shared by the strip's controls and the index; it starts from the default
# on every visit. A context provider: it renders no element and binds no
# style, and it follows the provider structure (Provider.tsx, Context.tsx,
# hooks/), so the folder has no stylesheet and no stories.
node:
  uri: prism.component.entity_filter_provider
  edges:
    - node:
        role: the strip and the routed page, sharing one filter
      relation: { cardinality: "1", slotName: default }
