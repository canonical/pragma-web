---
# EntityStatus — the index's count, the strip's or the panel's: how many
# loaded entries the search shows, out of how many instances the class has,
# counted with the matcher the index filters by over the index's own
# operation and the address's search text. It renders core's count line
# with an exact total and the catalog's plural noun, and binds no style of
# its own.
#
# Token ledger: none.
node:
  uri: prism.subcomponent.entity_status
  edges:
    - node:
        uri: prism.component.count_line
      relation: { cardinality: "1", slotName: default }
