---
# EntityView — the strip's view tenant: the renderers the page offers, the
# index's list renderers or an entity page's page renderers, resolved from
# the lens's declaration over the site's defaults, as core's renderer
# switch. It renders the switch, whose own anatomy owns the markup, so it
# binds no style.
node:
  uri: prism.subcomponent.entity_view
  edges:
    - node:
        uri: prism.component.renderer_switch
      relation: { cardinality: "1" }
