---
# EntityIndex — the bound class's loaded instances, narrowed by the
# address's search text, in the renderer the address names: the lens's
# list renderers over the site's defaults, each drawing the shared list
# view (EntityList). Its entries are the site's card projections in the
# `cards` renderer and its row projections in any other, which dispatch on
# each node's type, so a site's arm renders its entries and links each to
# its home. A class with no instance, or a search that hides every loaded
# one, shows the list view's empty line. Then the explicit "Load more",
# the published Button at secondary importance, busy while the next page
# loads, while the graph has more.
#
# A lens that places its filters in a panel gets the panel first: core's
# filter panel (the count and the search) on the first two columns, the
# list and the Load more line beside it.
#
# A subgrid of the page over every column, its gap the grid's gutter on
# both axes: the list (a subgrid itself) and the Load more line each span
# the whole main column without a panel.
#
# Every decision is read through a component token declared on the root
# (`--entity-index-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column spans: structure, a span in columns.
#
# Reflow, bound in styles.css:
#   `.ds.entity-index:has(> .panel)` the list and the Load more line span
#     `3 / -1`, beside the panel.
#   @container shell (width < 912px)  below two groups: the panel is not
#     displayed and the list and the Load more line span every column; the
#     sheet holds the filters.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: prism.subcomponent.entity_index
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - node:
        role: panel
        styles:
          layout.grid.column: "1 / span 2"
        edges:
          - node:
              uri: prism.component.filter_panel
            relation: { cardinality: "1" }
      relation: { cardinality: "0..1", slotName: panel }
    - node:
        role: list
        styles:
          layout.type: grid
          layout.grid.columns: subgrid
          layout.grid.column: "1 / -1"
          spacing.gap: grid.gutter
        edges:
          - node:
              uri: prism.component.entity_list
              edges:
                - switch:
                    on: props
                    cases:
                      - uri: prism.component.row_projection
                      - uri: prism.component.card_projection
                  relation: { cardinality: "0..*", slotName: items }
            relation: { cardinality: "1" }
      relation: { cardinality: "1", slotName: list }
    - node:
        role: more (holds the Load more button at its own width)
        styles:
          layout.grid.column: "1 / -1"
        edges:
          - node:
              uri: global.component.button
            relation: { cardinality: "1" }
      relation: { cardinality: "0..1", slotName: more }
