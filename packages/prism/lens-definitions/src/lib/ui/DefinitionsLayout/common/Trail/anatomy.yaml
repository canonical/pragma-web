---
# Trail — the strip's context: the lens's breadcrumbs, which end at the
# lens on a term's view, its address never a crumb. It renders no element of its own: the breadcrumbs render it.
node:
  uri: prism.component.trail
  edges:
    - node:
        uri: prism.component.lens_breadcrumbs
      relation: { cardinality: "1" }
