---
# ExplorerStatus — the explorer's status figure in the mode strip: how many
# classes the filter shows out of how many exist, and how many are
# abstract, in words, beside a bar whose fill is the same share.
# The caption is the accessible channel, the bar the glanceable one.
# Reference: the ontology explorer's status line.
#
# Why not a published component: the published meters carry no caption of
# counts; this one is a figure with a decorative bar.
#
# The fill's width is the inline channel `--explorer-status-share`, the
# one computed value no stylesheet can hold.
#
# Every decision is read through a component token declared on the root
# (`--explorer-status-*`), bound to the symbol or the literal named here.
#
# Token ledger:
#   999px: the bar's pill; no radius token is a pill.
#   space.050, space.100, space.800: the bar's height, the gap beside it
#     and the bar's width; no semantic gap is admitted inside the strip.
#
# Roster namespaces (accepted and tracked): space.050, space.100,
# space.800, and the semantic typography symbol
# typography.text.secondary.fontSize.
node:
  uri: prism.component.explorer_status
  styles:
    layout.type: flex
    layout.align: center
    spacing.gap: space.100
    spacing.external.block.start: 0
    spacing.external.block.end: 0
    spacing.external.inline.start: 0
    spacing.external.inline.end: 0
    typography.size: typography.text.secondary.fontSize
    typography.color: color.text.muted
    typography.whiteSpace: nowrap
  edges:
    - node:
        role: bar
        styles:
          size.inline: space.800
          size.block: space.050
          appearance.radius: 999px
          appearance.background: color.border.muted
          layout.overflow: hidden
        edges:
          - node:
              role: fill
              styles:
                layout.type: block
                size.block: 100%
                size.inline: explorer.status.share
                appearance.background: color.text.muted
            relation: { cardinality: "1", slotName: fill }
      relation: { cardinality: "1", slotName: bar }
    - node:
        role: caption
        styles:
          typography.variant.numeric: tabular-nums
      relation: { cardinality: "1", slotName: caption }
