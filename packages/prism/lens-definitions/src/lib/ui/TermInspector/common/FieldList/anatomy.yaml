---
# FieldList — a class's fields in the inspector: one row each, the field's
# link, its range as code and its notes, its definition beneath, quieter.
# A subgrid of the inspector's three columns, and each row a subgrid of
# it: the name on the first column, the range on the second, the notes on
# the third, the definition across all three, so every row's cells line up
# with the rows above; a cell wraps inside its column. Its gap is the
# grid's gutter.
# Reference: the ontology explorer's inspector field rows.
#
# Why not a published component: the published lists carry no record
# rows; the range is the published InlineCode.
#
# Every decision is read through a component token declared on the root
# (`--field-list-*`), bound to the symbol named here.
#
# Roster namespaces (accepted and tracked): grid.gutter, and the semantic
# typography symbols.
node:
  uri: prism.component.field_list
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
    spacing.external.block.start: 0
    spacing.external.block.end: 0
    spacing.internal.inline.start: 0
    layout.listStyle: none
  edges:
    - node:
        role: row
        styles:
          layout.type: grid
          layout.grid.columns: subgrid
          layout.grid.column: "1 / -1"
          layout.align: baseline
          spacing.gap: grid.gutter
        edges:
          - node:
              role: field
              styles:
                layout.grid.column: "1 / span 1"
                typography.wrap: anywhere
            relation: { cardinality: "1", slotName: field }
          - node:
              role: range
              styles:
                layout.grid.column: "2 / span 1"
                typography.wrap: anywhere
            relation: { cardinality: "1", slotName: range }
          - node:
              role: notes
              styles:
                layout.grid.column: "3 / -1"
                typography.size: typography.text.secondary.fontSize
                typography.color: color.text.muted
            relation: { cardinality: "1", slotName: notes }
          - node:
              role: definition
              styles:
                layout.grid.column: "1 / -1"
                typography.size: typography.text.secondary.fontSize
                typography.color: color.text.muted
            relation: { cardinality: "0..1", slotName: definition }
      relation: { cardinality: "1..*", slotName: row }
