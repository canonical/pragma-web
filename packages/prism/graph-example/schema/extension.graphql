# =============================================================================
# This provider's own types, appended to the authored contract SDL.
#
# WHY THIS FILE EXISTS AT ALL. The contract declares exactly one type that
# `implements Node` — OntologyClass. A NodeConnection built from the contract
# alone can therefore contain nothing but ontology classes: there is no type
# an ABox entity could be. Every provider must extend the contract SDL with
# its own concrete Node implementers, and that extension is precisely what the
# contract's superset rule is for (contract.graphql:39-42). `buildSchema` over
# the contract alone cannot serve instance data.
#
# TWO ROOT FIELDS ARE ADDED: `prose` and `search`, at the end of this file.
# Every entity type below is reachable through the contract's own root
# fields — `node(id:)` and `OntologyClass.instances` — and adding a root
# field for them would have been easier and would have proved less: the
# point is that the contract's five roots suffice for the graph. Prose and
# search are not part of the contract; they are provider extensions, and
# each is a root field because that is the one position a reader can select
# the same way against every provider that offers it. A compiled provider
# can add fields only to the object types it generates and to Query, never
# to `Node`, so a field on each concrete type would need a type-specific
# fragment to read.
# =============================================================================

"""
A metro line. A root class in the TBox (no superclass), so it demonstrates
that `OntologyClass.superclass` is legitimately null.

`code` is the short code passengers know the line by ("1", "R1"), and
`colour` is its colour on maps and signs, as a lowercase `#rrggbb` hex
triplet. Both are non-null: a line without them cannot be drawn or signed.

`routes` lists the directions the line runs. A line does not carry an order of
its own; each route carries its ordered calls, because direction is data.
`servedBy` is the set of stops those calls visit, read as the inverse of
`Stop.servesLine`.

`formations` lists the formations the line is run with, in authored order. A
line may be run by more than one rolling stock.
"""
type Line implements Node {
  uri: ID!
  _meta: EntityMeta!
  name: String
  servedBy: [Stop!]!
  code: String!
  colour: String!
  routes: [Route!]!
  formations: [Formation!]!
}

"""
Anything that serves a line: the GraphQL face of the TBox's `metro:Stop`
class, which `Station` and its subclass `Interchange` both instantiate.

WHY IT HAS TO EXIST. `Line.servedBy` walks the inverse of `servesLine`, and
both concrete types carry that property — so the list genuinely holds a mix.
Declaring it `[Station!]!` said otherwise: an `Interchange` came back through
it dressed as a `Station`, `... on Interchange` could not be written against
it, and the schema disagreed with the values it served. GraphQL has no type
inheritance, so the TBox's subclassing cannot carry the list; an interface
can, and this is the smallest one that does.

It does NOT try to mirror the class tree. `Stop` is one interface over the
fields both implementers share; the hierarchy itself still lives in the TBox
and shows up through `superclasses` / `subclasses` / `inherited`.

`platformLength` is the usable length of the station's shortest platform, in
whole millimetres, the unit a formation's `length` is measured in, so the two
compare directly. It is null for a station no route calls at.
"""
interface Stop implements Node {
  uri: ID!
  _meta: EntityMeta!
  name: String
  platformCount: Int
  platformLength: Int
  location: GeoPoint
  servesLine: [Line!]!
  inZone: Zone
  diagramPosition: DiagramPoint
}

"""
A station on the network. `name` is nullable in GraphQL even though the TBox
marks `metro:name` required on this class: SHACL cardinality is an assertion
about the data, and this dataset deliberately contains stations that violate
it so `_meta.title`'s fallback chain has something to fall back from.
"""
type Station implements Node & Stop {
  uri: ID!
  _meta: EntityMeta!
  name: String
  platformCount: Int
  platformLength: Int
  location: GeoPoint
  servesLine: [Line!]!
  inZone: Zone
  diagramPosition: DiagramPoint
}

"""
A fare band. Lives in the SECOND namespace (`geo:`), which is the point: with
entities in only one namespace, a `_meta.curie` implementation could hardcode
a single prefix and still look correct on every row.
"""
type Zone implements Node {
  uri: ID!
  _meta: EntityMeta!
  name: String
}

"""
A station where two or more lines meet — a subclass of Station in the TBox.
GraphQL has no type inheritance, so the relationship lives entirely in the
TBox and shows up through `superclasses` / `subclasses` / `inherited`.
"""
type Interchange implements Node & Stop {
  uri: ID!
  _meta: EntityMeta!
  name: String
  platformCount: Int
  platformLength: Int
  location: GeoPoint
  servesLine: [Line!]!
  inZone: Zone
  diagramPosition: DiagramPoint
  transferMinutes: Int
}

"""
A latitude/longitude pair. NOT a Node: it has no IRI, so it is unreachable
through `node(id:)` and can never appear in a NodeConnection.

The contract does not require an embeddable — nothing in it references a
non-Node value type. This one exists to probe the last tier of `_meta.title`'s
fallback chain (the typename tier, reached only when there is no IRI to fall
back to) and to show that a provider may add value types freely. Note that it
still carries `_meta: EntityMeta!`, and EntityMeta.type is non-null, so even a
coordinate pair needs a class in the TBox.
"""
type GeoPoint {
  _meta: EntityMeta!
  latitude: Float!
  longitude: Float!
}

"Long-form Markdown authored for one entity, per language."
type Prose {
  "The text in `lang`, else in the request's locale, else in the default language."
  markdown(lang: String): String!
  "The language `markdown` serves without `lang`: the request's locale when authored, else the default."
  lang: String!
  "Every authored language, the default first, then the rest in code-point order."
  availableLanguages: [String!]!
  "Entities the prose links to across its languages, in order of first mention; destinations node(id:) does not resolve are dropped."
  references: NodeConnection!
}

extend type Query {
  "The prose authored for the entity `uri` names (an absolute IRI), or null when it has none."
  prose(uri: ID!): Prose
  "Nodes whose title, CURIE or definition contains `text`, ignoring case. A title match ranks before a CURIE match, and a CURIE match before a definition match; within one, an earlier match ranks first, then a shorter title, then the title and then the IRI in code-point order. Text that is empty or only whitespace matches nothing. Titles and definitions are read in the default language, en."
  search(text: String!, first: Int, after: String): NodeConnection!
}

"""
One direction of a line's service. NOT a Node: a route has no IRI of its own
and is reached only through `Line.routes`.

Direction is data. The route, not the line, carries the ordered calls, so a
line that runs both ways has two routes, each listing its calls in the order
a passenger meets them.

`label` is the route's name as shown to passengers ("To Marsh End",
"Clockwise"). It is the route's `rdfs:label`, so it agrees with
`_meta.label` and `_meta.title`.

`isLoop` is true when the service continues from the last call back to the
first. The first stop is never repeated at the end of `calls`; the closing
segment is implied.

`reverse` is the same line's route over the same stops the other way. For a
loop that is the same first stop with the rest reversed. It is null when the
line runs one direction only. A ring run by two lines in opposite directions
is two lines with one route each, so neither route has a reverse.
"""
type Route {
  _meta: EntityMeta!
  label: String!
  isLoop: Boolean!
  calls: [Call!]!
  reverse: Route
}

"""
One stop on a route, at its place in the order. NOT a Node: a call exists
only within its route.

`position` is counted from 1, with no gaps, so the calls of a route are
numbered 1 to n in the order the service makes them.
"""
type Call {
  _meta: EntityMeta!
  position: Int!
  stop: Stop!
}

"""
A place on the schematic network diagram. NOT a Node, and NOT a geography:
`Stop.location` says where a station is on the ground, this says where it
sits on the map passengers read.

Coordinates are whole grid units. The origin is the north-west corner, `x`
grows east and `y` grows south, the orientation of a screen, so a drawing
needs no flip. The network is anchored so its smallest `x` and its smallest
`y` are both 0.

Every segment between consecutive calls of a route, and the closing segment
of a loop, is horizontal, vertical or diagonal (octilinear). A station no
route calls at has no position.
"""
type DiagramPoint {
  _meta: EntityMeta!
  x: Int!
  y: Int!
}

"""
A class of train: the cars of one design and the formations they run in. A
root class in the TBox, reachable through `node(id:)` and
`OntologyClass.instances`.

`formations` holds the stock's alternative formations in authored order,
shortest first.
"""
type RollingStock implements Node {
  uri: ID!
  _meta: EntityMeta!
  name: String
  formations: [Formation!]!
}

"""
A train as it runs: an ordered list of units, each possibly reversed. A root
class in the TBox, reachable through `node(id:)` and
`OntologyClass.instances`.

`units` lists the formation's units from its front, positions counted from 1
with no gaps.

`stock` is the rolling stock that lists the formation, and `lines` the lines
run with it, in IRI order. Both are read as inverses of the stock's and the
lines' `formations`, never stored.

`length` and `capacity` are the sums of its units', computed by the provider
and never stored. Lengths are whole millimetres, measured over couplers so
they add up without gaps; capacity is passengers seated plus standing.
"""
type Formation implements Node {
  uri: ID!
  _meta: EntityMeta!
  name: String
  stock: RollingStock!
  units: [UnitPosition!]!
  length: Int!
  capacity: Int!
  lines: [Line!]!
}

"""
A set of cars permanently coupled in order: the smallest part of a train that
runs on its own. A root class in the TBox, reachable through `node(id:)` and
`OntologyClass.instances`.

`cars` lists the unit's cars from its front, positions counted from 1 with no
gaps.

`length` and `capacity` are the sums of its cars' car types, computed by the
provider and never stored. Lengths are whole millimetres, measured over
couplers so they add up without gaps; capacity is passengers seated plus
standing.
"""
type Unit implements Node {
  uri: ID!
  _meta: EntityMeta!
  name: String
  cars: [CarPosition!]!
  length: Int!
  capacity: Int!
}

"""
A kind of car. A root class in the TBox, reachable through `node(id:)` and
`OntologyClass.instances`.

`code` is the short code the car type is known by ("DM" for a driving motor
car, "M" for a motor car, "T" for a trailer). `hasCab` is true when the car
has a driving cab at its leading end.

`length` is in whole millimetres, measured over couplers, and `capacity` is
passengers seated plus standing.
"""
type CarType implements Node {
  uri: ID!
  _meta: EntityMeta!
  name: String
  code: String!
  hasCab: Boolean!
  length: Int!
  capacity: Int!
}

"""
One unit in a formation, at its place in the order. NOT a Node: a unit
position exists only within its formation.

`position` is counted from 1, with no gaps, starting at the formation's front.

`reversed` is true when the unit runs last car first, so an asymmetric unit
coupled back to back with another puts its cab at the far end of the train.
"""
type UnitPosition {
  _meta: EntityMeta!
  position: Int!
  unit: Unit!
  reversed: Boolean!
}

"""
One car in a unit, at its place in the order. NOT a Node: a car position
exists only within its unit.

`position` is counted from 1, with no gaps, starting at the unit's front.

`reversed` is true when the car's leading end faces the rear of its unit, so a
driving car at the back of a unit with its cab facing outwards is reversed. A
car's orientation in a train is its own `reversed` XOR its unit's
`UnitPosition.reversed`.
"""
type CarPosition {
  _meta: EntityMeta!
  position: Int!
  carType: CarType!
  reversed: Boolean!
}
