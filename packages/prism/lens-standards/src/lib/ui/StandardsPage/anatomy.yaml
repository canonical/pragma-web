---
# StandardsPage — the index route's content: the lens's name as the page's
# level-1 heading over the grouped index, inside the error and loading
# boundaries, so the heading stands while the index suspends. It is a page
# of the document archetype: the canvas is the only region that scrolls,
# and nothing here sets a height.
#
# The page uses the whole main column: the root is a subgrid of the
# canvas's page grid over every column, its gap the grid's gutter on both
# axes, and the heading, the loading line and the alert each span it. The
# root does not stretch to the canvas's height, so a short page packs at
# the top, and it ends one loose step of block space above the canvas's
# end. Bespoke: no published component is an index page.
#
# Every decision is read through a component token declared on the root
# (`--standards-page-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1": structure, a span in columns.
#   layout.alignSelf start: a layout keyword.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# container.gap.loose.
node:
  uri: prism.component.standards_page
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    layout.alignSelf: start
    spacing.gap: grid.gutter
    spacing.internal.block.end: container.gap.loose
  edges:
    - node:
        role: heading (the page's level-1 heading, the lens's name)
        styles:
          layout.grid.column: "1 / -1"
      relation: { cardinality: "1", slotName: heading }
    - node:
        role: status (the loading line)
        styles:
          layout.grid.column: "1 / -1"
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: status }
    - node:
        role: alert (the error line, role alert)
        styles:
          layout.grid.column: "1 / -1"
      relation: { cardinality: "0..1", slotName: alert }
    - node:
        uri: prism.component.standards_index
      relation: { cardinality: "0..1", slotName: default }
