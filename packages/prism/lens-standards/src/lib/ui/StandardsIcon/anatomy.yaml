---
# StandardsIcon — the lens's rail glyph, a shield with a check mark: a
# 16-unit stroke drawing in currentColor, always aria-hidden, since the
# rail entry's label names it. It is sized by its `size` prop and coloured
# by its context, so it binds no style.
node:
  uri: prism.component.standards_icon
  edges:
    - node:
        role: shield (a path)
      relation: { cardinality: "1" }
    - node:
        role: check (a path)
      relation: { cardinality: "1" }
