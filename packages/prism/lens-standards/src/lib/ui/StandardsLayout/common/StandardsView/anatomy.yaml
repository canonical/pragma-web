# StandardsView — the strip's view tenant on a standard's reading page:
# the page's renderers (the page and its Turtle, over the site's defaults)
# as core's renderer switch, whose own anatomy owns the markup, so it binds
# no style.
node:
  uri: prism.subcomponent.standards_view
  edges:
    - node:
        uri: prism.component.renderer_switch
      relation: { cardinality: "1" }
