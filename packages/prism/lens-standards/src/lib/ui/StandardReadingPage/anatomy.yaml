---
# StandardReadingPage — a reading route's content: a back link to the index
# over the standard, inside the error and loading boundaries, which the
# address keys, so a new standard starts afresh. The `data-view` marker
# sits on the root, outside the suspending interior. It is a page of the
# document archetype: the canvas is the only region that scrolls, and
# nothing here sets a height.
#
# The page uses the whole main column: the root is a subgrid of the
# canvas's page grid over every column, its gap the grid's gutter on both
# axes, and the back link, the loading line and the alert each span it.
# The root packs at the top and ends one loose step of block space above
# the canvas's end. The back link keeps the site's link style. Bespoke: no
# published component is a reading page.
#
# Every decision is read through a component token declared on the root
# (`--standard-reading-page-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1": structure, a span in columns.
#   layout.alignSelf start: a layout keyword.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# container.gap.loose.
node:
  uri: prism.component.standard_reading_page
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    layout.alignSelf: start
    spacing.gap: grid.gutter
    spacing.internal.block.end: container.gap.loose
  edges:
    - node:
        role: breadcrumb (the back-link navigation, labelled from the catalog)
        styles:
          layout.grid.column: "1 / -1"
        edges:
          - node:
              role: breadcrumb link (the router link to the index)
            relation: { cardinality: "1" }
      relation: { cardinality: "1", slotName: breadcrumb }
    - node:
        role: status (the loading line)
        styles:
          layout.grid.column: "1 / -1"
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: status }
    - node:
        role: alert (the error line, role alert)
        styles:
          layout.grid.column: "1 / -1"
      relation: { cardinality: "0..1", slotName: alert }
    - node:
        uri: prism.subcomponent.standard_detail
      relation: { cardinality: "0..1", slotName: default }
