---
# StandardArticle — a standard as a document, laid on core's sectioned view
# (prism.component.sectioned_view: the article's root is the view's, with
# the article's class beside the view's). It hands the view its header, its
# facts and its sections, in this order:
#   - the header: the title as the page's level-1 heading;
#   - the facts: a KeyValueList of the address and the class;
#   - the section `rule`: the prose rendered from Markdown (StandardProse),
#     or the description split into paragraphs on blank lines, or a line
#     saying there is none;
#   - from the standard's statements, where the site serves them, each
#     section only when it has a value: `do` and `dont`, the examples
#     (`cs:do`, `cs:dont`: a description, then the code in its language);
#     `related`, the standards it extends (`cs:extends`) as chips; and
#     `applies-to`, what points at the standard, as chips. A section whose
#     group is cut at its bound ends with one muted line, "12 of 30 shown".
# A reader that draws the standard another way passes it as `source`: it
# stands in place of the sections (Turtle shows the standard's statements),
# and the page has no section and no index.
#
# The view places the regions on the page's columns; the article styles
# what it puts in them. The header holds the title alone. The rule's
# prose takes the section's every column,
# flush left; the view holds a prose (`.editorial`) to the 75ch reading
# measure, so the article sets none. Its space is element-owned:
# `.editorial` gives its headings and paragraphs their space after, and
# `.content-flow` clears the last block's. A description keeps its
# hand-written line breaks.
#
# Token ledger:
#   layout.grid.column "1 / -1" (header, prose, examples, chips, shown):
#     structure.
#   typography.whiteSpace pre-line: a keyword.
#   --standard-article-gap: var(--grid-gutter), the gap between chips.
#   --standard-article-shown-color: var(--color-text-muted), the muted
#     "N of M shown" line.
node:
  uri: prism.component.standard_article
  edges:
    - node:
        role: masthead (the page's header, in the view's header region)
        element: header
        styles:
          layout.grid.column: "1 / -1"
        edges:
          - node:
              role: heading (the page's level-1 heading, the standard's title)
            relation: { cardinality: "1" }
      relation: { cardinality: "1", slotName: masthead }
    - node:
        uri: prism.component.key_value_list
      relation: { cardinality: "1", slotName: facts }
    - switch:
        on: internal
        cases:
          - node:
              uri: prism.subcomponent.standard_prose
              styles:
                layout.grid.column: "1 / -1"
          - node:
              role: prose (the description, carrying .editorial and .content-flow)
              styles:
                layout.grid.column: "1 / -1"
              edges:
                - node:
                    role: paragraph (one block of the description)
                    styles:
                      typography.whiteSpace: pre-line
                  relation: { cardinality: "1..*", slotName: paragraph }
          - node:
              role: prose (the catalog's line for a standard with no text)
              styles:
                layout.grid.column: "1 / -1"
      relation: { cardinality: "0..1", slotName: prose }   # the rule section's content
    - node:
        role: examples (one section's examples, carrying .editorial and .content-flow)
        styles:
          layout.grid.column: "1 / -1"
        edges:
          - node:
              role: example (one example)
              edges:
                - node:
                    role: description (what the example shows, as plain text)
                    styles:
                      typography.whiteSpace: pre-line
                  relation: { cardinality: "1", slotName: description }
                - node:
                    role: code (the example's code, a pre with its language as data-language)
                  relation: { cardinality: "1", slotName: code }
            relation: { cardinality: "1..*", slotName: example }
      relation: { cardinality: "0..2", slotName: examples }  # the do and dont sections' content
    - node:
        role: chips (a list of chips, wrapping, gap --standard-article-gap)
        styles:
          layout.grid.column: "1 / -1"
          layout.gap: var(--standard-article-gap)
        edges:
          - node:
              uri: prism.component.chip_projection
            relation: { cardinality: "1..*", slotName: chip }
      relation: { cardinality: "0..2", slotName: chips }  # the related and applies-to sections' content
    - node:
        role: shown (the muted line of a cut group, "12 of 30 shown")
        styles:
          layout.grid.column: "1 / -1"
          color: var(--standard-article-shown-color)
      relation: { cardinality: "0..4", slotName: shown }
    - node:
        uri: prism.component.entity_source
      relation: { cardinality: "0..1", slotName: source }  # in place of the sections
