---
# OntologyPropertyCard: an ontology property as a card in a grid of
# entities.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, nodes 505:2281 (the class card's
# order: the name, then "kind in location", then the definition) and
# 505:1956 (key values, each pair with a rule above, and the footer
# vitals). The kind sentence names the property's kind and, as its
# location, the class it is declared on; the key values are its range and,
# when it has one, its inverse; the one vital marks a functional property.
# Projected onto EntityCard, which carries every style: this anatomy binds
# none. It is not dispatched: a property is not a Node.
# The name is the label, or the local name of the IRI when the property has
# none (a property carries no computed title). The home is the link the
# name renders through, resolved from the absolute IRI, a property's only
# address; a property without one reads as inert text.
node:
  uri: prism.component.ontology_property_card
  projection:
    on: OntologyProperty
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: title
              edges:
                - node:
                    role: label
                    projection:
                      field: label
                  relation:
                    cardinality: "0..1"
                - node:
                    role: local name
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
                - node:
                    role: home
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: kind
              projection:
                field: kind
              edges:
                - node:
                    role: location
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: domain
            relation:
              cardinality: "1"
              slotName: kind
          - node:
              role: summary
              projection:
                field: definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: key values
              edges:
                - node:
                    role: range
                    projection:
                      field: range
                  relation:
                    cardinality: "1"
                - node:
                    role: inverse
                    edges:
                      - node:
                          role: label
                          projection:
                            field: label
                        relation:
                          cardinality: "0..1"
                      - node:
                          role: local name
                          projection:
                            field: uri
                        relation:
                          cardinality: "0..1"
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: inverse
            relation:
              cardinality: "1"
              slotName: key-values
          - node:
              role: vital
              projection:
                field: functional
            relation:
              cardinality: "0..1"
              slotName: footer
      relation:
        cardinality: "1"
