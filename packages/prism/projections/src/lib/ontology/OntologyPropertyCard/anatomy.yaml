---
# OntologyPropertyCard: an ontology property as a card in a grid of
# entities.
# Reference: the W3 card anatomy: the slot order mark, prefix, title,
# address, kind, summary, facts, status; a property fills the mark (the
# property glyph), the prefix (its namespace's, off the page's ambient
# one), the title, the summary (its definition), the facts (the
# class it is declared on, its range and its inverse) and the status
# ("functional", for a functional property alone). It passes no address
# and no kind, which its mark states.
# Projected onto EntityCard, which carries every style: this anatomy
# binds none. It is not dispatched: a property is not a Node, and its
# callers render it directly.
# The name is the label, or the local name of the IRI when the property has
# none (a property carries no computed title). The home is the link the
# name renders through, resolved from the absolute IRI, a property's only
# address; a property without one reads as inert text.
node:
  uri: prism.component.ontology_property_card
  projection:
    on: OntologyProperty
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The property glyph, a published Icon (PROPERTY_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              # The namespace's prefix name, shown only off the page's
              # ambient namespace; a namespace served as an IRI shows none.
              role: prefix
              projection:
                field: namespace
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              edges:
                - node:
                    role: label
                    projection:
                      field: label
                  relation:
                    cardinality: "0..1"
                - node:
                    role: local name
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
                - node:
                    role: home
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: domain
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: domain
                - node:
                    # The range is set in the identifier face.
                    role: range
                    projection:
                      field: range
                    edges:
                      - node:
                          role: identifier
                        relation:
                          cardinality: "1"
                          slotName: identifier
                  relation:
                    cardinality: "1"
                - node:
                    role: inverse
                    edges:
                      - node:
                          role: label
                          projection:
                            field: label
                        relation:
                          cardinality: "0..1"
                      - node:
                          role: local name
                          projection:
                            field: uri
                        relation:
                          cardinality: "0..1"
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: inverse
            relation:
              cardinality: "1"
              slotName: facts
          - node:
              role: status
              projection:
                field: functional
            relation:
              cardinality: "0..1"
              slotName: status
      relation:
        cardinality: "1"
