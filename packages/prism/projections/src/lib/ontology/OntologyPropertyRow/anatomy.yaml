---
# OntologyPropertyRow: an ontology property as a 32px list entry.
# Reference: the W3 row anatomy: the slot order mark, prefix, title, kind,
# summary, facts, status; a property fills the mark (the property glyph),
# the title and, in a row opted into two lines, the summary (its
# definition). A typed row gives no kind: its mark says the type.
# Projected onto EntityRow, which carries every style: this anatomy
# binds none. It is not dispatched: a property is not a Node, and its
# callers render it directly.
# The name is the label, or the local name of the IRI when the property has
# none (a property carries no computed title). The home is the link the
# name renders through, resolved from the absolute IRI, a property's only
# address; a property without one reads as inert text.
node:
  uri: prism.component.ontology_property_row
  projection:
    on: OntologyProperty
  edges:
    - node:
        uri: prism.component.entity_row
        edges:
          - node:
              role: mark
              # The property glyph, a published Icon (PROPERTY_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              # Never shown: an absolute IRI has no compact prefix.
              role: prefix
              projection:
                field: uri
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              edges:
                - node:
                    role: label
                    projection:
                      field: label
                  relation:
                    cardinality: "0..1"
                - node:
                    role: local name
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
                - node:
                    role: home
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: definition
            relation:
              cardinality: "0..1"
              slotName: summary
      relation:
        cardinality: "1"
