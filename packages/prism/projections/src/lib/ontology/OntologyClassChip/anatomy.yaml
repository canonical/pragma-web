---
# OntologyClassChip: an ontology class as an inline mention.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, node 505:2304 (the classes row's
# chip: "Layout" alone in the pill; no key, badge, icon or chevron). A
# passage's own link text, when given, stands in for the title.
# Projected onto EntityChip, which carries every style: this anatomy binds
# none. The home is the link the value renders through, resolved from the
# compact address; a class without one reads as inert text.
node:
  uri: prism.component.ontology_class_chip
  projection:
    on: OntologyClass
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: value
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: value
      relation:
        cardinality: "1"
