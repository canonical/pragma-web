---
# OntologyClassChip: an ontology class as an inline mention.
# Reference: the W3 chip anatomy: the slot order mark, prefix, title,
# status; a class fills the mark (the class glyph), the prefix (the
# compact address's, shown only off the page's ambient namespace) and the
# title, or a passage's link text when given. A linked chip peeks at the
# class: the peek useProjectionPeek returns for its absolute IRI (uri, the
# only address node(id:) accepts), mounted only when the peek opens.
# Projected onto EntityChip, which carries every style: this anatomy binds
# none. The home is the link the title renders through, resolved from the
# compact address; a class without one reads as inert text.
node:
  uri: prism.component.ontology_class_chip
  projection:
    on: OntologyClass
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: mark
              # The class glyph, a published Icon (CLASS_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
                # The peek: the class's card, read by its own query when open.
                - node:
                    uri: prism.component.projection_peek
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
      relation:
        cardinality: "1"
