---
# OntologyPropertyGraphNode: an ontology property as a node of a graph.
# Reference: the W3 graph node anatomy: the slot order mark, prefix,
# title, kind; a property fills the mark (the property glyph), the title
# and the kind ("kind in location", the class it is declared on).
# Projected onto EntityGraphNode, which carries every style: this anatomy
# binds none. It is not dispatched: a property is not a Node, and its
# callers render it directly.
# The name is the label, or the local name of the IRI when the property has
# none (a property carries no computed title). The home is the link the
# name renders through, resolved from the absolute IRI, a property's only
# address; a property without one reads as inert text.
node:
  uri: prism.component.ontology_property_graph_node
  projection:
    on: OntologyProperty
  edges:
    - node:
        uri: prism.component.entity_graph_node
        edges:
          - node:
              role: mark
              # The property glyph, a published Icon (PROPERTY_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              # Never shown: an absolute IRI has no compact prefix.
              role: prefix
              projection:
                field: uri
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              edges:
                - node:
                    role: label
                    projection:
                      field: label
                  relation:
                    cardinality: "0..1"
                - node:
                    role: local name
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
                - node:
                    role: home
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: kind
              projection:
                field: kind
              edges:
                - node:
                    role: location
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: domain
            relation:
              cardinality: "1"
              slotName: kind
      relation:
        cardinality: "1"
