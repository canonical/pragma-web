---
# OntologyClassCard: an ontology class as a card in a grid of entities.
# Reference: the W3 card anatomy: the slot order mark, prefix, title,
# address, kind, summary, facts, status; a class fills the mark (the
# class glyph), the prefix (the compact address's, shown only off the
# page's ambient namespace), the title, the summary (its definition), one
# fact (its superclass, "Subclass of") and the status (the word
# "abstract", for an abstract class alone). It passes no address, which
# the peek's own line shows in full, and no kind, which its mark states. A
# class carries no depiction, so it draws no specimen.
# Projected onto EntityCard, which carries every style: this anatomy binds
# none. The home is the link the title renders through, resolved from the
# compact address; a class without one reads as inert text.
node:
  uri: prism.component.ontology_class_card
  projection:
    on: OntologyClass
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The class glyph, a published Icon (CLASS_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: superclass
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: superclass
            relation:
              cardinality: "0..1"
              slotName: facts
          - node:
              role: status
              projection:
                field: isAbstract
            relation:
              cardinality: "0..1"
              slotName: status
      relation:
        cardinality: "1"
