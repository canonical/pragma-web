---
# OntologyClassRow: an ontology class as a 32px list entry.
# Reference: the W3 row anatomy: the slot order mark, prefix, title, kind,
# summary, facts, status; a class fills the mark (the class glyph), the
# prefix (the compact address's, shown only off the page's ambient
# namespace), the title, in a row opted into two lines the summary (its
# definition), and the status (the word "abstract", for an abstract class
# alone). A typed row gives no kind: its mark says the type.
# Projected onto EntityRow, which carries every style: this anatomy binds
# none. The home is the link the title renders through, resolved from the
# compact address; a class without one reads as inert text.
node:
  uri: prism.component.ontology_class_row
  projection:
    on: OntologyClass
  edges:
    - node:
        uri: prism.component.entity_row
        edges:
          - node:
              role: mark
              # The class glyph, a published Icon (CLASS_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: status
              projection:
                field: isAbstract
            relation:
              cardinality: "0..1"
              slotName: status
      relation:
        cardinality: "1"
