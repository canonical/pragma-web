---
# OntologyClassRow: an ontology class as a 32px list entry.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, node 547:2201 (the classes row's
# list entries: "ds:" muted before "UIBlock", and "abstract" muted at the
# end of an abstract class). The prefix is the compact address's, with its
# colon; the word renders only for an abstract class.
# Projected onto EntityRow, which carries every style: this anatomy binds
# none. The home is the link the title renders through, resolved from the
# compact address; a class without one reads as inert text.
node:
  uri: prism.component.ontology_class_row
  projection:
    on: OntologyClass
  edges:
    - node:
        uri: prism.component.entity_row
        edges:
          - node:
              role: location
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: location
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: meta
              projection:
                field: isAbstract
            relation:
              cardinality: "0..1"
              slotName: meta
      relation:
        cardinality: "1"
