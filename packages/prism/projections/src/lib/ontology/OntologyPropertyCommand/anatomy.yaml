---
# OntologyPropertyCommand: an ontology property as a 56px command-palette
# result.
# Reference: the W3 command anatomy: the slot order mark, prefix, title,
# address, kind, status; a property fills the mark (the property glyph),
# the title, the address (its IRI), the kind ("kind in location", the
# class it is declared on) and the status (its range). A command gives its
# address, never a prefix: the address states the namespace once.
# Projected onto EntityCommand, which carries every style: this anatomy
# binds none. It is not dispatched: a property is not a Node, and its
# callers render it directly.
# The name is the label, or the local name of the IRI when the property has
# none (a property carries no computed title). The home is the link the
# name renders through, resolved from the absolute IRI, a property's only
# address; a property without one reads as inert text.
node:
  uri: prism.component.ontology_property_command
  projection:
    on: OntologyProperty
  edges:
    - node:
        uri: prism.component.entity_command
        edges:
          - node:
              role: mark
              # The property glyph, a published Icon (PROPERTY_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: title
              edges:
                - node:
                    role: label
                    projection:
                      field: label
                  relation:
                    cardinality: "0..1"
                - node:
                    role: local name
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
                - node:
                    role: home
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: address
              projection:
                field: uri
            relation:
              cardinality: "1"
              slotName: address
          - node:
              role: kind
              projection:
                field: kind
              edges:
                - node:
                    role: location
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: domain
            relation:
              cardinality: "1"
              slotName: kind
          - node:
              # The range is set in the identifier face.
              role: status
              projection:
                field: range
              edges:
                - node:
                    role: identifier
                  relation:
                    cardinality: "1"
                    slotName: identifier
            relation:
              cardinality: "1"
              slotName: status
      relation:
        cardinality: "1"
