---
# NodeCard: any graph node as a card in a grid of entities.
# Reference: the W3 card anatomy: the slot order mark, prefix, title,
# address, kind, summary, facts, status; any node fills the mark (the
# generic node glyph), the prefix (the compact address's; a node whose
# address did not compact has none), the title, the address (in full), the
# kind (its class) and the summary (its asserted definition). Any node
# carries no facts, status or depiction, so it draws no specimen.
# Projected onto EntityCard, which carries every style: this anatomy binds
# none. The home is the link the title renders through, resolved from the
# compact address; a node without one reads as inert text.
node:
  uri: prism.component.node_card
  projection:
    on: Node
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The generic node glyph, a published Icon (NODE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: address
              projection:
                field: _meta.curie
            relation:
              cardinality: "1"
              slotName: address
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
      relation:
        cardinality: "1"
