---
# NodeGraphNode: any graph node as a node of a graph, two lines tall.
# Reference: the W3 graph node anatomy: the slot order mark, prefix, title,
# kind; any node fills the mark (the generic node glyph, drawn at every
# zoom), the prefix (the compact address's; a node whose address did not
# compact has none) and the title on the first line, and the kind (its
# class) muted on the second.
# Projected onto EntityGraphNode, which carries every style: this anatomy
# binds none. The home is the link the title renders through, resolved from
# the compact address; a node without one reads as inert text.
node:
  uri: prism.component.node_graph_node
  projection:
    on: Node
  edges:
    - node:
        uri: prism.component.entity_graph_node
        edges:
          - node:
              role: mark
              # The generic node glyph, a published Icon (NODE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
      relation:
        cardinality: "1"
