---
# ChipProjection: any graph node as the inline mention, dispatched on its
# type.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, canvas 449:22295 (the projection
# matrix: one EntityChip per type, each type filling the slots it has).
# It renders no element of its own: the case its node's type selects
# renders the root. A type the package projects reads through its own
# projection; every other type through the Node projection, from what every
# node carries. The cases are the composite fragment's aliased spreads, one
# per type, and the map's arms, by the same names.
# A site's own types read through the site slot, the site's own compile
# of `SiteChipSlot_node`, for the typenames its map lists under
# `siteTypes`.
node:
  uri: prism.component.chip_projection
  projection:
    on: Node
  edges:
    - switch:
        on: internal
        cases:
          - node:
              uri: prism.component.ontology_class_chip
              projection:
                on: OntologyClass
          - node:
              uri: prism.component.node_chip
              projection:
                on: Node
          - node:
              uri: prism.component.site_chip_slot
              projection:
                on: Node
      relation:
        cardinality: "1"
