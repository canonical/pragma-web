---
# ChipProjection: any graph node as the inline mention, dispatched on its
# type.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, canvas 449:22295 (the projection
# matrix: one EntityChip per type, each type filling the slots it has).
# It renders no element of its own: the case its node's type selects
# renders the root. The switch is explicit: each ontology type that
# implements Node (ONTOLOGY_TYPES: OntologyClass) is a case of its own,
# read through its aliased spread; every other type falls to the default, the
# Node projection, from what every node carries. OntologyProperty implements no Node, so no case names it.
# `linked` reaches the case's arm with every other native prop.
# A site that gives its switches takes every node: its switch reads the
# site slot, the site's own compile of `SiteChipSlot_node`.
node:
  uri: prism.component.chip_projection
  projection:
    on: Node
  edges:
    - switch:
        on: internal
        cases:
          - node:
              uri: prism.component.ontology_class_chip
              projection:
                on: OntologyClass
          - node:
              uri: prism.component.node_chip
              projection:
                on: Node
          - node:
              uri: prism.component.site_chip_slot
              projection:
                on: Node
      relation:
        cardinality: "1"
