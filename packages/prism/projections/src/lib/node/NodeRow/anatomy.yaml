---
# NodeRow: any graph node as a 32px list entry.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, node 547:2201 (the classes row's
# list entries: the namespace prefix muted before the title, one muted word
# at the end). The prefix is the compact address's, with its colon; a node
# whose address did not compact has none. The word is the node's class.
# Projected onto EntityRow, which carries every style: this anatomy binds
# none. The home is the link the title renders through, resolved from the
# compact address; a node without one reads as inert text.
node:
  uri: prism.component.node_row
  projection:
    on: Node
  edges:
    - node:
        uri: prism.component.entity_row
        edges:
          - node:
              role: location
              projection:
                field: _meta.curie
              # The prefix is set in the identifier face.
              edges:
                - node:
                    role: identifier
                  relation:
                    cardinality: "1"
                    slotName: identifier
            relation:
              cardinality: "0..1"
              slotName: location
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: meta
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: meta
              projection:
                field: _meta.type
      relation:
        cardinality: "1"
