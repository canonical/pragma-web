---
# GraphNodeProjection: any graph node as the node of a graph, dispatched on
# its type.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, canvas 449:22295 (the projection
# matrix: one EntityGraphNode per type, each type filling the slots it has).
# It renders no element of its own: the case its node's type selects
# renders the root. A type the package projects reads through its own
# projection; every other type through the Node projection, from what every
# node carries. The cases are the composite fragment's aliased spreads, one
# per type, and the map's arms, by the same names.
node:
  uri: prism.component.graph_node_projection
  projection:
    on: Node
  edges:
    - switch:
        on: internal
        cases:
          - node:
              uri: prism.component.ontology_class_graph_node
              projection:
                on: OntologyClass
          - node:
              uri: prism.component.node_graph_node
              projection:
                on: Node
      relation:
        cardinality: "1"
