---
# NodeCommand: any graph node as a 56px command-palette result.
# Reference: the W3 command anatomy: the slot order mark, prefix, title,
# address, kind, status; any node fills the mark (the generic node glyph),
# the prefix (its namespace's, only off the page's ambient namespace), the
# title, the address (the full compact address, on the second line) and
# the kind (its class, closing the first line). Any node carries no
# status.
# Projected onto EntityCommand, which carries every style: this anatomy
# binds none. The home is the link the title renders through, resolved
# from the compact address; a node without one reads as inert text.
node:
  uri: prism.component.node_command
  projection:
    on: Node
  edges:
    - node:
        uri: prism.component.entity_command
        edges:
          - node:
              role: mark
              # The generic node glyph, a published Icon (NODE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: address
              projection:
                field: _meta.curie
            relation:
              cardinality: "1"
              slotName: address
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
      relation:
        cardinality: "1"
