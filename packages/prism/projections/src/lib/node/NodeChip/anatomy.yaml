---
# NodeChip: any graph node as an inline mention, from what every node carries.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, node 505:2304 (the classes row's
# chip: the title alone in the pill; no key, badge, icon or chevron) and
# 449:22408 (the chip's slots). A passage's own link text, when given,
# stands in for the title.
# Projected onto EntityChip, which carries every style: this anatomy binds
# none and says only which field fills which slot. The home is the link the
# value renders through: the site's homes resolve it from the compact
# address, and a node without one reads as inert text.
node:
  uri: prism.component.node_chip
  projection:
    on: Node
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: value
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: value
      relation:
        cardinality: "1"
