---
# NodeChip: any graph node as an inline mention, from what every node carries.
# Reference: the W3 chip anatomy: the slot order mark, prefix, title,
# status; any node fills the mark and the title. The mark is the generic
# node glyph; the title its own, or a passage's link text when given. A
# linked chip peeks at the node's card: ProjectionPeek, which queries the
# card by the node's absolute IRI (uri, the only address node(id:) accepts)
# only when the peek opens.
# Projected onto EntityChip, which carries every style: this anatomy binds
# none and says only which field fills which slot. The home is the link the
# title renders through: the site's homes resolve it from the compact
# address, and a node without one reads as inert text.
node:
  uri: prism.component.node_chip
  projection:
    on: Node
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: mark
              # The generic node glyph, a published Icon (NODE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
                # The peek: the node's card, read by its own query when open.
                - node:
                    uri: prism.component.projection_peek
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
      relation:
        cardinality: "1"
