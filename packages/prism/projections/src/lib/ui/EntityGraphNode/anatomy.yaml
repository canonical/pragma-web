---
# EntityGraphNode — an entity as a node of a graph: a box with rounded
# corners, two lines tall by default, drawn in native SVG.
# Reference: the projection matrix's graph-node column (the title, then
# "kind in location" muted, in a bordered box with 8px inline insets and no
# block insets: two 24px lines inside a 1px border). Slot order: title, then
# kind and location on the second line.
#
# Why not a published component: no published graph node exists. It is SVG
# because a graph draws hundreds of nodes under pan and zoom: the root is a
# `<g>` a graph positions with a transform, its box two rects, its lines
# `<text>`.
#
# SVG paints through currentColor: the roster has no fill or stroke key, so
# each shape's colour is bound as its `typography.color`, which the shape's
# `fill` or `stroke` reads. The box's geometry is the component's own
# constants (constants.ts): an SVG rect and text are placed by attributes,
# which no style key binds. Its text is the context's primary size, on the
# node's own 24-unit lines. A long line is clipped at the inner inset, since
# SVG text does not truncate, by a nested SVG viewport over the inner box:
# a clip path's document-wide id could differ between server and client.
#
# A linked title is an SVG link inside the title's `<text>`, and reads as
# the title, as every representation's link does: the text's colour,
# underlined on hover, its focus ring drawn inside it since the node clips
# its lines.
#
# A graph sets the box's height (a one-line node sets its title on the
# middle) and gives it the encodings of the Definitions graph: the vital
# ends the title's line in muted tabular figures (an instance count); a
# hollow box is drawn in the floor's colour with an italic title (an
# abstract class: kind on the fill and the label style); a prominent node
# sets its title one step larger (a hub). Hollow and prominent are modifier
# classes on the shape they change. A node without text draws its box
# alone. The italic is the title's `font-style` attribute: the roster has
# no font-style key.
#
# Every decision is read through a component token declared on the root
# (`--entity-graph-node-*`), bound to the symbol named here.
#
# Token ledger (no symbol to bind, held in constants.ts):
#   GRAPH_NODE_HEIGHT 50, GRAPH_NODE_LINE 24, GRAPH_NODE_INSET 8,
#   GRAPH_NODE_STROKE 1, GRAPH_NODE_RADIUS 4 and the default
#   GRAPH_NODE_WIDTH 192, in SVG user units: SVG geometry is attributes,
#   not CSS.
#   --entity-graph-node-hollow-surface-color:
#     light-dark(oklch(94% 0 0), var(--color-background-container))
#                                      the graph's floor, the literal the
#                                      graph canvas ledgers: no background
#                                      token sits 6 L* below the surface in
#                                      light, so a hollow box reads as an
#                                      outline on the floor.
#   --entity-graph-node-prominent-font-size: 1rem
#                                      a hub's title; the docs context has
#                                      no 16px text size.
#   --entity-graph-node-focus-ring-width: 2px,
#   --entity-graph-node-focus-ring-offset: -2px
#                                      the link's ring, drawn inside it.
#
# Roster namespaces (accepted and tracked): the semantic typography symbols
# typography.text.primary.fontSize and
# typography.text.primary.bold.fontWeight.
node:
  uri: prism.component.entity_graph_node
  styles:
    typography.size: typography.text.primary.fontSize
  edges:
    - switch:
        on: internal
        cases:
          - node:
              role: surface
              styles:
                typography.color: color.background
          - node:
              role: hollow surface (.is-hollow)
              styles:
                typography.color: "light-dark(oklch(94% 0 0), var(--color-background-container))"
      relation: { cardinality: "1", slotName: surface }
    - node:
        role: frame
        styles:
          typography.color: color.border
      relation: { cardinality: "1", slotName: frame }
    - switch:
        on: internal
        cases:
          - node:
              role: title
              styles:
                typography.weight: typography.text.primary.bold.fontWeight
              edges:
                - node:
                    role: link
                    styles:
                      typography.color: inherit
                      typography.decoration: none
                      typography.decoration@hover: underline
                      appearance.outline.width@focus: 2px
                      appearance.outline.style@focus: solid
                      appearance.outline.color@focus: color.focusRing
                      appearance.outline.offset@focus: -2px
                  relation: { cardinality: "0..1", slotName: link }
          - node:
              role: prominent title (.is-prominent)
              styles:
                typography.size: 1rem
      relation: { cardinality: "1", slotName: title }
    - node:
        role: count
        styles:
          typography.color: color.text.muted
          typography.variant.numeric: tabular-nums
      relation: { cardinality: "0..1", slotName: count }
    - node:
        role: context
        styles:
          typography.color: color.text.muted
        edges:
          - node:
              role: kind
            relation: { cardinality: "0..1", slotName: kind }
          - node:
              role: location
            relation: { cardinality: "0..1", slotName: location }
      relation: { cardinality: "0..1", slotName: context }
