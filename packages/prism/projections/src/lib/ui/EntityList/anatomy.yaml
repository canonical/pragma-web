---
# EntityList — the shared list view of an index of entities: the entities
# in the renderer the lens's address names, or one line when there are
# none. Two renderer bodies, by name: `table`, the row list (an ordered
# list of 32px EntityRows; the headers land with the thin list), and
# `cards`, the published Cards group (global.group.cards) at two columns a
# card. No toolbar: the switch is the strip's view group and the count is
# the strip's or the panel's count line.
#
# The root is a subgrid over every column of the grid that holds it, its
# gap the grid's gutter on both axes; the items and the empty line span
# every column. The empty line sets its text on the matrix's 24px line with
# no block insets: the typography layer would set its own 20px line and add
# a baseline nudge that is no 4px multiple.
#
# Every decision is read through a component token declared on the root
# (`--entity-list-*`), bound to the symbol named here.
#
# Token ledger (no symbol to bind):
#   space.300 (24px) for the empty line's line height: the matrix's line;
#   no typography token is 24px in every context.
#
# Roster namespaces (accepted and tracked): grid.gutter, space.300 (a line
# height).
node:
  uri: prism.component.entity_list
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - switch:
        on: props
        cases:
          - uri: global.group.cards
          - node:
              role: table
              styles:
                layout.grid.column: "1 / -1"
                layout.listStyle: none
                spacing.external.block.start: 0
                spacing.external.block.end: 0
                spacing.internal.inline.start: 0
      relation: { cardinality: "0..1", slotName: items }
    - node:
        role: empty line
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          spacing.internal.block.start: 0
          spacing.internal.block.end: 0
          typography.lineHeight: space.300
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: empty }
