---
# EntityList — the shared list view of an index of entities: a toolbar with
# the count line and the view toggle, then the entities as cards or as
# rows, or one line when there are none.
# Reference: the projection matrix's cards (two intrinsic columns each) and
# list entries (32px rows), laid on the main column the list fills.
#
# Built on published components: the cards view is the published Cards
# group (global.group.cards) at two columns a card, and the view toggle is
# two published Buttons in a fieldset that names the control, the pressed
# one at secondary importance and the other at tertiary, each announcing
# its state through `aria-pressed`. The
# rows view is a bespoke ordered list: no published list of entries exists.
#
# The root is a subgrid over every column of the grid that holds it, its gap
# the grid's gutter on both axes; the toolbar, the items and the empty line
# each span every column. `view` picks the items' case: the Cards group, or
# the rows' `<ol>`, which flows its 32px rows with no gap of its own.
#
# Every decision is read through a component token declared on the root
# (`--entity-list-*`), bound to the symbol named here.
#
# Token ledger (no symbol to bind):
#   space.050 (4px) between the two toggle buttons: they read as one
#   control, and no gap may read a container gap.
#
# Roster namespaces (accepted and tracked): grid.gutter, space.050.
node:
  uri: prism.component.entity_list
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - node:
        role: toolbar
        styles:
          layout.grid.column: "1 / -1"
          layout.type: flex
          layout.align: center
          layout.justify: space-between
          spacing.gap: grid.gutter
        edges:
          - node:
              role: count line
              styles:
                spacing.external.block.start: 0
                spacing.external.block.end: 0
                typography.color: color.text.muted
            relation: { cardinality: "0..1", slotName: count }
          - node:
              role: view toggle
              styles:
                layout.type: flex
                spacing.gap: space.050
                spacing.external.block.start: 0
                spacing.external.block.end: 0
                spacing.external.inline.start: 0
                spacing.external.inline.end: 0
                spacing.internal.block.start: 0
                spacing.internal.block.end: 0
                spacing.internal.inline.start: 0
                spacing.internal.inline.end: 0
                appearance.border.style: none
              edges:
                - node:
                    uri: global.component.button
                  relation: { cardinality: "2" }
            relation: { cardinality: "0..1", slotName: views }
      relation: { cardinality: "0..1", slotName: toolbar }
    - switch:
        on: props
        cases:
          - uri: global.group.cards
          - node:
              role: rows
              styles:
                layout.grid.column: "1 / -1"
                layout.listStyle: none
                spacing.external.block.start: 0
                spacing.external.block.end: 0
                spacing.internal.inline.start: 0
      relation: { cardinality: "0..1", slotName: items }
    - node:
        role: empty line
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: empty }
