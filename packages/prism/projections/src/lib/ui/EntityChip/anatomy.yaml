---
# EntityChip: the inline mention of an entity, a 28px pill in running text,
# a link to its home by default, which peeks at the entity's card.
# Reference: PS1 V4 (mockups/ps1-v4-sheet.html, ps1-v4-sheet-peek.html,
# tools/ps1v4-measured.json "peek"); Figma 449:22408
# (24px line, 2px block insets, 8px/4px inline insets, 4px gap, full radius,
# 1px border). Slot order (heuristic 4.1, a subsequence of mark, prefix,
# title, address, kind, summary, facts, status): mark, prefix, title, then
# the peek, which is not an identity slot and sits after the title.
#
# The title is the link (LinkComponent, href) unless `linked` is false; an
# unlinked chip is inert text and has no peek (nothing to focus). The peek is
# never inside the <a>: while open it is mounted through a portal on the
# document's body (the chip's Peek, common/Peek/), outside the paragraph a
# mention sits in, whose phrasing content cannot hold a card; it is still
# the root's child in the React tree, so its pointer, focus and key events
# reach the chip, and focus moving between the chip and the peek keeps it
# open. It is shown from the link as its source, so a browser that takes a
# source puts it next after the link in the tab order. A non-modal
# popover (popover="manual", role="dialog", named by a hidden label from the
# catalog "chip.peek" with the title, aria-labelledby) holding the peek the
# arm passes. It opens after PEEK_OPEN_DELAY_MS (EntityChip/constants.ts) of
# hover on the chip, at once on focus of the link; stays open while the
# pointer is over the chip or the peek; closes PEEK_CLOSE_DELAY_MS after the
# pointer leaves both, on focus leaving both, and on Escape: focus returns
# to the link when it was in the chip, and a hover-opened peek, which holds
# no focus, hears Escape on the document while open. A touch pointer never
# opens it: a tap follows the link. Tethered with CSS anchor positioning
# (anchor-name on the chip's root, the pill, while the peek is open;
# position-anchor on the peek; a dashed ident from useId), 4px below the
# pill, from its start; from its end when the start would run past the
# viewport's inline end, and above when the viewport has no room below
# (position-try-fallbacks: flip-inline, flip-block, flip-block
# flip-inline).
#
# Why not the published Popover: it is a click disclosure on a button; the
# peek opens on hover-intent and focus of a link (EXPLANATIONS S5).
#
# Choices, with their reasons: the peek's anchor is
# the chip's root (the pill), not the link, so "4px below the chip" holds
# and the published LinkComponent, which takes no ref or style, needs no
# wrapper; the anchor-name and position-anchor are set inline from useId
# (an instance's ident cannot live in a stylesheet). The peek is the frame,
# as PS1 V4's peek draws it (its anatomy is common/Peek's): the popover's
# border, with no padding, round the card it holds, which draws no border
# of its own (ProjectionPeek), and the address line under the card. The
# dialog's name is a hidden label inside it (aria-labelledby), since the
# title is a node, not a string.
#
# Token ledger (every decision; a literal only where no symbol exists):
#   --entity-chip-gap: space.050 (4px)            between slots
#   --entity-chip-padding-inline-start: space.100 (8px)
#   --entity-chip-padding-inline-end: space.050 (4px)
#   --entity-chip-padding-block: calc(space.025 - border width)  2px less the border
#   --entity-chip-line-height: space.300 (24px)  the matrix line
#   --entity-chip-background: color.foreground.secondary
#   --entity-chip-border-color: color.border
#   --entity-chip-border-width: 1px               literal: only primitive stroke tokens
#   --entity-chip-radius: 9999px                  literal: only primitive radius.full
#   --entity-chip-prefix-color: color.text.muted
#   --entity-chip-prefix-font-family: ui-monospace, monospace   literal: no mono token
#   --entity-chip-focus-ring-color: color.focusRing
#   --entity-chip-focus-ring-width: 2px, --entity-chip-focus-ring-offset: -2px  literals
#   --entity-chip-max-width: 100%                 literal
#   --entity-chip-mark-size: space.200 (16px)
#   PEEK_OPEN_DELAY_MS = 500, PEEK_CLOSE_DELAY_MS = 200 (constants.ts, not CSS)
node:
  uri: prism.component.entity_chip
  styles:
    layout.type: inline-flex
    layout.align: center
    size.max.width: 100%
    spacing.gap: space.050
    spacing.internal.inline.start: space.100
    spacing.internal.inline.end: space.050
    spacing.internal.block.start: "calc(var(--space-025) - var(--entity-chip-border-width))"
    spacing.internal.block.end: "calc(var(--space-025) - var(--entity-chip-border-width))"
    appearance.background: color.foreground.secondary
    appearance.border.width: 1px
    appearance.border.style: solid
    appearance.border.color: color.border
    appearance.radius: 9999px
    typography.lineHeight: space.300
    typography.whiteSpace: nowrap
  edges:
    # The mark centres its sign on both axes in its 16px box, so a sign
    # smaller than the box, such as a line's swatch, sits on its middle.
    - node:
        role: mark
        styles:
          layout.type: flex
          layout.flex.shrink: 0
          layout.align: center
          layout.justify: center
          size.width: space.200
          size.height: space.200
      relation: { cardinality: "0..1", slotName: mark }
    - node:
        role: prefix
        styles:
          typography.color: color.text.muted
          typography.fontFamily: "ui-monospace, monospace"
      relation: { cardinality: "0..1", slotName: prefix }
    - node:
        role: title
        styles:
          layout.overflow: hidden
          typography.overflow: ellipsis
          typography.color: inherit
          typography.decoration: none
          typography.decoration@hover: underline
          appearance.outline.width@focus: 2px
          appearance.outline.style@focus: solid
          appearance.outline.color@focus: color.focusRing
          appearance.outline.offset@focus: -2px
      relation: { cardinality: "1", slotName: title }
    - node:
        uri: prism.component.entity_chip.peek
      relation: { cardinality: "0..1", slotName: peek }
    - node:
        role: status
      relation: { cardinality: "0..1", slotName: status }
