---
# EntityRow — the list entry of an entity: a 32px row in an index.
# Reference: the projection matrix's in-page list entry (the namespace prefix
# muted, the title, and a muted word right-aligned, on a 24px line with 4px
# block insets). Slot order: location, title, then meta at the end.
#
# The row sets the context's primary text on the matrix's 24px line, the
# line every representation shares, so it is 32px in every context.
#
# The matrix's 24px and 8px inline insets are its navigation's indentation;
# the row sets none, so its text sits on the column line of the list that
# holds it.
#
# The row may be narrower than its content (`size.min.width: 0`): as a
# grid item or flex item its minimum would otherwise be its content's, so a
# long identity would widen the track that holds the row past its column
# instead of truncating.
#
# When the identity and the meta do not fit on one line, as on a phone,
# the row wraps: the meta moves to a line of its own under the identity,
# flush left, with no space between the two lines (the row is then 56px),
# and a title longer than its line wraps between its words rather than
# being cut, so the title is always whole. The meta stays on its one line
# and clips at its end with an ellipsis only when it alone is longer than
# the row; the whole word stays in the text. The identity clips along its
# line only, for a single word longer than the row, so nothing it holds is
# cut above or below: a chip in the title is 28px, and its line grows to
# hold it (the row is then 36px).
#
# An identifier in the location, a `<code class="identifier">`, sets the
# monospace face on the row's line and stands on the sans text's baseline:
# it is aligned to the baseline, so its glyphs share the line the title's
# stand on, and its own line height is 0, so its inline box takes no height
# and the face's other ascent and descent never grow the line past 24px:
# the row stays 32px. (Aligning its box to the line's top would keep the
# row at 32px too, but would leave the monospace baseline where that face's
# metrics put it inside the box, below the sans text's.)
#
# A linked title reads as the row's text: the text's colour, underlined on
# hover, its focus ring drawn inside it since the identity clips; the
# states apply to the link alone.
#
# Why not a published component: no published list entry exists.
#
# Every decision is read through a component token declared on the root
# (`--entity-row-*`), bound to the symbol named here.
#
# Token ledger (no symbol to bind):
#   space.050 (4px) for the block insets: a 32px entry on a 24px line; the
#   shim's block component padding (8px) would make it 40px.
#   --entity-row-focus-ring-width: 2px, --entity-row-focus-ring-offset: -2px
#                                      the link's ring, drawn inside it since the identity clips.
#   space.300 (24px) for the line height: the matrix's line; no typography
#   token is 24px in every context (the docs' primary line is 20px).
#   space.0 for the gap between a wrapped row's lines: the meta reads with
#   the identity above it, its lines the 24px line apart.
#   layout.wrap wrap, typography.whiteSpace normal and nowrap,
#   layout.overflow.inline clip, typography.overflow ellipsis: keywords;
#   size.min.width 0 lets the identity and the meta shrink to the row.
#   --entity-row-identifier-vertical-align: baseline,
#   --entity-row-identifier-line-height: 0
#                                      the identifier on the text's baseline,
#                                      its inline box of no height; a keyword
#                                      and a number.
#
# Roster namespaces (accepted and tracked): grid.gutter, space.0,
# space.050, space.300 (a line height), and the semantic typography symbol
# typography.text.primary.fontSize.
node:
  uri: prism.component.entity_row
  styles:
    layout.type: flex
    layout.align: baseline
    layout.justify: space-between
    layout.wrap: wrap
    size.min.width: 0
    spacing.gap.inline: grid.gutter
    spacing.gap.block: space.0
    spacing.internal.block.start: space.050
    spacing.internal.block.end: space.050
    layout.listStyle: none
    typography.size: typography.text.primary.fontSize
    typography.lineHeight: space.300
  edges:
    - node:
        role: identity
        styles:
          layout.overflow.inline: clip
          size.min.width: 0
          typography.overflow: ellipsis
          typography.whiteSpace: normal
        edges:
          - node:
              role: location
              styles:
                typography.color: color.text.muted
              edges:
                - node:
                    role: identifier
                    styles:
                      layout.verticalAlign: baseline
                      typography.lineHeight: 0
                  relation: { cardinality: "0..*", slotName: identifier }
            relation: { cardinality: "0..1", slotName: location }
          - node:
              role: title
              styles:
                typography.color: inherit
                typography.decoration: none
                typography.decoration@hover: underline
                appearance.outline.width@focus: 2px
                appearance.outline.style@focus: solid
                appearance.outline.color@focus: color.focusRing
                appearance.outline.offset@focus: -2px
            relation: { cardinality: "1", slotName: title }
      relation: { cardinality: "1", slotName: identity }
    - node:
        role: meta
        styles:
          typography.color: color.text.muted
          typography.align: end
          typography.whiteSpace: nowrap
          layout.overflow.inline: clip
          size.min.width: 0
          typography.overflow: ellipsis
      relation: { cardinality: "0..1", slotName: meta }
