---
# EntityCard — an entity as a card in a grid of entities: 209x345 at two
# intrinsic columns.
#
# What an arm passes (say it once, heuristics 2.5 and 4.3): a card arm
# passes no address, since the full CURIE shows on the peek's own line
# under the card and the foreign prefix already says where the entity is
# from; a typed card arm passes no kind, since its index states the type
# once for every card. Only the generic Node arm, whose lists mix types,
# passes a kind. The address slot stays for a card shown alone.
# Reference: the projection matrix's cards and PS1 V4's card: the identity
# (mark, foreign prefix, title), the summary, the facts with a rule above
# each, the status, over the entity's specimen where it has one.
#
# Built on the published Card (global.component.card): this root IS the
# Card's root with the entity-card class added and the body is its
# Card.Content, so the card's border, radius, dividers and section insets
# (8 above, 16 below and inline) are the Card's own. Card.Content's 8px gap
# and the summary's and facts' 16px make the matrix's 16 to the summary and
# 24 to the facts.
#
# The card has no image and no header, so the body takes the Card's first
# three row tracks (`1 / 4`) and starts at the card's edge, its text 8px
# below it. The card leaves the Card's fourth track (the footer's) empty:
# the body reaches back across the gutter the holding grid sets before it
# (`spacing.external.block.end: calc(-1 * var(--grid-gutter))`), so a card
# alone ends where its body does and no empty strip stays below it.
#
# The card sets its text on the matrix's 24px line, the line every
# representation shares (the graph node draws on it too), so its heading
# lines and its facts sit on one rhythm. Its paragraphs and its heading set
# no block insets and take the card's line back: the typography layer
# would set its own line on each of them, and add a baseline nudge of 4px
# that the facts do not have.
#
# Every rule reaches its slot through the slot's whole path from the root,
# so nothing a consumer renders in a slot is restyled. A word longer than
# its box, an identifier most often, ends in an ellipsis in the title and
# the facts rather than running under the Card's clipped edge; the roster
# has no key for breaking inside a word. A term and its detail clip along
# their line only, so nothing they hold is cut above or below: a chip in a
# detail is 28px, and the fact's line grows to hold it.
# The title's link reads as the title: the text's colour, underlined on
# hover, its focus ring drawn inside it since the title clips.
#
# The summary ends at its third line, in an ellipsis, on every card, on
# an index and in the peek alike (`--entity-card-summary-lines`, 3): cards
# in a row stay close in height and differ by their facts, and the page is
# one click away. The clamp is the line-clamp properties on a
# `-webkit-box`, which the style check admits on a summary slot alone.
#
# Reflow, bound in styles.css:
#   @container shell (width < 448px)   below one group: the card spans
#     every column of the grid that holds it (`--entity-card-narrow-column`,
#     `1 / -1`) instead of the Cards group's span, since the canvas beside
#     the rail holds three columns there and a card at two would leave the
#     last one empty on every row.
#
# Every decision is read through a component token declared on the root
# (`--entity-card-*`), bound to the symbol or the literal named here.
#
# The selected entity's card (aria-current="true", the address's select=)
# takes color.background.layer2, as the table of facts marks its selected
# row (@selected on the root).
#
# Token ledger (no symbol to bind):
#   --entity-card-line-height: space.300  the matrix's 24px line; no
#                                       typography token is 24px in every
#                                       context (the docs' primary line is
#                                       20px).
#   --entity-card-rule-width: 1px       the rule above each fact; stroke
#                                       thickness is primitive only.
#   --entity-card-focus-ring-width: 2px, --entity-card-focus-ring-offset: -2px
#                                      the link's ring, drawn inside it.
#   --entity-card-narrow-column: 1 / -1  the whole row a card spans below
#                                       one group; grid lines, not a length.
#   --entity-card-end-overlap: calc(-1 * var(--grid-gutter))
#                                       the body reaches back across the
#                                       gutter before the empty last track;
#                                       no symbol is a negative gutter.
#
# Roster namespaces (accepted and tracked): container.gap.default,
# space.300 (a line height), and the semantic typography symbols
# typography.text.primary.fontSize,
# typography.text.primary.bold.fontWeight and
# typography.text.primary.fontWeight.
# The identity slots (heuristic 4.1), in their order: the mark and the
# foreign prefix lead the title heading on its line (the headline, a flex
# line that centres the mark's 16px box), outside the h3, so no heading
# reads as an address; then the address, the kind, the
# summary, the facts (each cell naming its property in data-property,
# Annex D) and the status. EntityCard.Specimen, the card's one child, takes
# the media track (row 1) and pushes the body to the two tracks after it
# (a reflow under :has(> .specimen)); with no specimen there is no track
# and no box. The card keeps its published Card structure rather than a
# fresh grid: the Cards group lines up the sections it already has.
#
# Token ledger (the identity slots):
#   --entity-card-mark-size: space.200 (16px)
#   --entity-card-identity-gap: space.050 (4px)   mark and prefix to the title
#   --entity-card-mono-font-family: ui-monospace, monospace   literal: no mono token
#   --entity-card-summary-lines: 3   a summary's lines at most: a count, not a length
#   prefix and address: color.text.muted; status above: container.gap.default
node:
  uri: prism.component.entity_card
  styles:
    typography.size: typography.text.primary.fontSize
    typography.lineHeight: space.300
    appearance.background@selected: color.background.layer2
  edges:
    - node:
        uri: prism.component.entity_card.specimen
        styles:
          layout.grid.row: 1
      relation: { cardinality: "0..1", slotName: specimen }
    - node:
        uri: global.subcomponent.card-content
        styles:
          layout.grid.row: "1 / 4"
          spacing.external.block.end: "calc(-1 * var(--grid-gutter))"
        edges:
          - node:
              role: description
              edges:
                - node:
                    role: heading
                    edges:
                      - node:
                          role: headline
                          styles:
                            # The title's line: the mark and the prefix lead
                            # the heading outside it, so the heading names
                            # the entity alone.
                            layout.type: flex
                            layout.align: center
                            size.min.width: 0
                          edges:
                            # The mark centres its sign on both axes in its 16px box, so a sign
                            # smaller than the box, such as a line's swatch, sits on its middle.
                            - node:
                                role: mark
                                styles:
                                  layout.type: flex
                                  layout.flex.shrink: 0
                                  layout.align: center
                                  layout.justify: center
                                  size.width: space.200
                                  size.height: space.200
                                  spacing.external.inline.end: space.050
                              relation: { cardinality: "0..1", slotName: mark }
                            - node:
                                role: prefix
                                styles:
                                  layout.flex.shrink: 0
                                  spacing.external.inline.end: space.050
                                  typography.color: color.text.muted
                                  typography.fontFamily: "ui-monospace, monospace"
                                  typography.weight: typography.text.primary.fontWeight
                              relation: { cardinality: "0..1", slotName: prefix }
                            - node:
                                role: title
                                styles:
                                  # A heading at the text size: the card's
                                  # hierarchy is weight, not size.
                                  spacing.external.block.start: 0
                                  spacing.external.block.end: 0
                                  spacing.internal.block.start: 0
                                  spacing.internal.block.end: 0
                                  size.min.width: 0
                                  layout.overflow: hidden
                                  typography.overflow: ellipsis
                                  typography.size: typography.text.primary.fontSize
                                  typography.lineHeight: space.300
                                  typography.weight: typography.text.primary.bold.fontWeight
                                edges:
                                  - node:
                                      role: link
                                      styles:
                                        typography.color: inherit
                                        typography.decoration: none
                                        typography.decoration@hover: underline
                                        appearance.outline.width@focus: 2px
                                        appearance.outline.style@focus: solid
                                        appearance.outline.color@focus: color.focusRing
                                        appearance.outline.offset@focus: -2px
                                    relation: { cardinality: "0..1", slotName: link }
                              relation: { cardinality: "1", slotName: title }
                        relation: { cardinality: "1", slotName: headline }
                      - node:
                          role: address
                          styles:
                            spacing.external.block.start: 0
                            spacing.external.block.end: 0
                            layout.overflow: hidden
                            typography.color: color.text.muted
                            typography.fontFamily: "ui-monospace, monospace"
                            typography.whiteSpace: nowrap
                            typography.overflow: ellipsis
                        relation: { cardinality: "0..1", slotName: address }
                      - node:
                          role: kind
                          styles:
                            spacing.external.block.start: 0
                            spacing.external.block.end: 0
                            spacing.internal.block.start: 0
                            spacing.internal.block.end: 0
                            typography.lineHeight: space.300
                        relation: { cardinality: "0..1", slotName: kind }
                  relation: { cardinality: "1" }
                - node:
                    role: summary
                    styles:
                      # Cut at its third line, in an ellipsis, on every
                      # card (the line-clamp properties, which the DSL has
                      # no key for, on the -webkit-box).
                      layout.type: -webkit-box
                      layout.overflow: hidden
                      spacing.external.block.start: container.gap.default
                      spacing.external.block.end: 0
                      spacing.internal.block.start: 0
                      spacing.internal.block.end: 0
                      typography.lineHeight: space.300
                  relation: { cardinality: "0..1", slotName: summary }
            relation: { cardinality: "1" }
          - node:
              role: facts
              styles:
                spacing.external.block.start: container.gap.default
                spacing.external.block.end: 0
              edges:
                - node:
                    role: fact
                    attributes: { data-property: "{property}" }
                    styles:
                      # One rule above the fact: the top side alone has
                      # a width and a style, every other side none.
                      layout.type: flex
                      appearance.border.top.width: 1px
                      appearance.border.style: "solid none none"
                      appearance.border.block.start.color: color.border.muted
                    edges:
                      - node:
                          role: term
                          styles:
                            layout.flex.grow: 1
                            layout.flex.basis: 0
                            layout.overflow.inline: clip
                            size.min.width: 0
                            typography.overflow: ellipsis
                            typography.color: color.text.muted
                        relation: { cardinality: "1", slotName: term }
                      - node:
                          role: detail
                          styles:
                            layout.flex.grow: 1
                            layout.flex.basis: 0
                            layout.overflow.inline: clip
                            size.min.width: 0
                            typography.overflow: ellipsis
                            spacing.external.inline.start: 0
                        relation: { cardinality: "1", slotName: detail }
                  relation: { cardinality: "1..*", slotName: fact }
            relation: { cardinality: "0..1", slotName: facts }
          - node:
              role: status
              styles:
                spacing.external.block.start: container.gap.default
            relation: { cardinality: "0..1", slotName: status }
      relation: { cardinality: "1", slotName: body }
