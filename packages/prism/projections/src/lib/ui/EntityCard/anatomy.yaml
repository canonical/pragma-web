---
# EntityCard — an entity as a card in a grid of entities: 209x345 at two
# intrinsic columns.
# Reference: the projection matrix's cards (location, title with its parent,
# kind, summary, the key values with a rule above each pair, the footer's
# muted vitals) and its side panel, the sidecar. Slot order: location,
# title with parent, kind, summary, key values, vitals; the sidecar, when
# there is one, beside them.
#
# Built on the published Card (global.component.card): this root IS the
# Card's root with the entity-card class added, the body is its
# Card.Content and the vitals its Card.Footer, so the card's row tracks,
# border, radius and section insets (8 above, 16 below and inline) are the
# Card's own. Card.Content's 8px gap and the summary's and key values' 16px
# make the matrix's 16 to the summary and 24 to the key values.
#
# The card sets its text on the matrix's 24px line, the line every
# representation shares (the graph node draws on it too), so its heading
# lines, its key values and its vitals sit on one rhythm. Its paragraphs and
# its heading set no block insets and take the card's line back: the
# typography layer would set its own line on each of them, and add a
# baseline nudge of 4px that the key values do not have.
#
# Every rule reaches its slot through the slot's whole path from the root,
# so nothing a consumer renders in the sidecar or in a slot is restyled.
# A word longer than its box, an identifier most often, ends in an ellipsis
# in the title, the key values and the vitals rather than running under the
# Card's clipped edge; the roster has no key for breaking inside a word.
#
# The sidecar carries a rendered example of the entity beside the body: the
# entity type decides whether it has one (UI blocks), and its consumer fills
# it. It comes first in the DOM so the body's sections keep the Card's
# dividers, and it is placed after them, on the content and footer tracks
# only, so a tall example grows the card's body and footer and never the
# empty image and header tracks above the title.
#
# With-sidecar reflow, bound in styles.css under
# `.ds.entity-card:has(> .sidecar)` (the DSL's states re-value channels and
# never add structure, so the sidecar's presence is a reflow): the card turns
# into a column subgrid as wide as its own span plus the sidecar's two
# columns, its gap the grid's gutter; the body and the footer keep the card's
# own span (`1 / span var(--entity-card-body-span)`); the sidecar takes the
# last two columns of the content and footer tracks.
#
# Every decision is read through a component token declared on the root
# (`--entity-card-*`), bound to the symbol or the literal named here.
#
# Token ledger (no symbol to bind):
#   --entity-card-line-height: space.300  the matrix's 24px line; no
#                                       typography token is 24px in every
#                                       context (the docs' primary line is
#                                       20px).
#   --entity-card-rule-width: 1px       the rule above each key value;
#                                       stroke thickness is primitive only.
#   --entity-card-vital-max-width: 100%  a vital no wider than the footer.
#   --entity-card-sidecar-span: 2       the sidecar's columns: two at least,
#                                       wide enough for a component example.
#   --entity-card-body-span: var(--card-span, 1)  the span the published
#                                       Cards group gives every card.
#
# Roster namespaces (accepted and tracked): container.gap.default,
# component.padding.block, component.padding.inline, space.300 (a line
# height), and the semantic typography symbols
# typography.text.primary.smallcaps.letter.spacing,
# typography.text.primary.fontSize,
# typography.text.primary.bold.fontWeight and
# typography.text.primary.fontWeight.
node:
  uri: prism.component.entity_card
  styles:
    typography.size: typography.text.primary.fontSize
    typography.lineHeight: space.300
  edges:
    - node:
        role: sidecar
        styles:
          layout.grid.column: "span var(--entity-card-sidecar-span) / -1"
          layout.grid.row: "3 / -1"
          size.min.width: 0
          spacing.internal.block.start: component.padding.block
          spacing.internal.block.end: component.padding.block
          spacing.internal.inline.start: component.padding.inline
          spacing.internal.inline.end: component.padding.inline
          appearance.background: color.background.layer2
      relation: { cardinality: "0..1", slotName: sidecar }
    - node:
        uri: global.subcomponent.card-content
        edges:
          - node:
              role: description
              edges:
                - node:
                    role: heading
                    edges:
                      - node:
                          role: location
                          styles:
                            spacing.external.block.start: 0
                            spacing.external.block.end: 0
                            spacing.internal.block.start: 0
                            spacing.internal.block.end: 0
                            typography.lineHeight: space.300
                            typography.color: color.text.muted
                            typography.variant.caps: all-small-caps
                            typography.letterSpacing: typography.text.primary.smallcaps.letter.spacing
                        relation: { cardinality: "0..1", slotName: location }
                      - node:
                          role: title
                          styles:
                            # A heading at the text size: the card's
                            # hierarchy is weight, not size.
                            spacing.external.block.start: 0
                            spacing.external.block.end: 0
                            spacing.internal.block.start: 0
                            spacing.internal.block.end: 0
                            layout.overflow: hidden
                            typography.overflow: ellipsis
                            typography.size: typography.text.primary.fontSize
                            typography.lineHeight: space.300
                            typography.weight: typography.text.primary.bold.fontWeight
                          edges:
                            - node:
                                role: parent
                                styles:
                                  typography.weight: typography.text.primary.fontWeight
                              relation: { cardinality: "0..1", slotName: parent }
                        relation: { cardinality: "1", slotName: title }
                      - node:
                          role: kind
                          styles:
                            spacing.external.block.start: 0
                            spacing.external.block.end: 0
                            spacing.internal.block.start: 0
                            spacing.internal.block.end: 0
                            typography.lineHeight: space.300
                        relation: { cardinality: "0..1", slotName: kind }
                  relation: { cardinality: "1" }
                - node:
                    role: summary
                    styles:
                      spacing.external.block.start: container.gap.default
                      spacing.external.block.end: 0
                      spacing.internal.block.start: 0
                      spacing.internal.block.end: 0
                      typography.lineHeight: space.300
                  relation: { cardinality: "0..1", slotName: summary }
            relation: { cardinality: "1" }
          - node:
              role: key values
              styles:
                spacing.external.block.start: container.gap.default
                spacing.external.block.end: 0
              edges:
                - node:
                    role: pair
                    styles:
                      layout.type: flex
                      appearance.border.width: 1px
                      appearance.border.style: solid
                      appearance.border.block.start.color: color.border.muted
                    edges:
                      - node:
                          role: key
                          styles:
                            layout.flex.grow: 1
                            layout.flex.basis: 0
                            layout.overflow: hidden
                            typography.overflow: ellipsis
                            typography.color: color.text.muted
                        relation: { cardinality: "1", slotName: key }
                      - node:
                          role: value
                          styles:
                            layout.flex.grow: 1
                            layout.flex.basis: 0
                            layout.overflow: hidden
                            typography.overflow: ellipsis
                            spacing.external.inline.start: 0
                        relation: { cardinality: "1", slotName: value }
                  relation: { cardinality: "1..*", slotName: pair }
            relation: { cardinality: "0..1", slotName: key-values }
      relation: { cardinality: "1", slotName: body }
    - node:
        uri: global.subcomponent.card-footer
        edges:
          - node:
              role: vital
              styles:
                size.max.width: 100%
                layout.overflow: hidden
                typography.overflow: ellipsis
                typography.color: color.text.muted
            relation: { cardinality: "1..*", slotName: vital }
      relation: { cardinality: "0..1", slotName: footer }
