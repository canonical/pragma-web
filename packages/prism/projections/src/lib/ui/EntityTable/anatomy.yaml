---
# EntityTable — the table of facts of a single-type index: a header row of
# sort links, one per value field the index's nodes carry, then one row per
# entity, its title cell first and a value cell per column. A row is 32px
# (one line) or 56px (two lines, `.is-two-line`), as the index declares.
# Cells carry `data-property` with the field's id from `Node.values`, in the
# header's order; headers read the first row's value labels. The selected
# row (`aria-selected="true"`, the address's `select=`) takes the raised
# background.
#
# The root is a subgrid over every column of the grid that holds it; the
# head, the body, the header row and each row are subgrids of it, the
# title cell spanning two columns and each value cell one. The grid's
# gutter stands between the rows and between their columns, as in every
# subgrid of the package; a hairline closes each row. A row is clipped at
# its own height, so the value cells that find no column on its line leave
# whole, the last first. A text or list value cell spans two columns, a
# number's (.is-number) one, read from its end, its header too; a folded
# row reads every value from its start. Each value cell holds its field's label (term),
# hidden, then its text (detail); a cell with no value holds neither.
#
# Below two groups (the shell's container query at 912px) the table folds
# into scented rows, from the same markup: the header row is hidden, and
# every row is two lines, 56px, a wrapping flex line rather than the
# canvas's columns (three below one group): the title the first line
# (basis 100%), then its first two value cells sharing the second (grow 1,
# basis 0), each showing its label before its text ("Platforms 8"); the
# later cells (.is-later) are hidden. The two 24px lines stand centred in the row, 4px from its edges.
#
# Token ledger (no symbol to bind):
#   space.400 (32px) for a one-line row's block size: the matrix's row.
#   2 x space.300 + space.100 (56px) for a two-line row's block size: two
#   24px lines between 4px insets, as W3's two-line row.
#   1px for the hairline under each row, as the key-value list's rule.
#   100% for a folded row's title basis: the title is its first line.
#   A space stands between a value's label and its text, which the folded
#   row shows as one line.
#
# Roster namespaces: grid.gutter, space.100, space.300, space.400.
node:
  uri: prism.component.entity_table
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap.inline: grid.gutter
    spacing.gap.block: 0
  edges:
    - node:
        role: head
        styles:
          layout.type: grid
          layout.grid.columns: subgrid
          layout.grid.column: "1 / -1"
          spacing.gap.inline: grid.gutter
          spacing.gap.block: 0
        edges:
          - node:
              role: header row
              styles:
                layout.type: grid
                layout.grid.columns: subgrid
                layout.grid.column: "1 / -1"
                spacing.gap.inline: grid.gutter
                spacing.gap.block: 0
                layout.align: center
                size.block: space.400
                layout.grid.autoRows: space.400
                layout.overflow: hidden
                appearance.border.width: 1px
                appearance.border.style: solid
                appearance.border.bottom.color: color.border.muted
                typography.color: color.text.muted
              edges:
                - node:
                    role: title heading
                    styles:
                      layout.grid.column: "span 2"
                      typography.weight: typography.text.primary.fontWeight
                      size.min.width: 0
                      layout.overflow: hidden
                      typography.align: start
                      typography.whiteSpace: nowrap
                      typography.overflow: ellipsis
                  relation: { cardinality: "1", slotName: heading }
                - switch:
                    on: sorted
                    cases:
                      - node:
                          role: column heading
                          attributes: { data-property: "{field}", aria-sort: "{direction}" }
                          styles:
                            layout.grid.column: "span 2"
                            typography.weight: typography.text.primary.fontWeight
                            size.min.width: 0
                            layout.overflow: hidden
                            typography.align: start
                            typography.whiteSpace: nowrap
                            typography.overflow: ellipsis
                          edges:
                            - node:
                                role: sort link
                                styles:
                                  typography.weight: typography.text.primary.fontWeight
                                  typography.color: inherit
                                  typography.decoration: none
                                  typography.decoration@hover: underline
                                  size.min.width: 0
                                  layout.overflow: hidden
                                  typography.overflow: ellipsis
                              relation: { cardinality: "1", slotName: sort }
                            - node:
                                role: direction
                                styles:
                                  layout.flex.shrink: 0
                              relation: { cardinality: "0..1", slotName: direction }
                      - node:
                          role: number column heading (.is-number)
                          styles:
                            layout.grid.column: "span 1"
                            typography.align: end
                      - node:
                          role: sorted column heading (.is-sorted)
                          styles:
                            layout.type: flex
                            layout.align: center
                            typography.color: color.text
                  relation: { cardinality: "1..*", slotName: column }
            relation: { cardinality: "1", slotName: header }
      relation: { cardinality: "1", slotName: head }
    - node:
        role: body
        styles:
          layout.type: grid
          layout.grid.columns: subgrid
          layout.grid.column: "1 / -1"
          spacing.gap.inline: grid.gutter
          spacing.gap.block: 0
        edges:
          - switch:
              on: lines
              cases:
                - node:
                    role: row
                    styles:
                      layout.type: grid
                      layout.grid.columns: subgrid
                      layout.grid.column: "1 / -1"
                      spacing.gap.inline: grid.gutter
                      spacing.gap.block: 0
                      layout.align: center
                      size.block: space.400
                      layout.grid.autoRows: space.400
                      layout.overflow: hidden
                      appearance.border.width: 1px
                      appearance.border.style: solid
                      appearance.border.bottom.color: color.border.muted
                      appearance.background@selected: color.background.layer2
                    edges:
                      - node:
                          role: title cell
                          styles:
                            layout.grid.column: "span 2"
                            typography.weight: typography.text.primary.fontWeight
                            typography.color: color.text
                            size.min.width: 0
                            layout.overflow: hidden
                            typography.align: start
                            typography.whiteSpace: nowrap
                            typography.overflow: ellipsis
                          edges:
                            - node:
                                role: link
                                styles:
                                  typography.color: inherit
                                  typography.decoration: none
                                  typography.decoration@hover: underline
                              relation: { cardinality: "0..1", slotName: link }
                        relation: { cardinality: "1", slotName: title }
                      - switch:
                          on: folded
                          cases:
                            - node:
                                role: value cell
                                attributes: { data-property: "{field}" }
                                styles:
                                  layout.grid.column: "span 2"
                                  size.min.width: 0
                                  layout.overflow: hidden
                                  typography.align: start
                                  typography.whiteSpace: nowrap
                                  typography.overflow: ellipsis
                                edges:
                                  - node:
                                      role: term
                                      styles:
                                        layout.type: none
                                        typography.color: color.text.muted
                                    relation: { cardinality: "0..1", slotName: term }
                                  - node:
                                      role: detail
                                    relation: { cardinality: "0..1", slotName: detail }
                            # Every value after the folded row's first two:
                            # below two groups it leaves the row.
                            - node:
                                role: later value cell (.is-later)
                                attributes: { data-property: "{field}" }
                            - node:
                                role: number value cell (.is-number)
                                attributes: { data-property: "{field}" }
                                styles:
                                  layout.grid.column: "span 1"
                                  typography.align: end
                        relation: { cardinality: "0..*", slotName: value }
                - node:
                    role: two-line row (.is-two-line)
                    styles:
                      size.block: "calc(2 * var(--space-300) + var(--space-100))"
                      layout.grid.autoRows: "calc(2 * var(--space-300) + var(--space-100))"
            relation: { cardinality: "0..*", slotName: row }
      relation: { cardinality: "1", slotName: body }
