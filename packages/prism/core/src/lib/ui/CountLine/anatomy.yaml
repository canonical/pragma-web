---
# CountLine — an index's count, the strip's or the panel's: "‹shown› of
# ‹total› ‹kind›" with an exact total, "‹shown› of ‹total›+ ‹kind›" with a
# lower bound (a page loaded of more), "‹shown› ‹kind›" with no total: the
# three kinds of count the dataviews stack's Count names, so the rebase is
# a rename. A live region (an output, polite), so a change the filters make
# is announced. Muted, tabular numerals, one line of its own, which may be
# narrower than its text: the text is then cut with an ellipsis rather than
# spilling past it.
#
# A count whose noun carries a second clause has a short form, the figure
# and the noun alone ("100 components" where the full form reads "100
# components loaded so far"): the line then holds both, the full form and
# the short one, and shows one. Below two groups, where the strip folds,
# the short form; at two groups and wider, the full one. The full sentence
# is the line's accessible name (aria-label) at every width, and the
# server renders one HTML for every width: the stylesheet chooses.
#
# Reflow, bound in styles.css:
#   @container shell (width < 912px)   below two groups: the full form is
#     not displayed and the short one is, inline.
#
# Every decision is read through a component token declared on the root
# (`--count-line-*`), bound to the symbol named here.
#
# Token ledger: none.
node:
  uri: prism.component.count_line
  styles:
    layout.type: block
    size.min.width: 0
    layout.overflow.inline: clip
    typography.color: color.text.muted
    typography.variant.numeric: tabular-nums
    typography.whiteSpace: nowrap
    typography.overflow: ellipsis
  edges:
    - node:
        role: full
      relation: { cardinality: "0..1", slotName: full }
    - node:
        role: short
        styles:
          # The narrow form's; at two groups and wider it is not displayed.
          layout.type: none
      relation: { cardinality: "0..1", slotName: short }
