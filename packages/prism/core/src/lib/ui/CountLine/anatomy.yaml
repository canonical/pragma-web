---
# CountLine — an index's count, the strip's or the panel's: "‹shown› of
# ‹total› ‹kind›" with an exact total, "‹shown› of ‹total›+ ‹kind›" with a
# lower bound (a page loaded of more), "‹shown› ‹kind›" with no total: the
# three kinds of count the dataviews stack's Count names, so the rebase is
# a rename. A live region (an output, polite), so a change the filters make
# is announced. Muted, tabular numerals, one line.
#
# Every decision is read through a component token declared on the root
# (`--count-line-*`), bound to the symbol named here.
#
# Token ledger: none.
node:
  uri: prism.component.count_line
  styles:
    typography.color: color.text.muted
    typography.variant.numeric: tabular-nums
    typography.whiteSpace: nowrap
