---
# ModeStrip — the one band atop a lens's canvas, on the canvas's columns
# 3 / -1 of the shell (the strip region places it), laid as a subgrid of
# those columns so its three groups start on fixed lines on every page:
# the trail on columns 1 / span 2, the view group (the renderer links) on
# 3 / span 2, the filtering group from column 5 to the last line. The
# filtering group is a row that never wraps: Search grows into every free
# track, the applied chips follow, and the count closes the group flush on
# the last line; nothing is left empty at the side. An unused group leaves
# its place empty: no placeholder, no divider, nothing moves. The count
# is the last thing to give way (`layout.flex.shrink: 0`): where the group
# is narrower than its content, Search and the chips shrink first, and
# below two groups the trail does. The row is aligned to its end, so a
# count still wider than the group once Search has given way reaches back
# over the view group's empty columns, never past the last line.
#
# Its height is the density line plus one component padding above and
# below, content-box, so an empty strip and a full one are 53px alike and
# the canvas never jumps. The band bleeds across the gutter at its inline
# start (a negative inline margin of one gutter, compensated by the same
# padding) to meet the rail's border; its end is the last column line, so
# it takes no end padding. The band and every group may be narrower than
# their content (`size.min.width: 0`); the trail is clipped at its socket's
# end (an ellipsis where the clipped content is its own text).
#
# Below two groups the band folds to one flex line: the trail, the view
# group's menu, then the filtering group's fold ("Filter · n", a link to
# the sheet) and the count; Search and the chips are not displayed, the
# sheet holds them. The fold is displayed only there.
#
# Every decision is read through a component token declared on the root
# (`--mode-strip-*`), bound to the symbol named here.
#
# Token ledger:
#   --mode-strip-divider-width: 1px  the hairline below the band.
#   --mode-strip-bleed: calc(-1 * var(--grid-gutter))  the negation of
#     grid.gutter, which the DSL cannot spell as a symbol.
#   space.100 (8px) between the controls of one group: one baseline pair;
#     the band's own gap is the grid's gutter.
#   spacing.external.inline.start auto on the count slot: a keyword that
#     keeps the count flush on the last line when nothing grows before it.
#   layout.grid.column spans: structure.
#
# Reflow, bound in styles.css:
#   @container shell (width < 912px)  below two groups: the root is a flex
#     row (nowrap, gap space.100) instead of a subgrid, the view group's
#     menu keeps its width (the trail shrinks), the filtering group grows
#     into the free space; the search and chips slots are not
#     displayed; the fold slot is displayed.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# density.line.height, component.padding.block, space.100, and the
# semantic typography symbol typography.text.primary.bold.fontWeight.
node:
  uri: prism.component.mode_strip
  styles:
    layout.grid.column: "1 / -1"
    layout.type: grid
    layout.grid.columns: subgrid
    layout.align: center
    layout.boxSizing: content-box
    size.min.block: density.line.height
    size.min.width: 0
    spacing.gap: grid.gutter
    spacing.internal.block.start: component.padding.block
    spacing.internal.block.end: component.padding.block
    spacing.external.inline.start: "calc(-1 * var(--grid-gutter))"
    spacing.internal.inline.start: grid.gutter
    spacing.internal.inline.end: 0
    appearance.border.width: 1px
    appearance.border.style: solid
    appearance.border.bottom.color: color.border.muted
  edges:
    - node:
        role: trail group
        styles:
          layout.grid.column: "1 / span 2"
          size.min.width: 0
          layout.overflow.inline: clip
          typography.weight: typography.text.primary.bold.fontWeight
          typography.whiteSpace: nowrap
          typography.overflow: ellipsis
      relation: { cardinality: "1", slotName: trail }
    - node:
        role: view group
        styles:
          layout.grid.column: "3 / span 2"
          size.min.width: 0
          layout.type: flex
          layout.align: center
        edges:
          - node:
              uri: prism.component.renderer_switch
            relation: { cardinality: "0..1", slotName: default }
      relation: { cardinality: "1", slotName: view }
    - node:
        role: filtering group
        styles:
          layout.grid.column: "5 / -1"
          size.min.width: 0
          layout.type: flex
          layout.align: center
          layout.justify: flex-end
          layout.wrap: nowrap
          spacing.gap: space.100
        edges:
          - node:
              role: search slot
              styles:
                layout.flex.grow: 1
                size.min.width: 0
            relation: { cardinality: "0..1", slotName: search }
          - node:
              role: chips slot
              styles:
                size.min.width: 0
            relation: { cardinality: "0..1", slotName: chips }
          - node:
              role: fold slot
              styles:
                layout.type: none
                layout.flex.shrink: 0
              edges:
                - node:
                    uri: prism.component.filter_fold
                  relation: { cardinality: "1", slotName: default }
            relation: { cardinality: "0..1", slotName: fold }
          - node:
              role: count slot
              styles:
                layout.flex.shrink: 0
                spacing.external.inline.start: auto
              edges:
                - node:
                    uri: prism.component.count_line
                  relation: { cardinality: "0..1", slotName: default }
            relation: { cardinality: "0..1", slotName: count }
      relation: { cardinality: "1", slotName: filtering }
