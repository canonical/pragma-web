---
# Canvas — the page's one `<main>` (the skip link's target), a subgrid that
# passes the layout's columns to the routed page it holds, which it wraps in
# a full-width subgrid `page`. Whether the canvas scrolls (document) or
# never scrolls (workspace) is the archetype layout's decision, bound there
# on the `canvas` slot. No `container-type`: size containment would sever the
# subgrid (verified in Chromium). The canvas and the wrapper each hold one row
# of the free height, so a page that fills its height (`block-size: 100%`)
# resolves against the canvas's, not its own content's: a workspace page
# then fits the canvas, and a document page overflows into its scroll. Both
# grids set the grid's gutter as their gap on both axes, through
# `--canvas-gap`.
#
# An optional `aside` sits beside the page in the canvas's last three columns,
# at the top of the page, and is part of the canvas's scroll, never a
# scroller of its own: it scrolls with the page. It is not sticky: an aside
# taller than the canvas (a long table of contents) would keep its middle
# out of reach at every scroll position.
#
# A page that lays a collection on the page grid, such as a catalog's
# cards, gives each item the `page-tile` class (`CANVAS_PAGE_TILE_CLASS_NAME`)
# on a subgrid of the page's columns: the canvas spans each tile over two
# columns, so past one group, where the canvas holds an even number of
# columns, the tiles fill every row to the canvas's end.
#
# Reflow, bound in styles.css:
#   `.ds.canvas:has(> .aside)` the rows follow their content (`auto`), so the
#     scroll covers the longer of the page and the aside, and the page spans
#     1 / -4.
#   @container shell (width < 912px)   below two groups: the page spans
#     1 / -1, and the aside takes row 2 under it.
#   @container shell (width < 448px)   below one group: the canvas holds
#     three columns, and each page tile spans 1 / -1, the whole row.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: prism.component.canvas
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.rows: "minmax(0, 1fr)"
    spacing.gap: grid.gutter
    size.min.block: 0
    size.min.width: 0
    appearance.outline.style@focus: none
  edges:
    - node:
        role: routed page wrapper
        styles:
          layout.type: grid
          layout.grid.columns: subgrid
          layout.grid.column: "1 / -1"
          layout.grid.rows: "minmax(0, 1fr)"
          spacing.gap: grid.gutter
          size.min.width: 0
        edges:
          - node:
              role: routed page
              edges:
                - node:
                    role: page tile
                    styles:
                      layout.grid.column: "span 2"
                      size.min.width: 0
                  relation: { cardinality: "0..*", slotName: page-tile }
            relation: { cardinality: "1", slotName: default }
      relation: { cardinality: "1", slotName: page }
    - node:
        role: aside region
        styles:
          layout.grid.column: "-4 / -1"
          layout.grid.row: "1"
          layout.alignSelf: start
          size.min.width: 0
      relation: { cardinality: "0..1", slotName: aside }
