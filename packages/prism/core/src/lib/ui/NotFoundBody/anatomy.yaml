---
# NotFoundBody — the body of a site's not-found page, under the page's own
# title: one sentence saying no page lives at the address, then every lens
# the router's table declares, in rail order, as a link to the lens's
# home, so a reader with a stale link starts again from a lens. The lenses
# are read off the route table as the rail reads them. The sentence and the
# list stack one gutter apart; the list draws no markers.
#
# Every decision is read through a component token declared on the root
# (`--not-found-body-*`), bound to the symbol named here.
#
# Token ledger:
#   grid.gutter between the sentence and the list, and between links.
#   layout.listStyle none: the links read as a column of homes.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: prism.component.not_found_body
  styles:
    layout.type: flex
    layout.direction: column
    spacing.gap: grid.gutter
  edges:
    - node:
        role: sentence
      relation: { cardinality: "1", slotName: sentence }
    - node:
        role: lens homes (list)
        styles:
          layout.type: flex
          layout.direction: column
          layout.listStyle: none
          spacing.gap: grid.gutter
          spacing.internal.inline.start: 0
          spacing.external.block.start: 0
          spacing.external.block.end: 0
        edges:
          - node:
              role: lens home link
            relation: { cardinality: "0..*", slotName: lens }
      relation: { cardinality: "1", slotName: homes }
