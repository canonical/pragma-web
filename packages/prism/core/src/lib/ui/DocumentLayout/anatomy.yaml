---
# DocumentLayout — the document archetype: a subgrid of the shell spanning
# every column, three rows (strip, body, colophon), its gap the grid's gutter
# on both axes. The rail takes columns
# 1 / span 2 on every row and scrolls on its own; only the canvas scrolls;
# an optional aside takes the last three columns of the body row and is
# sticky at the viewport's height; the colophon is a band under the body.
#
# Reflow, bound in styles.css:
#   `.ds.document-layout:has(> .aside)` the canvas spans 3 / -4 (default,
#     without an aside, 3 / -1).
#   @container shell (width < 912px)   below two groups: the aside leaves
#     the body row for a row of its own under the canvas (rows: strip,
#     canvas, aside, colophon; canvas and aside share the free height).
#   @container shell (width < 448px)   below one group: the rail spans one
#     column; every other region starts at line 2.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: prism.component.document_layout
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    layout.grid.rows: "min-content minmax(0, 1fr) min-content"
    spacing.gap: grid.gutter
    size.min.block: 0
  edges:
    - node:
        uri: prism.component.canvas_skip_link
      relation: { cardinality: "1", slotName: skip-link }
    - node:
        role: rail region
        styles:
          layout.grid.column: "1 / span 2"
          layout.grid.row: "1 / -1"
          layout.overflow.block: auto
          size.min.block: 0
        edges:
          - node:
              uri: prism.component.rail
            relation: { cardinality: "1", slotName: default }
      relation: { cardinality: "1", slotName: rail }
    - node:
        role: strip region
        styles:
          layout.grid.column: "3 / -1"
          layout.grid.row: "1"
          layout.type: grid
          layout.grid.columns: subgrid
          spacing.gap: grid.gutter
        edges:
          - node:
              uri: prism.component.mode_strip
            relation: { cardinality: "0..1", slotName: default }
      relation: { cardinality: "1", slotName: strip }
    - node:
        uri: prism.component.canvas
        styles:
          layout.grid.column: "3 / -1"
          layout.grid.row: "2"
          layout.overflow: auto
      relation: { cardinality: "1", slotName: canvas }
    - node:
        role: aside region
        styles:
          layout.grid.column: "-4 / -1"
          layout.grid.row: "2"
          layout.overflow.block: auto
          size.min.block: 0
      relation: { cardinality: "0..1", slotName: aside }
    - node:
        role: colophon region
        styles:
          layout.grid.column: "3 / -1"
          layout.grid.row: "3"
      relation: { cardinality: "0..1", slotName: colophon }
