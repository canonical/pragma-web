---
# LensBreadcrumbs — the strip's context tenant: the published Breadcrumbs
# with one crumb, the lens's: current on the index, and on a page below it
# a link back to the index through the router. The trail ends at the
# parent: the page's own address is not drawn as a crumb, since an address
# is not a name and the page's heading names it. The published pattern
# carries the crumbs' typography, colours and separators; the decisions
# bound here fold the trail inside whatever width its socket gives it.
#
# The trail may be narrower than its content wherever it is placed, and it
# does not wrap (`layout.wrap: nowrap` on the list, which may be narrower
# than its content either), and its last crumb may shrink below its text:
# its text keeps to one line and is cut at the crumb's end with an
# ellipsis, whether it is the current page or the link back, so the trail
# never wraps and never pushes the strip past the viewport. Each of these
# is an unthemable value, a keyword or zero, so none reads a component
# token (cs:css.properties.values).
node:
  uri: prism.component.lens_breadcrumbs
  styles:
    size.min.width: 0
  edges:
    - node:
        uri: global.component.breadcrumbs
        edges:
          - node:
              role: crumb list
              styles:
                layout.wrap: nowrap
                size.min.width: 0
              edges:
                - node:
                    role: lens crumb
                    styles:
                      size.min.width: 0
                    edges:
                      - node:
                          role: lens crumb text
                          styles:
                            size.min.width: 0
                            layout.overflow: hidden
                            typography.whiteSpace: nowrap
                            typography.overflow: ellipsis
                        relation: { cardinality: "1", slotName: link }
                  relation: { cardinality: "1", slotName: lens }
            relation: { cardinality: "1", slotName: list }
      relation: { cardinality: "1" }
