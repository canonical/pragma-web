---
# Probe — a fixture the checks run against: a grid with one labelled
# child and a link reached through its body, a hover and a selected state,
# a reflow below one group and one that drops the label's rule when the
# body follows it, a mark whose muted state a modifier class sets, every
# decision read through a component token.
node:
  uri: prism.component.probe
  styles:
    layout.type: grid
    spacing.gap: grid.gutter
    spacing.internal.inline.start: space.100
    spacing.internal.inline.end: space.100
    appearance.radius: 0.25rem
    typography.color: color.text
    typography.color@hover: color.text.muted
    typography.color@selected: color.text.muted
  edges:
    - node:
        role: label
        styles:
          typography.weight: typography.text.primary.bold.fontWeight
          typography.variant.caps: all-small-caps
      relation: { cardinality: "1", slotName: label }
    - node:
        role: body
        edges:
          - node:
              role: link
              styles:
                typography.decoration: none
                typography.decoration@hover: underline
            relation: { cardinality: "0..1", slotName: link }
      relation: { cardinality: "1" }
    - switch:
        on: internal
        cases:
          - node:
              role: mark
              styles:
                appearance.opacity: 1
          - node:
              role: muted mark (.is-muted)
              styles:
                appearance.opacity: 0.4
      relation: { cardinality: "1", slotName: mark }
