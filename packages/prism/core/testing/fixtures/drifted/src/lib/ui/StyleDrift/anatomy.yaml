---
# StyleDrift — a fixture the checks run against: a root with one labelled
# child and a link reached through its body, a hover state, a reflow
# below one group and one that re-values a colour.
node:
  uri: prism.component.style_drift
  styles:
    layout.type: flex
    spacing.gap: container.gap.tight
    spacing.internal.inline.start: space.100
    spacing.internal.inline.end: space.100
    appearance.radius: 0.25rem
    typography.color: color.text
    typography.color@hover: color.text.muted
  edges:
    - node:
        role: label
        styles:
          typography.weight: typography.weight.bold
          typography.variant.caps: all-small-caps
      relation: { cardinality: "1", slotName: label }
    - node:
        role: body
        edges:
          - node:
              role: link
              styles:
                typography.decoration: none
                typography.decoration@hover: underline
            relation: { cardinality: "0..1", slotName: link }
      relation: { cardinality: "1" }
