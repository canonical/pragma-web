---
# DataViews.SavedViews — the collection's saved views: which view is open, whether
# the query has moved away from it, and the way to switch, save, save as,
# rename and delete.
#
# Anatomy DSL 0.3.0. No validator runs on this file yet: it is checked in
# review against the DSL's JSON schema. The design system's graph names no
# block for saved views and the design draws none, so the root's IRI is the
# one the component's `@implements` drafts; a graph block is asked of the
# design owners. The
# controls are the design system's own Button, SelectInput and TextInput.
#
# Names — one per part, the same in the DOM and here; the design has none yet:
#   saved-views control  DOM `ds data-views-saved-views`
#   view picker       DOM `.picker`
#   modified mark     DOM `.modified`
#   label             DOM `.label` (the view picker's and the name dialog's)
#   commands          DOM `.commands`
#   name dialog       DOM `ds data-views-saved-views-name-form`
#   name error        DOM `.error`
#   delete dialog     DOM `ds data-views-saved-views-confirm`
#   question          DOM `.message`
#   command status    DOM `.status`
#   notices           DOM `.notices`
#   no-script notice  DOM `.unavailable`
#
# Tokens are `/`-paths over `@canonical/design-tokens` 0.43.0 ids. The select
# and the name input are themed through the form layer's own channels, as the
# pagination bar themes its selects, never restyled:
#   --form-input-height          density/line-height-effective
#   --form-input-padding-block   dimension/050
#   --form-input-padding-inline  dimension/100
# The chrome comes from the `@canonical/react-ds-global-form` stylesheet,
# which the page loads. Once the user has given a name the collection refuses
# (`:user-invalid`, set through the validity API), the chrome's bottom border
# takes the form layer's error channel, `--form-input-border-color-error`,
# as a Field in error does.
#
# Deviations the DSL cannot express, recorded here:
#   - Conditional display is deferred in the DSL. The modified mark shows only
#     while the live query differs from the open view's. The rename and
#     delete dialogs exist only while a view is open.
#   - The dialogs are native modal `dialog`s, opened by their commands'
#     invoker commands (`commandfor`, `command="show-modal"`) and closed by
#     Cancel (`command="close"`) or Escape. The DSL has no relation for an
#     invoker, so the link is recorded here.
#   - Without JavaScript the part renders only the no-script notice, inside a
#     `noscript`: views live in the browser's storage, which a server cannot
#     read. Links to a full query still work, since the query is in the URL.
#   - The design draws no saved-views control. The part is composed from existing
#     components and waits on a design (recorded for the design owners).
#
# States:
#   - listing: loading, listed, unavailable (with a way to try again).
#   - open view: none, open, open and modified.
#   - command: pending (every command but Try again disabled), settled saved,
#     opened or removed (shown while the query is unmodified), conflict (with
#     its recovery: overwrite, save as a new view, discard the changes),
#     missing, unreadable, refused, failed.
#   - name dialog: valid, invalid (the browser's own report, and the error
#     beside the input): a name is required and must not be only spaces
#     (`pattern`), and one the collection refuses is set as the input's
#     validity.
#
# Accessibility (DataViews component coverage, "Views/save/rename/delete":
# 2.1.1, 2.4.6, 3.3.1, 3.3.4, 4.1.2-4.1.3):
#   saved-views control  A named group ("Saved views").
#   view picker       A labelled native select ("View") whose value is the
#                     open view; the modified mark describes it. Choosing a
#                     view opens it.
#   commands          Native buttons named for what they do; "…" marks the ones
#                     that ask for more before acting. Disabled while a
#                     command is pending, Try again aside, or while they have
#                     nothing to act on.
#   name dialog       A modal dialog named for what the name is for, holding
#                     a labelled input ("Name"). An empty, blank or duplicate
#                     name is refused before anything is written, and the
#                     error is tied to the input (aria-invalid,
#                     aria-describedby). Escape cancels; the focus returns to
#                     the command that opened the dialog.
#   delete dialog     A modal dialog named by its question, which names the
#                     view; the focus starts on Cancel. Escape cancels.
#   command status    A polite status: what is in flight, then what happened —
#                     a conflict or a failure is never reported as saved.
#   notices           A polite status: views unavailable, records that cannot
#                     be read, the arrangement not being saved.
node:
  uri: apps.subcomponent.data_views-saved_views
  styles:
    layout.type: stack
    layout.direction: row
    layout.align: center
    spacing.gap: dimension/100
    typography.color: color/text
    typography.family: typography/text/primary/font-family
    typography.size: typography/text/primary/font-size
    typography.weight: typography/text/primary/font-weight
  edges:
    - node:
        role: view picker
        styles:
          layout.type: stack
          layout.direction: row
          layout.align: center
          spacing.gap: dimension/050
        edges:
          - uri: global.subcomponent.select_input
            relation:
              cardinality: "1"
          - node:
              role: modified mark
              styles:
                typography.color: color/text/muted
            relation:
              cardinality: "0..1"
      relation:
        cardinality: "1"
        slotName: picker
    - node:
        role: commands
        styles:
          layout.type: stack
          layout.direction: row
          layout.align: center
          spacing.gap: dimension/050
        edges:
          # Save, Revert, Save as…, Rename…, Delete…, and Try again while the
          # views are unavailable or the arrangement is not being saved. After
          # a conflict on save, Save reads "Overwrite" and Revert "Discard
          # changes": the stored view is open.
          - uri: global.component.button
            relation:
              cardinality: "5..6"
      relation:
        cardinality: "1"
        slotName: commands
    # Save as's dialog always, and Rename's while a view is open.
    - node:
        role: name dialog
        edges:
          - node:
              role: name form
              styles:
                layout.type: stack
                layout.direction: row
                layout.align: center
                spacing.gap: dimension/050
              edges:
                - uri: global.subcomponent.text_input
                  relation:
                    cardinality: "1"
                - node:
                    role: name error
                    styles:
                      typography.color: color/text/error
                  relation:
                    cardinality: "0..1"
                - uri: global.component.button
                  relation:
                    cardinality: "2"
            relation:
              cardinality: "1"
      relation:
        cardinality: "1..2"
        slotName: name-dialogs
    - node:
        role: delete dialog
        styles:
          layout.type: stack
          layout.direction: row
          layout.align: center
          spacing.gap: dimension/050
        edges:
          - node:
              role: question
            relation:
              cardinality: "1"
          - uri: global.component.button
            relation:
              cardinality: "2"
      relation:
        cardinality: "0..1"
        slotName: delete-dialog
    - node:
        role: command status
      relation:
        cardinality: "1"
        slotName: status
    - node:
        role: notices
        styles:
          typography.color: color/text/muted
      relation:
        cardinality: "1"
        slotName: notices
