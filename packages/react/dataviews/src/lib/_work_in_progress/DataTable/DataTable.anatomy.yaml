---
# DataTable — the rows of one collection, over ARIA table roles.
#
# Anatomy DSL 0.3.0. No validator runs on this file yet: it is checked in
# review against the DSL's JSON schema. Named nodes carry the design-system
# graph's IRIs; everything else is a role node. HeaderCell and BodyCell have
# their own files beside their components; this file only references them.
#
# Names — one per part, the same in the design, the DOM and here:
#   DataTable       design "DataTable"    DOM `ds data-table dense`: the root,
#                   the caller's box, holding the table, its footer and its
#                   announcer; the caller's props land here
#   table                                 DOM `div.table`, `role=table`: the
#                   scroll container, whose children are its row groups
#   footer          design "footer"       DOM `div.footer`: beneath the
#                   table and outside its role, holding the pagination bar as
#                   a landmark, sticky to the bottom of the view; the action
#                   bar is to overlay it while rows are selected
#   header row group                      DOM `ds data-table-row-group header`
#   header row, row                       DOM `ds data-table-row`
#   select-all cell                       DOM `ds data-table-header-cell selection`
#   body row group                        DOM `ds data-table-row-group body`
#   selection cell  design "BodyCell: Checkbox variant"
#                                         DOM `ds data-table-body-cell selection`
#   row header cell design "BodyCell"     DOM `ds data-table-body-cell row-header`,
#                   `role=rowheader`: the BodyCell of the one column declared
#                   `rowHeader`, which the row's `aria-labelledby` names it by
#   status row      DOM `ds data-table-row status`
#   status cell     DOM `ds data-table-body-cell status`, `data-status="<status>"`
#   selection mode  `data-selection-mode="true"` on the table while a long
#                   press on touch has put it in the mode where a tap toggles
#                   a row; absent otherwise. An attribute rather than a
#                   class: a recorded deviation, beside `data-status`
#   row id          DOM `[data-row-id]` on each row of a selectable table: the
#                   row a press or a tap landed on, which the table's one
#                   gesture reads
#   gap             DOM `ds data-table-gap`, hidden from assistive technology
#   settings cell   design "settings action cell"
#                   DOM `ds data-table-header-cell settings`
#   announcement    DOM `ds data-views-announcer`, in the frame after the
#                   footer, read and not drawn: a standalone table's own, or
#                   none, where a connected table speaks through its root's
# The selection and status cells share the body cell's class for its shared
# box, but they are role nodes here, not BodyCells: the table's `selectable`
# prop and its outcome choose them, never a column.
#
# Tokens are `/`-paths over `@canonical/design-tokens` 0.10.0 ids. Two
# bindings read a `@canonical/styles` channel rather than a token: the row's
# minimum height (`density/line-height-effective`, `--density-line-height-effective`)
# and the cells' inline padding (`density/padding-inline`,
# `--density-padding-inline`). The DSL has no way to say "channel", so the
# path names it and this note records the deviation.
#
# Density: the root carries the design system's `.dense` class, so the table
# is dense wherever it sits. It reads the channel and defines no density rule
# of its own. `.dense` is a class, not a state; nothing changes structurally.
#
# Accessibility (DataViews component coverage):
#   table, rows, cells  "DataTable/header/row/cell"
#                       (1.3.1-1.3.2, 2.1.1-2.1.2, 2.4.3, 2.4.7, 4.1.2)
#   select-all, selection cells
#                       "Row/select-all checkboxes" (1.3.1, 2.1.1, 4.1.2-4.1.3)
#                       — CheckboxInput's own contract, plus the table's
#                       names: "Select all displayed rows", "Select <row>"
#   status row          "pending/regrouping/failed/refresh-failed/stale/no-data/no-results"
#                       (1.3.1, 1.4.1, 4.1.3). The cell is `role=cell`, not a
#                       live region; a settled outcome — failed, stale,
#                       refresh-failed, no-data, no-results — wraps its text
#                       in `role=status`, a passing state is silent.
#   settings cell       "DataViews.Settings" (1.3.1, 2.1.1, 2.4.3, 2.5.7,
#                       4.1.2-4.1.3): present only when the table is given
#                       `DataViews.Settings` as its `settings`; the settings
#                       menu's own file states its contract
#   footer              "PaginationBar" (1.3.1, 2.4.1, 4.1.2): the bar's own
#                       navigation landmark, outside the table role, so it is
#                       reached as a landmark and never read as a row
#   announcement        "DataViews.Settings", "Column header menu" and the
#                       sort (4.1.3): one polite live region per root, in the
#                       frame after the footer, coalescing what is said in one
#                       moment and adding each announcement as a new node,
#                       saying what
#                       has no place on screen to be read from — the new
#                       ordering, why a sort changed nothing, a column hidden,
#                       shown or moved with its new position, always shown,
#                       reset, selection mode entered on touch and ended. It
#                       never repeats the status row. Every word comes from
#                       the messages record
#   virtualized body    "DataTable virtualized rows" (1.3.1, 2.1.1, 2.4.3,
#                       4.1.2): the table reports `aria-rowcount` and every
#                       mounted row its `aria-rowindex` in logical order, the
#                       header row being 1, so a gap is never read as the
#                       table's end; the row holding focus stays mounted.
#
# Virtualized: a table given `virtualization` mounts only the entries near its
# viewport. The body row group takes the `virtual` class and holds gaps
# in place of the entries it does not mount: before the first run of
# mounted entries, between runs, and after the last. The table becomes the
# scroll viewport the range is measured against. None of this changes a
# table without `virtualization`.
#
# Deviations the DSL cannot express, recorded here:
#   - The surface background channel: `appearance.background` is read through
#     `--surface-color-background`, falling back to `color/background`.
#   - Borders are two keys (width, colour): the package has no composite
#     border token.
#   - `layout.position: sticky` on the header row group: the key is valid
#     under the DSL's open key pattern but outside its documented
#     vocabulary.
#   - Row tracks come from `--data-table-columns`, the solver's per-render
#     publication — component-local geometry no stylesheet can know. The
#     selection track precedes it and the settings track follows it, both
#     the stylesheet's own and both present only when the header holds
#     their cell; every body row keeps the settings track, empty.
#   - The selection and settings cells are drawn as header cells, sharing
#     the header cell's box, with `ds data-table-header-cell selection` and
#     `ds data-table-header-cell settings` rather than a class named for the
#     part that renders each: a recorded deviation from the code standards'
#     kebab-case class names, so both cells take the header row's rules.
#   - The announcement is hidden by clipping, unthemable geometry, and is
#     rendered in the frame after the footer rather than in the table, since
#     a table's children are its row groups: the DSL has no node for a region
#     read and never drawn, so it is a role node with no styles. A connected
#     table renders none of its own: the root's is the one it speaks
#     through, which the DSL cannot state either.
#   - The frame is a flex column (`layout.type: stack`) whose table shrinks
#     below its content (`flex: 1 1 auto; min-block-size: 0`) so that a
#     capped frame scrolls the table and not the frame; the footer is sticky
#     to the bottom of the view (`layout.position: sticky`, `inset-block-end:
#     0`). The DSL names neither flex shrinking nor a sticky edge.
#   - A selected row under the pointer takes
#     `color/foreground/secondary/information/hover`; compound states
#     (`@selected@hover`) are reserved, not permitted, in 0.3.0. The row's
#     selected state is `aria-selected`, which the stylesheet selects by
#     attribute; no class repeats it.
#   - The status row and the rows are exclusive, except that a stale or a
#     refresh-failed status precedes the rows it describes. Conditional
#     display is deferred in the DSL.
#   - A row's bottom border is drawn on every row but the last: the DSL
#     cannot condition a style on position.
#   - Where any pointer is coarse a selectable row declines text selection and
#     the platform's callout (`user-select: none`, `-webkit-touch-callout: none`),
#     since a held touch there is the row's long press; the DSL has neither
#     key nor pointer media.
#   - The status cell wraps where every other cell holds one line, and its
#     row lays out as a block, so it spans the table even when a selectable
#     table has no columns; the DSL has no keys for either.
#   - The statuses (pending, regrouping, failed, refresh-failed, stale,
#     no-data, no-results) are the core's `DisplayStatus`, carried as
#     `data-status`; they are not registry states. They change text, and the
#     two failures take `color/text/error` in place of `color/text/muted`.
#     A recorded deviation from the code standards' state selectors, which
#     reserve attributes for native states and classes for custom ones: a
#     bare state word as a class (`.failed`, `.stale`) collides with global
#     classes, so the status is an attribute the stylesheet selects by value
#     and the anatomy names by that value. To be raised against the standard.
#   - Selection mode is carried as `data-selection-mode` for the same reason:
#     a custom state, which the code standards would write as a class, and
#     a bare `.selecting` class would collide with global classes as a
#     status word would. The anatomy names it by its presence, and a
#     stylesheet selects it the same way. To be raised against the standard
#     with `data-status`.
#   - `color/focus-ring` is the package's `color.focusRing`: a camelCase id
#     the DSL's token-path grammar (`[a-z0-9-]+`) cannot spell.
#   - The header row group's stacking above the scrolled body, and the
#     footer's above the table where the two overlap, use z-index 1; the
#     package has no stacking token. The footer draws no surface or rule of
#     its own: the pagination bar it holds draws both.
#   - A gap's height is the range's per-render publication, the height of
#     the entries it stands for, written on the gap itself: geometry no
#     stylesheet can know, as `--data-table-columns` is.
#   - The virtualized table is positioned (`layout.position: relative`), so the
#     body's offset is measured from it, and it opts out of the browser's
#     scroll anchoring (`overflow-anchor: none`): the range anchors the
#     scroll itself, and two corrections would move it twice. By default it
#     is no taller than the viewport (`100svh`), so the range stays bounded
#     wherever it sits; a height capped on the table's root lowers it, and
#     nothing a caller passes raises it. `virtual` is a class,
#     not a registry state, and the DSL has no key for scroll anchoring.
#
# Rows take a minimum height from the density line, never a fixed one, so a
# taller cell grows its row (see BodyCell). One status row covers the four
# no-rows outcomes and the first load, and a refresh keeps the retained rows
# visible while the table reports busy; there is no per-cell skeleton. The
# stylesheet names the rows' trailing grid line, so a track after the data
# tracks lands there without the solver.
node:
  uri: apps.pattern.data_table
  styles:
    layout.type: stack
    typography.color: color/text
    typography.family: typography/text/primary/font-family
    typography.size: typography/text/primary/font-size
    typography.weight: typography/text/primary/font-weight
    appearance.background: color/background
    appearance.border.width: dimension/stroke/thickness/medium
    appearance.border.color: color/border/muted
  edges:
    - node:
        role: table
        styles:
          layout.overflow: auto
        edges:
          - node:
              role: header row group
              styles:
                layout.position: sticky
                appearance.background: color/background/layer2
                appearance.border.bottom.width: dimension/stroke/thickness/medium
                appearance.border.bottom.color: color/border/muted
              edges:
                - node:
                    role: header row
                    styles:
                      layout.type: grid
                      layout.align: center
                      size.min.height: density/line-height-effective
                    edges:
                      - node:
                          role: select-all cell
                          styles:
                            layout.type: stack
                            layout.align: center
                            layout.justify: center
                            layout.overflow: visible
                            size.width: dimension/400
                            spacing.internal.inline: 0
                          edges:
                            # Unchecked, mixed or checked over the displayed rows —
                            # the checkbox's own states and tokens.
                            - uri: global.subcomponent.checkbox_input
                              relation:
                                cardinality: "1"
                        relation:
                          cardinality: "0..1"
                      - uri: apps.subcomponent.data_table-header_cell
                        relation:
                          cardinality: "1..*"
                      - node:
                          role: settings cell
                          styles:
                            layout.type: stack
                            layout.align: center
                            layout.justify: center
                            layout.overflow: visible
                            size.width: dimension/400
                            spacing.internal.inline: 0
                          edges:
                            - uri: apps.subcomponent.data_table-settings_menu
                              relation:
                                cardinality: "1"
                        relation:
                          cardinality: "0..1"
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
          - node:
              role: body row group
              edges:
                - node:
                    role: row
                    styles:
                      layout.type: grid
                      layout.align: center
                      size.min.height: density/line-height-effective
                      appearance.border.bottom.width: dimension/stroke/thickness/medium
                      appearance.border.bottom.color: color/border/muted
                      appearance.background@hover: color/foreground/ghost/hover
                      appearance.background@selected: color/foreground/secondary/information
                    edges:
                      - node:
                          role: selection cell
                          styles:
                            layout.type: stack
                            layout.align: center
                            layout.justify: center
                            layout.overflow: visible
                            size.width: dimension/400
                            spacing.internal.inline: 0
                          edges:
                            # Unchecked or checked — the checkbox's own states and
                            # tokens. No table-specific checkbox styles.
                            - uri: global.subcomponent.checkbox_input
                              relation:
                                cardinality: "1"
                        relation:
                          cardinality: "0..1"
                      - uri: apps.subcomponent.data_table-body_cell
                        relation:
                          cardinality: "1..*"
                  relation:
                    cardinality: "0..*"
                - node:
                    role: status row
                    edges:
                      - node:
                          role: status cell
                          styles:
                            spacing.internal.block: dimension/300
                            spacing.internal.inline: density/padding-inline
                            typography.color: color/text/muted
                            typography.align: center
                        relation:
                          cardinality: "1"
                  relation:
                    cardinality: "0..1"
                # Virtualized only: the space of the entries not mounted.
                - node:
                    role: gap
                  relation:
                    cardinality: "0..*"
            relation:
              cardinality: "1"
      relation:
        cardinality: "1"
    - node:
        role: footer
        styles:
          layout.position: sticky
        edges:
          - uri: apps.subcomponent.data_table-pagination_bar
            relation:
              cardinality: "0..1"
      relation:
        cardinality: "0..1"
        slotName: footer
    - node:
        role: announcement
      relation:
        cardinality: "0..1"
