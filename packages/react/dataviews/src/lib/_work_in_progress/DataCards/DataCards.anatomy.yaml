---
# DataCards — a collection's records as the design system's cards: one card per
# record on the page, headed and named by its title field, the other fields
# listed beneath it.
#
# PROVISIONAL. A work-in-progress spike: no design exists for data cards, so
# this file records what the spike draws rather than what a design specifies,
# and is rewritten when one does.
#
# Anatomy DSL. Checked in review against the DSL's JSON schema; no validator
# runs on it in this repository. The root and the cards reference the design
# system's own blocks; the parts added around and inside them are role nodes.
#
# Names — one per part, the same in the DOM and here:
#   cards           DOM `ds data-cards`, a `section` named by `label`
#   select all      DOM `.select-all`, a native checkbox and its label
#   status          DOM `.status`, carrying `data-status`
#   list            the design system's Cards group, `ds cards`, `role="list"`
#   card            the design system's Card, `ds card data-card`,
#                   `role="listitem"`, named by its title
#   header          Card.Header: the record's checkbox, then its title
#   title           DOM `.title`, the title field's value
#   details         Card.Content holding a `dl` of the other fields
#   field           DOM `.field`: a `dt` heading and a `dd` value
#
# Tokens are `/`-paths over `@canonical/design-tokens` 0.43.0 ids. The Card
# and the Cards group bind their own; the spike adds only spacing and type:
#   gap between the parts         dimension/200
#   select-all checkbox to label  dimension/050
#   field rows and columns        dimension/050, dimension/200
#   text                          typography/text/primary, color/text
# Findings owed to the design owners: a data card's anatomy (where selection,
# a menu and status sit on a card), the card's span on the application grid
# (the spike spans one intrinsic group of four columns), and whether a card
# field list is a description list or a table of its own.
node:
  uri: global.group.cards
  styles:
    layout.type: stack
    layout.direction: column
    spacing.gap: dimension/200
    typography.color: color/text
    typography.family: typography/text/primary/font-family
    typography.size: typography/text/primary/font-size
    typography.weight: typography/text/primary/font-weight
  edges:
    - node:
        role: select-all
        styles:
          layout.type: stack
          layout.direction: row
          layout.align: center
          spacing.gap: dimension/050
        edges:
          - uri: global.subcomponent.checkbox_input
            relation:
              cardinality: "1"
          - node:
              role: label
            relation:
              cardinality: "1"
      relation:
        cardinality: "0..1"
    - node:
        role: status
        styles:
          spacing.internal.block: dimension/100
      relation:
        cardinality: "0..1"
    - node:
        role: list
        edges:
          - node:
              uri: global.component.card
              edges:
                - node:
                    role: header
                    edges:
                      - uri: global.subcomponent.checkbox_input
                        relation:
                          cardinality: "0..1"
                      - node:
                          role: title
                        relation:
                          cardinality: "1"
                  relation:
                    cardinality: "1"
                - node:
                    role: details
                    styles:
                      layout.type: grid
                      spacing.gap.row: dimension/050
                      spacing.gap.column: dimension/200
                    edges:
                      - node:
                          role: field
                        relation:
                          cardinality: "1..*"
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "0..*"
      relation:
        cardinality: "1"
