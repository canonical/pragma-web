---
# EntityPlaceholder — marks a region a generic Entity component (EntityCard,
# EntityList) will fill once it lands: the interim content the network lens
# shows there, inside a dashed edge, with a muted caption naming the
# component that replaces it. Bespoke and temporary: it goes when the
# component it names arrives.
#
# Every decision is read through a component token declared on the root
# (`--entity-placeholder-*`), bound to the symbol named here.
#
# Token ledger:
#   appearance.border.width 1px: no semantic stroke thickness token.
node:
  uri: metro.component.entity_placeholder
  styles:
    layout.type: grid
    spacing.gap: grid.gutter
    spacing.internal.block.start: component.padding.block
    spacing.internal.block.end: component.padding.block
    spacing.internal.inline.start: component.padding.inline
    spacing.internal.inline.end: component.padding.inline
    appearance.border.width: 1px
    appearance.border.style: dashed
    appearance.border.color: color.border
  edges:
    - node:
        role: interim content
      relation: { cardinality: "1", slotName: default }
    - node:
        role: caption
        # "EntityCard goes here", through the catalog
        styles:
          typography.color: color.text.muted
      relation: { cardinality: "1", slotName: caption }
