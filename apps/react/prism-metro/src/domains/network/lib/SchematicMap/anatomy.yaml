---
# SchematicMap — the network as an octilinear diagram, drawn as SVG on the
# server: every line once (a route and its reverse are one track), lines
# sharing a stretch side by side, each station a dot or, where tracks pass
# side by side or lines meet, a capsule, every station's name placed clear
# of every other mark and name, and every mark a link to its station.
# Bespoke: no published component draws a diagram.
#
# Geometry is SVG drawing in the viewBox's user units (positions, path data,
# radii, stroke widths, the names' font size), computed by the geometry
# module, not CSS. Paint goes through currentColor: each slot sets `color`
# and its shapes fill or stroke with currentColor, since the style-key
# roster has no fill or stroke key. A track's stroke is its line's colour
# from the graph: data, not a design decision.
#
# Each station mark is where EntityGraphNode will render (a native SVG
# group, never HTML in a foreignObject); until then the mark is this
# component's own, marked `data-placeholder="EntityGraphNode"`.
#
# The drawing is an item of the canvas's page, a subgrid, so it spans every
# column of it and fills its height.
#
# Reflow, bound in styles.css:
#   @container shell (width < 912px)  below two groups the names hide: at
#     that size they would render under 12px. Each mark keeps its name as
#     its accessible title.
#
# Every decision is read through a component token declared on the root
# (`--schematic-map-*`), bound to the symbol named here.
#
# Token ledger:
#   appearance.outline.width@focus 2px on a station: no semantic stroke
#     thickness token.
node:
  uri: metro.component.schematic_map
  styles:
    layout.type: block
    layout.grid.column: "1 / -1"
    size.inline: 100%
    size.block: 100%
    typography.color: color.text
  edges:
    - node:
        role: title
        # the <svg>'s <title>, its accessible name
      relation: { cardinality: "1" }
    - node:
        role: line track
        # one <path> per drawn track, stroked in its line's colour
      relation: { cardinality: "1..*" }
    - node:
        role: station mark
        # an <a> to the station's page: a box filled with currentColor,
        # the fill inset inside it, and the name
        styles:
          typography.color: color.text
          typography.color@hover: color.text.link
          appearance.outline.color@focus: color.focusRing
          appearance.outline.style@focus: solid
          appearance.outline.width@focus: 2px
      relation: { cardinality: "1..*", slotName: station }
    - node:
        role: mark fill
        # the inner shape of a mark, in the background's colour
        styles:
          typography.color: color.background
      relation: { cardinality: "1..*", slotName: fill }
    - node:
        role: station name
        # a <text> at the placed anchor; it paints in its mark's colour
      relation: { cardinality: "1..*", slotName: label }
