---
# CallStop — one stop of a route as a door card: its name linking to the
# station's home, a tick on the strip's rule, and at an interchange the codes
# of the other lines it meets and the transfer time. The current station
# (on its own page) is marked with aria-current.
node:
  uri: metro.component.call_stop
  projection:
    on: Call
  styles:
    layout.type: grid
    spacing.gap.block: container.gap.tight
    layout.flex.shrink: 0
  edges:
    - node:
        role: stop name
        projection: { field: stop._meta.title }
        # link to the stop's home; aria-current="page" when current
        styles:
          typography.color: color.text
          typography.weight@selected: typography.weight.semiBold
        edges:
          - node:
              role: stop address
              # the href, through the stop's home
              projection: { field: stop.uri }
            relation: { cardinality: "1" }
      relation:
        cardinality: "1"
        slotName: title
    - node:
        role: position
        projection: { field: position }
        # rendered as the <li value>, never as text
      relation:
        cardinality: "1"
    - node:
        uri: prism.component.entity_chip
        # S3's chip: each other line's code, in its colour
        projection: { field: code }
        edges:
          - node:
              role: line identity
              # to drop the strip's own line and to colour the chip
              projection: { field: uri }
            relation: { cardinality: "1" }
          - node:
              role: line colour
              projection: { field: colour }
            relation: { cardinality: "1" }
      relation:
        cardinality: "0..*"
        slotName: connections
        projection: { field: stop.servesLine }
    - node:
        role: transfer time
        projection:
          on: Interchange
          field: transferMinutes
        styles:
          typography.color: color.text.muted
      relation:
        cardinality: "0..1"
        slotName: meta
