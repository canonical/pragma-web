---
# LineGraphNode: A line as a node of a graph: its mark, its prefix off the
# page's namespace and its name, linked to its home. Its mark says its type,
# so it names no kind. Its mark is a disc of the line's colour
# (`SwatchMark`), which the package paints only with a plain colour value.
node:
  uri: metro.component.line_graph_node
  projection:
    on: Line
  edges:
    - node:
        uri: prism.component.entity_graph_node
        edges:
          - node:
              role: mark
              # The line's colour, a SwatchMark: the package gates the
              # value, so a colour it refuses leaves the disc uncoloured.
              edges:
                - node:
                    uri: prism.component.swatch_mark
                    projection:
                      field: colour
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
      relation:
        cardinality: "1"
