---
# LineGraphNode: A line as a node of a graph: its mark, its prefix off the
# page's namespace and its name, linked to its home. Its mark says its type,
# so it names no kind. Its mark is an SVG disc ringed in the muted text
# colour, filled with the line's colour only through the colour gate.
node:
  uri: metro.component.line_graph_node
  projection:
    on: Line
  edges:
    - node:
        uri: prism.component.entity_graph_node
        edges:
          - node:
              role: mark
              # Its ring is drawn in the current colour.
              styles:
                typography.color: color.text.muted
              # An SVG disc (a graph node's mark is SVG, never HTML in a
              # foreignObject): its fill is the line's colour through the
              # gate, so a colour it refuses leaves the disc unfilled.
              edges:
                - node:
                    role: swatch
                    projection:
                      field: colour
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
      relation:
        cardinality: "1"
