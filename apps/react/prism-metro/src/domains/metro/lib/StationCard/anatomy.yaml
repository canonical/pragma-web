---
# StationCard: A station as a card: its mark, its prefix off the page's
# namespace, its name linked to its home, its definition, and its platforms,
# its fare zone and the lines it serves as facts, each only when the graph
# asserts it. It states no address and no kind: the peek's line carries the
# address, and its mark says the type. Its mark is the station's glyph, a
# published icon.
node:
  uri: metro.component.station_card
  projection:
    on: Station
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The station's glyph, a published Icon (STATION_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: platformCount
                    projection:
                      field: platformCount
                  relation:
                    cardinality: "0..1"
                - node:
                    role: inZone
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: inZone
                - node:
                    role: servesLine
                    # Every line the station serves, joined into one value.
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..*"
                    projection:
                      field: servesLine
            relation:
              cardinality: "0..1"
              slotName: facts
      relation:
        cardinality: "1"
