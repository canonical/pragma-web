---
# SiteRowSlot: a metro node as the 32px list entry, dispatched on its
# type inside the package's row dispatcher.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, canvas 449:22295 (the matrix: one
# EntityRow per type). It fills the package's site slot: the row dispatcher
# renders it over the slot's key for every typename the site's row map
# lists, and it renders the case that typename selects. It renders no
# element of its own. The cases are its fragment's aliased spreads and the
# site map's row keys, by the same names.
node:
  uri: metro.component.site_row_slot
  projection: { on: Node }
  edges:
    - switch:
        on: internal
        cases:
          - node: { uri: metro.component.station_row, projection: { on: Station } }
          - node: { uri: metro.component.interchange_row, projection: { on: Interchange } }
          - node: { uri: metro.component.line_row, projection: { on: Line } }
          - node: { uri: metro.component.zone_row, projection: { on: Zone } }
      relation: { cardinality: "1" }
