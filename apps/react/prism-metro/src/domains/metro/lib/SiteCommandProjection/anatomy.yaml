---
# SiteCommandProjection: a metro node as the 56px command-palette result,
# dispatched on its type inside the package's command dispatcher.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, canvas 449:22295 (the matrix: one
# EntityCommand per type). It fills the package's site slot: the command
# dispatcher renders it over the slot's key for every typename the site's
# command map lists, and it renders the case that typename selects. It
# renders no element of its own. The cases are its fragment's aliased
# spreads and the site map's command keys, by the same names.
node:
  uri: metro.component.site_command_projection
  projection: { on: Node }
  edges:
    - switch:
        on: internal
        cases:
          - node: { uri: metro.component.station_command, projection: { on: Station } }
          - node: { uri: metro.component.interchange_command, projection: { on: Interchange } }
          - node: { uri: metro.component.line_command, projection: { on: Line } }
          - node: { uri: metro.component.zone_command, projection: { on: Zone } }
      relation: { cardinality: "1" }
