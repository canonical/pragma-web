---
# ZoneCommand: A fare zone as a command-palette entry: its mark and its
# name, linked to its home where the site gives it one, then its compact
# address, its kind and its count of stations, its one figure, in the
# status. The address states its
# namespace, so it shows no prefix. Its mark is the zone's glyph, a
# published icon.
node:
  uri: metro.component.zone_command
  projection:
    on: Zone
  edges:
    - node:
        uri: prism.component.entity_command
        edges:
          - node:
              role: mark
              # The zone's glyph, a published Icon (ZONE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: address
              projection:
                field: _meta.curie
            relation:
              cardinality: "1"
              slotName: address
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
          - node:
              role: status
              # The count of the stations in the zone.
              projection:
                field: stops.uri
            relation:
              cardinality: "1"
              slotName: status
      relation:
        cardinality: "1"
