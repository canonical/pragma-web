---
# LineCard: A line as a card: its mark, its prefix off the page's namespace,
# its name linked to its home, its definition, and its stop count and, for a
# line run end to end, its ends as facts, with "loop" as its status for a
# line that runs one. It states no address and no kind: the peek's line
# carries the address, and its mark says the type. Its mark is a disc of the
# line's colour (`SwatchMark`), which the package paints only with a plain
# colour value.
node:
  uri: metro.component.line_card
  projection:
    on: Line
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The line's colour, a SwatchMark: the package gates the
              # value, so a colour it refuses leaves the disc uncoloured.
              edges:
                - node:
                    uri: prism.component.swatch_mark
                    projection:
                      field: colour
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: code
                    projection:
                      field: code
                  relation:
                    cardinality: "1"
                - node:
                    role: servedBy
                    projection:
                      field: uri
                  relation:
                    cardinality: "1"
                    projection:
                      field: servedBy
                - node:
                    role: routes
                    # The first route's first and last stops, on a line
                    # that runs no loop.
                    projection:
                      field: stop._meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: routes.calls
            relation:
              cardinality: "0..1"
              slotName: facts
          - node:
              role: status
              projection:
                field: isLoop
            relation:
              cardinality: "0..1"
              slotName: status
              projection:
                field: routes
      relation:
        cardinality: "1"
