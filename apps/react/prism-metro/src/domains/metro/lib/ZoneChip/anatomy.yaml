---
# ZoneChip: A fare zone as an inline mention: its mark, its prefix when the
# zone is off the page's namespace, and its name, linked to its home where
# the site gives it one (a fare zone has none on this site, so it reads as
# text, with no peek); a linked chip peeks at the zone's card, the peek the site's provider
# gives. A passage's own link text, given as `children`, stands in for the
# name; `linked={false}` sets the chip as inert text. Its mark is the
# zone's glyph, a published icon.
node:
  uri: metro.component.zone_chip
  projection:
    on: Zone
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: mark
              # The zone's glyph, a published Icon (ZONE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
                # The peek: the node's card, read by its own query when open.
                - node:
                    uri: prism.component.projection_peek
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
      relation:
        cardinality: "1"
