---
# InterchangeRow: An interchange as a list entry: its mark, its prefix off the page's
# namespace, its name linked to its home, its platform count as a fact; a
# two-line row (`lines="two"`) puts its definition under the name. Its mark
# is the interchange's glyph, a published icon.
node:
  uri: metro.component.interchange_row
  projection:
    on: Interchange
  edges:
    - node:
        uri: prism.component.entity_row
        edges:
          - node:
              role: mark
              # The interchange's glyph, a published Icon (INTERCHANGE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: platformCount
                    projection:
                      field: platformCount
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "0..1"
              slotName: facts
      relation:
        cardinality: "1"
