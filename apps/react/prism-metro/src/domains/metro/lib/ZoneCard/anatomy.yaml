---
# ZoneCard: A fare zone as a card: its mark, its prefix off the page's
# namespace, its name, linked to its home where the site gives it one, its
# definition, and its count of stations as a fact. It states no address and no kind: the peek's line carries the
# address, and its mark says the type. Its mark is the zone's glyph, a
# published icon.
node:
  uri: metro.component.zone_card
  projection:
    on: Zone
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The zone's glyph, a published Icon (ZONE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: stops
                    # The count of the stations in the zone.
                    projection:
                      field: stops.uri
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: facts
      relation:
        cardinality: "1"
