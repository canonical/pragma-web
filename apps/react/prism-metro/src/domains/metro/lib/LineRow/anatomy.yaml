---
# LineRow: A line as a list entry: its mark, its prefix off the page's
# namespace, its name linked to its home, its stop count as a fact and
# "loop" as its status for a line that runs one; a two-line row
# (`lines="two"`) puts its definition under the name. Its mark is a disc of
# the line's colour (`SwatchMark`), which the package paints only with a
# plain colour value.
node:
  uri: metro.component.line_row
  projection:
    on: Line
  edges:
    - node:
        uri: prism.component.entity_row
        edges:
          - node:
              role: mark
              # The line's colour, a SwatchMark: the package gates the
              # value, so a colour it refuses leaves the disc uncoloured.
              edges:
                - node:
                    uri: prism.component.swatch_mark
                    projection:
                      field: colour
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: servedBy
                    projection:
                      field: uri
                  relation:
                    cardinality: "1"
                    projection:
                      field: servedBy
            relation:
              cardinality: "0..1"
              slotName: facts
          - node:
              role: status
              projection:
                field: isLoop
            relation:
              cardinality: "0..1"
              slotName: status
              projection:
                field: routes
      relation:
        cardinality: "1"
