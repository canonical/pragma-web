---
# LineChip: A line as an inline mention: its mark, its prefix when the line
# is off the page's namespace, and its name, linked to its home; a linked
# chip peeks at the line's card, the peek the site's provider gives. A
# passage's own link text, given as `children`, stands in for the name;
# `linked={false}` sets the chip as inert text. Its mark is a disc of the
# line's colour (`SwatchMark`), which the package paints only with a plain
# colour value.
node:
  uri: metro.component.line_chip
  projection:
    on: Line
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: mark
              # The line's colour, a SwatchMark: the package gates the
              # value, so a colour it refuses leaves the disc uncoloured.
              edges:
                - node:
                    uri: prism.component.swatch_mark
                    projection:
                      field: colour
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
                # The peek: the node's card, read by its own query when open.
                - node:
                    uri: prism.component.projection_peek
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
      relation:
        cardinality: "1"
