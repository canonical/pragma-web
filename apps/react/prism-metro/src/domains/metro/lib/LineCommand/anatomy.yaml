---
# LineCommand: A line as a command-palette entry: its mark and its name,
# linked to its home, then its compact address, its kind and its stop count,
# its one figure, in the status. The address states its namespace, so it
# shows no prefix. Its mark is a disc of the line's colour (`SwatchMark`),
# which the package paints only with a plain colour value.
node:
  uri: metro.component.line_command
  projection:
    on: Line
  edges:
    - node:
        uri: prism.component.entity_command
        edges:
          - node:
              role: mark
              # The line's colour, a SwatchMark: the package gates the
              # value, so a colour it refuses leaves the disc uncoloured.
              edges:
                - node:
                    uri: prism.component.swatch_mark
                    projection:
                      field: colour
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: address
              projection:
                field: _meta.curie
            relation:
              cardinality: "1"
              slotName: address
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
          - node:
              role: status
              projection:
                field: uri
            relation:
              cardinality: "1"
              slotName: status
              projection:
                field: servedBy
      relation:
        cardinality: "1"
