# RollingStockChip: a rolling stock on the generic entity chip, filling the title as its value and the kind as its badge.
# It adds no styles: the generic component owns them.
node:
  uri: metro.fleet.rolling-stock-chip
  projection:
    on: RollingStock
  edges:
    - node:
        uri: prism.projections.entity-chip
      relation:
        cardinality: "1"
        slotName: default
    - node:
        role: title
        projection:
          field: _meta.title
      relation:
        cardinality: "1"
        slotName: title
    - node:
        role: kind
        projection:
          field: _meta.type._meta.title
      relation:
        cardinality: "1"
        slotName: kind
