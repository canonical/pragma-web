---
# StockList — the fleet index's list, a subcomponent of FleetIndex: every
# rolling stock in the shared list view of nodes, with the count line, the
# view toggle and the empty line it carries. As cards, each stock's card
# draws its formations at one scale in its specimen; as rows, each row counts
# them. The view is the address's `as` parameter, rows when it names none.
#
# It renders no element of its own and binds no styles: EntityList is the
# root, and each stock renders through the site's card and row switches.
node:
  uri: metro.subcomponent.stock_list
  edges:
    - node:
        uri: prism.component.entity_list
        edges:
          - node:
              uri: metro.component.metro_card_projection
            relation: { cardinality: "0..*", slotName: card }
          - node:
              uri: metro.component.metro_row_projection
            relation: { cardinality: "0..*", slotName: row }
      relation: { cardinality: "1", slotName: list }
