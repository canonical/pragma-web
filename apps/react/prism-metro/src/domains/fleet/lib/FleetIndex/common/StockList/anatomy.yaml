---
# StockList — the fleet index's list, a subcomponent of FleetIndex: every
# rolling stock through the shared list of nodes. As a table, the default,
# each stock is a row of the facts its lens displays, sortable by their
# headers; as cards, each stock's card draws its formations at one scale in
# its specimen through the site's card arm. The renderer, the sort and the
# selected stock are the address's `as`, `sort` and `select` parameters.
#
# It renders no element of its own and binds no styles: NodeList is the
# root, and each stock renders through the site's card and row switches.
node:
  uri: metro.subcomponent.stock_list
  edges:
    - node:
        uri: prism.component.node_list
        edges:
          - node:
              uri: metro.component.metro_card_projection
            relation: { cardinality: "0..*", slotName: card }
          - node:
              uri: metro.component.metro_row_projection
            relation: { cardinality: "0..*", slotName: row }
      relation: { cardinality: "1", slotName: list }
