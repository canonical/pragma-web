---
# CarTypeCard: a car type as a card: its mark, its prefix off the page's
# namespace, its name linked to its home, its definition, and its code,
# whether it has a driving cab, its length and its capacity as facts. It has
# no depiction, so it draws no specimen. It states no address and no kind:
# the peek's line carries the address, and its mark says the type. Its mark
# is the car type's glyph, a published icon.
node:
  uri: metro.component.car_type_card
  projection:
    on: CarType
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The car type's glyph, a published Icon (CAR_TYPE_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: code
                    projection:
                      field: code
                  relation:
                    cardinality: "1"
                - node:
                    role: cab
                    # Yes or no, through the catalogue.
                    projection:
                      field: hasCab
                  relation:
                    cardinality: "1"
                - node:
                    role: length
                    projection:
                      field: length
                  relation:
                    cardinality: "1"
                - node:
                    role: capacity
                    projection:
                      field: capacity
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "0..1"
              slotName: facts
      relation:
        cardinality: "1"
