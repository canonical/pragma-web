# CarTypeCard: a car type on the generic entity card, filling location, identifier, kind, key values, vitals and preview.
# A car type has no location and no preview; the vital is its length.
# It adds no styles: the generic component owns them.
node:
  uri: metro.fleet.car-type-card
  projection:
    on: CarType
  edges:
    - node:
        uri: prism.projections.entity-card
      relation:
        cardinality: "1"
        slotName: default
    - node:
        role: title
        projection:
          field: _meta.title
      relation:
        cardinality: "1"
        slotName: title
    - node:
        role: identifier
        projection:
          field: _meta.curie
      relation:
        cardinality: "1"
        slotName: identifier
    - node:
        role: kind
        projection:
          field: _meta.type._meta.title
      relation:
        cardinality: "1"
        slotName: kind
    - node:
        role: code
        projection:
          field: code
      relation:
        cardinality: "1"
        slotName: keyValues
    - node:
        role: cab
        projection:
          field: hasCab
      relation:
        cardinality: "1"
        slotName: keyValues
    - node:
        role: length
        projection:
          field: length
      relation:
        cardinality: "1"
        slotName: keyValues
    - node:
        role: capacity
        projection:
          field: capacity
      relation:
        cardinality: "1"
        slotName: keyValues
    - node:
        role: length
        projection:
          field: length
      relation:
        cardinality: "1"
        slotName: meta
