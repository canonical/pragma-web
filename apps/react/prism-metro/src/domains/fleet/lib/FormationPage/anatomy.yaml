---
# FormationPage — the fleet lens's page of one formation, laid on the
# sectioned view (SectionedView): its title and its stock's chip in the
# header, its facts in the view's facts block, then its sections: its side
# view with a tick at each line's shortest platform, its units in order,
# each named by its chip, then its fit at the platforms of every line it
# runs on, each line named by its chip. While the page's data is on its
# way it says so in one muted line; a failed read says so as an alert; an
# address naming nothing of its type says that nothing lives there. The
# root is a subgrid of the canvas's page grid over every column; the
# header, a section's content and each line take every column they are
# given.
#
# Token ledger: space.100 (8px) between the words of an entry, an inline
# run, one baseline pair.
node:
  uri: metro.component.formation_page
  styles:
    layout.grid.column: "1 / -1"
    layout.type: grid
    layout.grid.columns: subgrid
    spacing.gap: grid.gutter
    layout.alignSelf: start
  edges:
    - node:
        uri: prism.component.sectioned_view
      relation: { cardinality: "0..1", slotName: default }
    - node:
        role: masthead, the view's header holding the page title
        styles:
          layout.grid.column: "1 / -1"
          layout.type: grid
          spacing.gap: grid.gutter
      relation: { cardinality: "0..1", slotName: masthead }
    - node:
        uri: metro.component.formation_side_view
        styles:
          layout.grid.column: "1 / -1"
      relation: { cardinality: "0..1", slotName: side-view }
    - node:
        uri: metro.component.platform_fit
        styles:
          layout.grid.column: "1 / -1"
      relation: { cardinality: "0..1", slotName: fit }
    - node:
        role: list of entries
        styles:
          layout.grid.column: "1 / -1"
          layout.type: grid
          spacing.gap: grid.gutter
          spacing.internal.inline.start: 0
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          layout.listStyle: none
      relation: { cardinality: "0..1", slotName: list }
    - node:
        role: entry, a node's chip and its vitals
        styles:
          layout.type: flex
          layout.wrap: wrap
          layout.align: baseline
          spacing.gap: space.100
      relation: { cardinality: "0..*", slotName: entry }
    - node:
        role: vital
        styles:
          typography.color: color.text.muted
      relation: { cardinality: "0..*", slotName: vital }
    - node:
        role: loading line
        styles:
          layout.grid.column: "1 / -1"
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: loading }
    - node:
        role: not-found line
        styles:
          layout.grid.column: "1 / -1"
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: not-found }
    - node:
        role: error alert
        styles:
          layout.grid.column: "1 / -1"
          typography.color: color.text.error
      relation: { cardinality: "0..1", slotName: error }
