---
# FormationDetail — a formation's page once its data is in the store, a
# subcomponent of FormationPage, laid on the sectioned view: its title and
# its stock's chip in the header, its facts, then its sections: its side
# view with a tick at each line's shortest platform, its units in order,
# each named by its chip with its length and whether it runs reversed,
# then its fit at the platforms of every line it runs on, each line named
# by its chip. Under a renderer other than the page (Turtle) the view gets
# no section and what the renderer draws as its body. An address naming
# no formation says nothing lives there.
#
# It renders no element of its own and binds no styles: the view lays the
# page out, and the page's stylesheet styles each part by its slot.
node:
  uri: metro.subcomponent.formation_detail
  edges:
    - node:
        uri: prism.component.sectioned_view
        edges:
          - node:
              role: masthead, holding the page title
              edges:
                - node: { role: page title }
                  relation: { cardinality: "1", slotName: title }
                - node:
                    role: entry, the stock's chip
                    edges:
                      - node: { uri: metro.component.metro_chip_projection }
                        relation: { cardinality: "1", slotName: chip }
                  relation: { cardinality: "1", slotName: entry }
            relation: { cardinality: "1", slotName: header }
          - node:
              role: facts (the node's facts, when it records any)
              edges:
                - node:
                    uri: prism.component.key_value_list
                  relation: { cardinality: "1" }
            relation: { cardinality: "0..1", slotName: facts }
          - node:
              role: body (under a renderer other than the page, what it draws)
            relation: { cardinality: "0..1", slotName: body }
          - node:
              role: sections (under the page renderer, in reading order)
              edges:
                - node: { uri: metro.component.formation_side_view }
                  relation: { cardinality: "1", slotName: side-view }
                - node:
                    role: list of entries
                    edges:
                      - node:
                          role: entry
                          edges:
                            - node: { uri: metro.component.metro_chip_projection }
                              relation: { cardinality: "1", slotName: chip }
                            - node: { role: vital }
                              relation: { cardinality: "2..3", slotName: vital }
                        relation: { cardinality: "1..*", slotName: entry }
                  relation: { cardinality: "1", slotName: list }
                - node:
                    uri: metro.component.platform_fit
                    edges:
                      - node: { uri: metro.component.metro_chip_projection }
                        relation: { cardinality: "0..*", slotName: line-name }
                  relation: { cardinality: "1", slotName: fit }
            relation: { cardinality: "1", slotName: sections }
      relation: { cardinality: "0..1" }
    - node: { role: not-found line }
      relation: { cardinality: "0..1", slotName: not-found }
