# FormationSideView: a server-rendered side view of one train, against a
# scale it may share with the trains drawn beside it. Each car is drawn to
# its length, with a slanted nose at each cab end the car's orientation
# puts it and a gap at each coupling; optional platform marks drop a tick
# at each line's shortest platform and underline the part of the train
# that overhangs it. The ordered list after the drawing carries the same
# content as text. Bespoke: no published component draws to scale.
#
# The drawing paints with currentColor, set in the markup as the SVG's
# fill and stroke, since no style key binds SVG paint: each painted group's
# colour is its typography.color.
node:
  uri: metro.fleet.formation-side-view
  styles:
    layout.type: grid
    spacing.gap: container.gap.tight
  edges:
    - node:
        role: drawing
        styles:
          layout.type: block
          size.max.width: 100%
        edges:
          - node:
              role: train
              styles:
                typography.color: color.text
              edges:
                - node:
                    role: car body
                  relation:
                    cardinality: "1..*"
            relation:
              cardinality: "1"
          - node:
              role: platform mark
              styles:
                typography.color: color.text.muted
            relation:
              cardinality: "0..*"
          - node:
              role: overhang
              styles:
                typography.color: color.text.error
            relation:
              cardinality: "0..*"
      relation:
        cardinality: "1"
    - node:
        role: train text
        styles:
          layout.type: grid
          spacing.gap: container.gap.tight
          spacing.internal.inline.start: 0
          layout.listStyle: none
        edges:
          - node:
              role: unit entry
              styles:
                layout.type: flex
                layout.wrap: wrap
                spacing.gap.inline: container.gap.tight
                typography.color: color.text.muted
              edges:
                - node:
                    role: car code
                    styles:
                      typography.fontFamily: monospace
                      typography.color: color.text
                  relation:
                    cardinality: "1..*"
            relation:
              cardinality: "1..*"
      relation:
        cardinality: "1"
