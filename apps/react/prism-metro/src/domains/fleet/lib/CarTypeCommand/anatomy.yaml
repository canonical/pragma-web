# CarTypeCommand: a car type on the generic entity command, filling "title kind in location" left, one vital right, in a 56px row.
# It adds no styles: the generic component owns them.
node:
  uri: metro.fleet.car-type-command
  projection:
    on: CarType
  edges:
    - node:
        uri: prism.projections.entity-command
      relation:
        cardinality: "1"
        slotName: default
    - node:
        role: title
        projection:
          field: _meta.title
      relation:
        cardinality: "1"
        slotName: title
    - node:
        role: kind
        projection:
          field: _meta.type._meta.title
      relation:
        cardinality: "1"
        slotName: kind
    - node:
        role: length
        projection:
          field: length
      relation:
        cardinality: "1"
        slotName: meta
