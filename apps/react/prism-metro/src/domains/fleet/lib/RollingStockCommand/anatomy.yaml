# RollingStockCommand: a rolling stock on the generic entity command, filling "title kind in location" left, one vital right, in a 56px row.
# It adds no styles: the generic component owns them.
node:
  uri: metro.fleet.rolling-stock-command
  projection:
    on: RollingStock
  edges:
    - node:
        uri: prism.projections.entity-command
      relation:
        cardinality: "1"
        slotName: default
    - node:
        role: title
        projection:
          field: _meta.title
      relation:
        cardinality: "1"
        slotName: title
    - node:
        role: kind
        projection:
          field: _meta.type._meta.title
      relation:
        cardinality: "1"
        slotName: kind
    - node:
        role: line title
        projection:
          field: _meta.title
      relation:
        cardinality: "0..*"
        slotName: location
        projection:
          field: formations.lines
    - node:
        role: formation count
        projection:
          field: uri
      relation:
        cardinality: "1..*"
        slotName: meta
        projection:
          field: formations
