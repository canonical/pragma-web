---
# RollingStockCard: a rolling stock as a card: its mark, its prefix off the
# page's namespace, its name linked to its home, its definition, and the count
# of its formations with the ranges of their lengths and capacities as facts;
# its formations drawn at one scale in the specimen, for a stock that runs in
# at least one. It states no address and no kind: the peek's line carries the
# address, and its mark says the type. Its mark is the rolling stock's glyph,
# a published icon.
node:
  uri: metro.component.rolling_stock_card
  projection:
    on: RollingStock
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The rolling stock's glyph, a published Icon (ROLLING_STOCK_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: formations
                    # How many formations the stock runs in.
                    projection:
                      field: uri
                  relation:
                    cardinality: "1"
                    projection:
                      field: formations
                - node:
                    role: length
                    # The range of their lengths.
                    projection:
                      field: length
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: formations
                - node:
                    role: capacity
                    # The range of their capacities.
                    projection:
                      field: capacity
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: formations
            relation:
              cardinality: "0..1"
              slotName: facts
          - node:
              uri: prism.component.entity_card.specimen
              edges:
                - node:
                    uri: metro.component.formation_stack
                    edges:
                      - node:
                          role: formation
                          projection:
                            field: uri
                        relation:
                          cardinality: "1"
                      - node:
                          role: caption
                          projection:
                            field: _meta.title
                        relation:
                          cardinality: "1"
                      - node:
                          role: caption length
                          projection:
                            field: length
                        relation:
                          cardinality: "1"
                  relation:
                    cardinality: "1"
            relation:
              # The stock's formations drawn at one scale (kind drawing), for a
              # stock that runs in at least one.
              cardinality: "0..1"
              slotName: specimen
              projection:
                field: formations
      relation:
        cardinality: "1"
