---
# StockPage — the fleet lens's page of one rolling stock, in the document
# archetype's canvas, beside its facts in the aside: its title, then
# its formations drawn at one scale, each captioned by its chip and its
# length, then the car types its units are made of, as rows. Sections sit
# a loose step apart, more than the gutter between the items inside them.
# A stock with no formation says so in one muted line, and has no car
# types. While the page's data is on its way it says so in one muted line;
# a failed read says so as an alert; an address naming nothing of its type
# says that nothing lives there.
#
# Token ledger: container.gap.loose between sections, an item's external
# spacing, never a gap.
node:
  uri: metro.component.stock_page
  styles:
    layout.grid.column: "1 / -1"
    layout.type: grid
    spacing.gap: grid.gutter
    layout.alignSelf: start
  edges:
    - node:
        role: page title
      relation: { cardinality: "0..1", slotName: title }
    - node:
        role: section
        styles:
          spacing.external.block.start: container.gap.loose
          layout.type: grid
          spacing.gap: grid.gutter
      relation: { cardinality: "0..*", slotName: section }
    - node:
        uri: metro.component.formation_stack
      relation: { cardinality: "0..1", slotName: formations }
    - node:
        role: no formation runs the stock
        styles:
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: empty }
    - node:
        role: list of rows
        styles:
          spacing.internal.inline.start: 0
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          layout.listStyle: none
      relation: { cardinality: "0..1", slotName: rows }
    - node:
        role: a formation's length, after its chip in its caption
        styles:
          typography.color: color.text.muted
      relation: { cardinality: "0..*", slotName: vital }
    - node:
        role: loading line
        styles:
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: loading }
    - node:
        role: not-found line
        styles:
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: not-found }
    - node:
        role: error alert
        styles:
          typography.color: color.text.error
      relation: { cardinality: "0..1", slotName: error }
