---
# StockDetail — a rolling stock's page once its data is in the store, a
# subcomponent of StockPage, laid on the sectioned view: its title in the
# header, its facts, then its sections: its formations, each named by its
# chip with its length and drawn at one scale with the others, then the
# car types its units are made of, each once, as its row. Under a renderer
# other than the page (Turtle) the view gets no section and what the
# renderer draws as its body. An address naming no rolling stock says
# nothing lives there.
#
# It renders no element of its own and binds no styles: the view lays the
# page out, and the page's stylesheet styles each part by its slot.
node:
  uri: metro.subcomponent.stock_detail
  edges:
    - node:
        uri: prism.component.sectioned_view
        edges:
          - node:
              role: masthead, holding the page title
              edges:
                - node: { role: page title }
                  relation: { cardinality: "1", slotName: title }
            relation: { cardinality: "1", slotName: header }
          - node:
              role: facts (the node's facts, when it records any)
              edges:
                - node:
                    uri: prism.component.key_value_list
                  relation: { cardinality: "1" }
            relation: { cardinality: "0..1", slotName: facts }
          - node:
              role: body (under a renderer other than the page, what it draws)
            relation: { cardinality: "0..1", slotName: body }
          - node:
              role: sections (under the page renderer, in reading order)
              edges:
                - node:
                    uri: metro.component.formation_stack
                    edges:
                      - node: { uri: metro.component.metro_chip_projection }
                        relation: { cardinality: "1..*", slotName: chip }
                      - node: { role: vital }
                        relation: { cardinality: "1..*", slotName: vital }
                  relation: { cardinality: "0..1", slotName: formations }
                - node: { role: no formation runs the stock }
                  relation: { cardinality: "0..1", slotName: empty }
                - node:
                    role: list of rows
                    edges:
                      - node: { uri: metro.component.metro_row_projection }
                        relation: { cardinality: "1..*", slotName: row }
                  relation: { cardinality: "0..1", slotName: rows }
            relation: { cardinality: "1", slotName: sections }
      relation: { cardinality: "0..1" }
    - node: { role: not-found line }
      relation: { cardinality: "0..1", slotName: not-found }
