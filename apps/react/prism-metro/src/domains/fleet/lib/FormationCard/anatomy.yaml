---
# FormationCard: a formation as a card: its mark, its prefix off the page's
# namespace, its name linked to its home, its definition, and its stock, its
# length, its capacity, its units, its cars and the lines it runs on as facts,
# the lines only when it runs on one; its side view in the specimen. It states
# no address and no kind: the peek's line carries the address, and its mark
# says the type. Its mark is the formation's glyph, a published icon.
node:
  uri: metro.component.formation_card
  projection:
    on: Formation
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The formation's glyph, a published Icon (FORMATION_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: stock
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "1"
                    projection:
                      field: stock
                - node:
                    role: length
                    projection:
                      field: length
                  relation:
                    cardinality: "1"
                - node:
                    role: capacity
                    projection:
                      field: capacity
                  relation:
                    cardinality: "1"
                - node:
                    role: units
                    # How many units the formation is made of.
                    projection:
                      field: units.position
                  relation:
                    cardinality: "1"
                - node:
                    role: cars
                    # How many cars its units hold.
                    projection:
                      field: units.position
                  relation:
                    cardinality: "1"
                - node:
                    role: lines
                    # Every line it runs on, joined into one value.
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..*"
                    projection:
                      field: lines
            relation:
              cardinality: "0..1"
              slotName: facts
          - node:
              uri: prism.component.entity_card.specimen
              edges:
                - node:
                    uri: metro.component.formation_side_view
                  relation:
                    cardinality: "1"
            relation:
              # The formation's side view (kind drawing).
              cardinality: "1"
              slotName: specimen
      relation:
        cardinality: "1"
