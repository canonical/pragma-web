# FormationCard: a formation on the generic entity card, filling location, identifier, kind, key values, vitals and preview.
# Location is its stock; the vital counts its cars; the preview is its side view.
# It adds no styles: the generic component owns them.
node:
  uri: metro.fleet.formation-card
  projection:
    on: Formation
  edges:
    - node:
        uri: prism.projections.entity-card
      relation:
        cardinality: "1"
        slotName: default
    - node:
        role: title
        projection:
          field: _meta.title
      relation:
        cardinality: "1"
        slotName: title
    - node:
        role: identifier
        projection:
          field: _meta.curie
      relation:
        cardinality: "1"
        slotName: identifier
    - node:
        role: kind
        projection:
          field: _meta.type._meta.title
      relation:
        cardinality: "1"
        slotName: kind
    - node:
        role: stock title
        projection:
          field: _meta.title
      relation:
        cardinality: "1"
        slotName: location
        projection:
          field: stock
    - node:
        role: length
        projection:
          field: length
      relation:
        cardinality: "1"
        slotName: keyValues
    - node:
        role: capacity
        projection:
          field: capacity
      relation:
        cardinality: "1"
        slotName: keyValues
    - node:
        role: unit
        projection:
          field: position
      relation:
        cardinality: "1..*"
        slotName: keyValues
        projection:
          field: units
    - node:
        role: line title
        projection:
          field: _meta.title
      relation:
        cardinality: "0..*"
        slotName: keyValues
        projection:
          field: lines
    - node:
        role: car count
        projection:
          field: position
      relation:
        cardinality: "1..*"
        slotName: meta
        projection:
          field: units.unit.cars
    - node:
        uri: metro.fleet.formation-side-view
      relation:
        cardinality: "1..*"
        slotName: preview
        projection:
          field: units
