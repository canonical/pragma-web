---
# FormationCard: a formation as a card in a grid of entities.
# Best guess, with no Figma frame for the fleet: its stock as the
# location above the title, its class as the kind, its definition as the
# summary; its length, its capacity, how many units it has and the lines
# run with it as key values; its car count as the footer's vital; and its
# side view in the sidecar.
# Projected onto EntityCard, which carries every style: this anatomy binds
# none. The home is the link the title renders through, resolved from the
# compact address.
node:
  uri: metro.component.formation_card
  projection: { on: Formation }
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: location
              projection: { field: _meta.title }
            relation: { cardinality: "1", slotName: location, projection: { field: stock } }
          - node:
              role: title
              projection: { field: _meta.title }
              edges:
                - node: { role: home, projection: { field: _meta.curie } }
                  relation: { cardinality: "0..1" }
            relation: { cardinality: "1", slotName: title }
          - node:
              role: kind
              projection: { field: _meta.title }
            relation: { cardinality: "1", slotName: kind, projection: { field: _meta.type } }
          - node:
              role: summary
              projection: { field: _meta.definition }
            relation: { cardinality: "0..1", slotName: summary }
          - node:
              role: key values
              edges:
                - node: { role: length, projection: { field: length } }
                  relation: { cardinality: "1" }
                - node: { role: capacity, projection: { field: capacity } }
                  relation: { cardinality: "1" }
                - node: { role: units, projection: { field: position } }
                  relation: { cardinality: "1..*", projection: { field: units } }
                - node: { role: lines, projection: { field: _meta.title } }
                  relation: { cardinality: "0..*", projection: { field: lines } }
            relation: { cardinality: "1", slotName: key-values }
          - node:
              role: vital
            relation: { cardinality: "1", slotName: footer }
          - node:
              uri: metro.component.formation_side_view
            relation: { cardinality: "1", slotName: sidecar }
      relation: { cardinality: "1" }
