# UnitCard: a unit on the generic entity card, filling location, identifier, kind, key values, vitals and preview.
# The schema gives a unit no inverse, so it has no location; the vital counts its cars; the preview is its side view as a one-unit train.
# It adds no styles: the generic component owns them.
node:
  uri: metro.fleet.unit-card
  projection:
    on: Unit
  edges:
    - node:
        uri: prism.projections.entity-card
      relation:
        cardinality: "1"
        slotName: default
    - node:
        role: title
        projection:
          field: _meta.title
      relation:
        cardinality: "1"
        slotName: title
    - node:
        role: identifier
        projection:
          field: _meta.curie
      relation:
        cardinality: "1"
        slotName: identifier
    - node:
        role: kind
        projection:
          field: _meta.type._meta.title
      relation:
        cardinality: "1"
        slotName: kind
    - node:
        role: length
        projection:
          field: length
      relation:
        cardinality: "1"
        slotName: keyValues
    - node:
        role: capacity
        projection:
          field: capacity
      relation:
        cardinality: "1"
        slotName: keyValues
    - node:
        role: car count
        projection:
          field: position
      relation:
        cardinality: "1..*"
        slotName: meta
        projection:
          field: cars
    - node:
        uri: metro.fleet.formation-side-view
      relation:
        cardinality: "1..*"
        slotName: preview
        projection:
          field: cars
