---
# UnitCard: a unit as a card: its mark, its prefix off the page's
# namespace, its name linked to its home, its definition, and its length, its
# capacity and its cars as facts; its side view in a drawing specimen. It
# states no address and no kind: the peek's line carries the address, and its
# mark says the type. Its mark is the unit's glyph, a published icon.
node:
  uri: metro.component.unit_card
  projection:
    on: Unit
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The unit's glyph, a published Icon (UNIT_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: _meta.definition
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: length
                    projection:
                      field: length
                  relation:
                    cardinality: "1"
                - node:
                    role: capacity
                    projection:
                      field: capacity
                  relation:
                    cardinality: "1"
                - node:
                    role: cars
                    # How many cars the unit couples.
                    projection:
                      field: cars.position
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "0..1"
              slotName: facts
          - node:
              uri: prism.component.entity_card.specimen
              edges:
                - node:
                    uri: metro.component.formation_side_view
                  relation:
                    cardinality: "1"
            relation:
              # The unit's side view (kind drawing).
              cardinality: "1"
              slotName: specimen
      relation:
        cardinality: "1"
