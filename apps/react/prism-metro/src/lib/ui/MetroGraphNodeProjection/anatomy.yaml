---
# MetroGraphNodeProjection: any graph node of the metro site as a node of a graph,
# dispatched on its type.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, canvas 449:22295 (the projection
# matrix: one EntityGraphNode per type, each type filling the slots it has).
# It renders no element of its own: the case its node's type selects
# renders the root. A metro type reads through the site's own arm; an
# ontology class through the package's class arm; any other node through
# the package's Node arm. The cases are the site composite's
# aliased arms, by the same names (METRO_GRAPH_NODE_TYPES).
node:
  uri: metro.component.metro_graph_node_projection
  projection:
    on: Node
  edges:
    - switch:
        on: internal
        cases:
          - node:
              uri: metro.component.station_graph_node
              projection:
                on: Station
          - node:
              uri: metro.component.interchange_graph_node
              projection:
                on: Interchange
          - node:
              uri: metro.component.line_graph_node
              projection:
                on: Line
          - node:
              uri: metro.component.zone_graph_node
              projection:
                on: Zone
          - node:
              uri: metro.component.rolling_stock_graph_node
              projection:
                on: RollingStock
          - node:
              uri: metro.component.formation_graph_node
              projection:
                on: Formation
          - node:
              uri: metro.component.unit_graph_node
              projection:
                on: Unit
          - node:
              uri: metro.component.car_type_graph_node
              projection:
                on: CarType
          - node:
              uri: prism.component.ontology_class_graph_node
              projection:
                on: OntologyClass
          - node:
              uri: prism.component.node_graph_node
              projection:
                on: Node
      relation:
        cardinality: "1"
