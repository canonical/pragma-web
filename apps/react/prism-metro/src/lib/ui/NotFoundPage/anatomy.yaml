---
# NotFoundPage — the page every URL no route matches renders, in the
# document archetype's canvas: its title (also the document's), then
# core's not-found body (one sentence, then each lens's home as a link),
# one gutter apart as on the docs site. It spans every column of the
# canvas's page grid; the heading takes the typography's own styles. The
# not-found route renders it under an empty strip, so its title sits at
# the canvas's top like any other page's.
#
# Every decision is read through a component token declared on the root
# (`--not-found-page-*`), bound to the symbol named here.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: metro.component.not_found_page
  styles:
    layout.grid.column: "1 / -1"
    layout.type: flex
    layout.direction: column
    spacing.gap: grid.gutter
  edges:
    - node:
        role: page title
      relation: { cardinality: "1", slotName: title }
    - node:
        uri: prism.component.not_found_body
      relation: { cardinality: "1", slotName: body }
