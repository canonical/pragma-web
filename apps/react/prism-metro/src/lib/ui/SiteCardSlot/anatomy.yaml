---
# SiteCardSlot: the site's card switch as the package's card switch
# reaches it, through the site slot the package's composite spreads. It
# renders no element of its own: it hands the node to MetroCardProjection,
# whose case renders the root.
node:
  uri: metro.component.site_card_slot
  projection: { on: Node }
  edges:
    - node: { uri: metro.component.metro_card_projection, projection: { on: Node } }
      relation: { cardinality: "1" }
