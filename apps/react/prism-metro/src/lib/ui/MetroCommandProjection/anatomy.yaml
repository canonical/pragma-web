---
# MetroCommandProjection: any graph node of the metro site as the command-palette entry,
# dispatched on its type.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, canvas 449:22295 (the projection
# matrix: one EntityCommand per type, each type filling the slots it has).
# It renders no element of its own: the case its node's type selects
# renders the root. A metro type reads through the site's own arm; an
# ontology class through the package's class arm; any other node through
# the package's Node arm. The cases are the site composite's
# aliased arms, by the same names (METRO_COMMAND_TYPES).
node:
  uri: metro.component.metro_command_projection
  projection:
    on: Node
  edges:
    - switch:
        on: internal
        cases:
          - node:
              uri: metro.component.station_command
              projection:
                on: Station
          - node:
              uri: metro.component.interchange_command
              projection:
                on: Interchange
          - node:
              uri: metro.component.line_command
              projection:
                on: Line
          - node:
              uri: metro.component.zone_command
              projection:
                on: Zone
          - node:
              uri: metro.component.rolling_stock_command
              projection:
                on: RollingStock
          - node:
              uri: metro.component.formation_command
              projection:
                on: Formation
          - node:
              uri: metro.component.unit_command
              projection:
                on: Unit
          - node:
              uri: metro.component.car_type_command
              projection:
                on: CarType
          - node:
              uri: prism.component.ontology_class_command
              projection:
                on: OntologyClass
          - node:
              uri: prism.component.node_command
              projection:
                on: Node
      relation:
        cardinality: "1"
