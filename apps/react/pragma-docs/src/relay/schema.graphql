  """
  Interaction state this style value applies in. Absent
      means the default state. Closed vocabulary (hover, active, focus,
      disabled, selected, expanded, indeterminate, invalid), governed by
      registry — 'active' subsumes Material's 'pressed' and Spectrum's 'down';
      'focus' maps to CSS :focus-visible (Spectrum's 'key-focus'); 'expanded'
      is a disclosure's open state ([open], aria-expanded); 'indeterminate' is
      a mixed checkbox or progress bar; 'invalid' is a failed validation
      (:invalid, aria-invalid). States re-value style channels only: they never
      add structure (that is the Switch construct) and never define transitions
      or interaction logic (state machines stay out of scope). Authored as an
      @state suffix on the style key.
  """
  styleState: String

  """Platform-agnostic style property identifier."""
  styleKey: String
}

"""
