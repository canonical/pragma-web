"""
Directs the executor to defer this fragment when the `if` argument is true or undefined.
"""
directive @defer(
  """Deferred when true or undefined."""
  if: Boolean! = true

  """Unique name"""
  label: String
) on FRAGMENT_SPREAD | INLINE_FRAGMENT

"""
Directs the executor to stream plural fields when the `if` argument is true or undefined.
"""
directive @stream(
  """Number of items to return immediately"""
  initialCount: Int! = 0

  """Stream when true or undefined."""
  if: Boolean! = true

  """Unique name"""
  label: String
) on FIELD

"""
One symbol a UIBlock consumes, at one node of one tree, for one style key, in one interaction state, at one rank of the fallback order. A record is a blank node in the block's own per-instance file; its identity is the six-tuple (block, viaBlock, node, styleKey, styleState, rank) and ds:consumesSymbol is functionally determined by it.
"""
type TokenBinding {
  """Self-describing TBox access for this entity."""
  _meta: EntityMeta!

  """
  The tree the binding was reached through: the record's own block for an own-tree binding, the referenced block for an inherited one. Equal to the subject in the own-tree case, so an inherited binding is FILTER(?viaBlock != ?block) with no special case.
  """
  viaBlocks(first: Int, after: String, last: Int, before: String): UIBlockConnection!

  """
  The dt:TokenSymbol this record consumes: the rank-th member of the style tuple's anatomy:consumes list. Exactly one per record, and determined by the record's six-tuple identity.
  """
  consumesSymbol: String

  """
  The symbol's 1-based position in the style tuple's fallback order; 1 is the primary. A value's terminal primitive is not a symbol and carries no record, so ranks count symbols only.
  """
  rank: Int

  """
  The node's TREE PATH in the viaBlock's tree, not its role: "$root", then one step per edge descended, joined by "/". A node edge's step is the child's uri, or its role where it has no uri; a switch edge's step is case[<name>]; a step whose name recurs among its siblings carries a 1-based ordinal in brackets.
  """
  node: String
}

type UIBlockConnection {
  edges: [UIBlockEdge!]!
  pageInfo: PageInfo!
}

type UIBlockEdge {
  node: UIBlock!
  cursor: String!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

