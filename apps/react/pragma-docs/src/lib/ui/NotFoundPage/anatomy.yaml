---
# NotFoundPage — the page every URL no route matches renders, in the
# document archetype's canvas: its title (also the document's) and one line
# of copy. It spans every column of the canvas's page grid; the heading and
# the line take the typography's own styles. The not-found route renders no
# strip, so the canvas starts at the viewport's top: the page carries one
# gutter of external spacing above it, so its title sits one gutter under
# the viewport's top as a page under a strip sits one gutter under the
# strip's rule.
#
# Every decision is read through a component token declared on the root
# (`--not-found-page-*`), bound to the symbol named here.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: docs.component.not_found_page
  styles:
    layout.grid.column: "1 / -1"
    spacing.external.block.start: grid.gutter
  edges:
    - node:
        role: page title
      relation: { cardinality: "1", slotName: title }
    - node:
        role: page copy
      relation: { cardinality: "1", slotName: body }
