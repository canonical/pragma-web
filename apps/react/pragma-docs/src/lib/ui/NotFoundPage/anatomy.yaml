---
# NotFoundPage — the page every URL no route matches renders: the prose
# page with the catalog's title, which is also the document's, then core's
# not-found body (one sentence, then each lens's home as a link). The
# not-found route renders it under an empty strip, so its title sits at
# the canvas's top like any other page's. Its root is the prose page's,
# and it binds no styles of its own.
node:
  uri: docs.component.not_found_page
  edges:
    - node:
        uri: docs.component.prose_page
        edges:
          - node:
              role: title
            relation: { cardinality: "1", slotName: heading }
          - node:
              uri: prism.component.not_found_body
            relation: { cardinality: "1", slotName: prose }
      relation: { cardinality: "1" }
