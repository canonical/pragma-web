---
# ProsePage — a page of prose in the document archetype's canvas: its title,
# the page's level-1 heading, over its text. The sign-in, account, guides
# and not-found pages are this page with their own words.
#
# The page uses the whole main column: the root is a subgrid of the
# canvas's page grid over every column, its gap the grid's gutter on both
# axes; it packs at the top and ends one loose step above the canvas's end.
# The heading spans the column. The text holds a reading measure of six
# intrinsic columns from the column's first line, flush left (a narrower
# main column clamps the span), and carries `.editorial` and
# `.content-flow`, so the typography layer gives its blocks their space
# after and the last block none.
#
# Bespoke: the design system's Section is work in progress, not published,
# and no published component is a page.
#
# Every decision is read through a component token declared on the root
# (`--prose-page-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1", "1 / span 6": structure, spans in columns.
#   layout.alignSelf start: a layout keyword. The heading's 0 resets.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# container.gap.loose.
node:
  uri: docs.component.prose_page
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    layout.alignSelf: start
    spacing.gap: grid.gutter
    spacing.internal.block.end: container.gap.loose
  edges:
    - node:
        role: heading (the page's level-1 heading)
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
      relation: { cardinality: "1", slotName: heading }
    - node:
        role: prose (the page's text, carrying .editorial and .content-flow)
        styles:
          layout.grid.column: "1 / span 6"
      relation: { cardinality: "1", slotName: prose }
