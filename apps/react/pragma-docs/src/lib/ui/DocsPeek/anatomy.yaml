---
# DocsPeek: what a chip's peek shows on this site, the peek the Shell's
# provider gives every chip arm. It runs DocsPeekQuery,
# `node(id: $id)` with the node's absolute IRI (Node.uri; node(id:)
# accepts no CURIE), reading the node's compact address and handing the
# node to the site's card switch, DocsCardProjection, inside a Suspense
# boundary, so a design-system type peeks at its own card. It renders the
# card, then the address line under it (PS1 V4's peek; heuristic 4.3: the
# full CURIE shows in the peek, copyable there, "Copied" announced): the
# CURIE in monospace, muted, and core's CopyButton. The chip's peek is the
# frame (the popover's padding and border), so the card draws no border of
# its own inside it.
#
# The query is lazy: the chip mounts the peek only while it is open, so a
# chip's fragment never spreads a card's (no fragment cycle, no card read
# on the server for a mention). The node field reads its compact address;
# the card dispatcher's fragment reads the rest.
#
# Both the Suspense boundary and an ErrorBoundary (prism-core) have a null
# fallback: the peek shows nothing while loading, for a node the graph does
# not hold, and for a failed query, which stays inside the peek instead of
# replacing the page region the chip sits in; the chip's link is the way to
# the node in every case.
#
# The chip's peek dialog sizes and places it; it renders nothing at all
# (no element, no address line) while loading and when there is no node,
# so the chip's frame, which is not displayed while empty, shows no box.
#
# Token ledger (every decision; a literal only where no symbol exists):
#   --docs-peek-card-border-width: 0      the frame encloses the card
#   --docs-peek-address-spacing: space.100 (8px) above the line
#   --docs-peek-address-gap: grid.gutter between the CURIE and Copy
#   --docs-peek-curie-color: color.text.muted
#   --docs-peek-curie-font-family: ui-monospace, monospace   literal: no mono token
#   --docs-peek-curie-wrap: anywhere      keyword: a long CURIE breaks
node:
  uri: docs.component.docs_peek
  projection:
    on: Query
  edges:
    - node:
        uri: docs.component.docs_card_projection
        projection:
          on: Node
        styles:
          appearance.border.width: 0
      relation:
        cardinality: "1"
        slotName: card
    - node:
        role: address
        styles:
          layout.type: flex
          layout.wrap: wrap
          layout.align: baseline
          spacing.gap.inline: grid.gutter
          spacing.external.block.start: space.100
          spacing.external.block.end: 0
          spacing.internal.block.start: 0
          spacing.internal.block.end: 0
        edges:
          - node:
              role: curie
              projection:
                field: node._meta.curie
              styles:
                size.min.width: 0
                typography.color: color.text.muted
                typography.fontFamily: "ui-monospace, monospace"
                typography.wrap: anywhere
            relation: { cardinality: "1", slotName: curie }
          - node:
              uri: prism.component.copy_button
            relation: { cardinality: "1", slotName: copy }
      relation: { cardinality: "1", slotName: address }
