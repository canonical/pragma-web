---
# SiteGraphNodeSlot: the site's graph node switch as the package's graph node switch
# reaches it, through the site slot the package's composite spreads. It
# renders no element of its own: it hands the node to DocsGraphNodeProjection,
# whose case renders the root.
node:
  uri: docs.component.site_graph_node_slot
  projection: { on: Node }
  edges:
    - node: { uri: docs.component.docs_graph_node_projection, projection: { on: Node } }
      relation: { cardinality: "1" }
