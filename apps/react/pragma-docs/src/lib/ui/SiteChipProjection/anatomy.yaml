---
# SiteChipProjection: any graph node as the inline mention on this site,
# dispatched on its type.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, canvas 449:22295 (the projection
# matrix: one EntityChip per type, each type filling the slots it has).
# It renders no element of its own: the case its node's type selects
# renders the root. A design-system type reads through the site's own
# projection; every other type through the package's dispatcher, which
# takes ontology classes and any node from the site's provided maps. The
# cases are the site composite's aliased arms and the site map's arms, by
# the same names; the three UI-block types share one projection.
node:
  uri: docs.component.site_chip_projection
  projection:
    on: Node
  edges:
    - switch:
        on: internal
        cases:
          - node:
              uri: docs.component.ui_block_chip
              projection:
                on: Component
          - node:
              uri: docs.component.ui_block_chip
              projection:
                on: Pattern
          - node:
              uri: docs.component.ui_block_chip
              projection:
                on: Layout
          - node:
              uri: docs.component.modifier_chip
              projection:
                on: Modifier
          - node:
              uri: docs.component.modifier_family_chip
              projection:
                on: ModifierFamily
          - node:
              uri: docs.component.code_standard_chip
              projection:
                on: CodeStandard
          - node:
              uri: prism.component.chip_projection
              projection:
                on: Node
      relation:
        cardinality: "1"
