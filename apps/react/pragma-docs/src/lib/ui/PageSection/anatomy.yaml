---
# PageSection — one titled section of a document page: a level-2 heading
# over the section's content, both on the page's grid. The root is a
# subgrid of the page over every column, its gap the grid's gutter on both
# axes; the heading spans it and the content places itself. A section
# stands one loose step below what precedes it: external block space on
# the section, since every grid's only gap is the gutter.
#
# Bespoke: the design system's Section is work in progress, not published.
#
# Every decision is read through a component token declared on the root
# (`--page-section-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1": structure. The heading's 0 resets.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# container.gap.loose.
node:
  uri: docs.component.page_section
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
    spacing.external.block.start: container.gap.loose
  edges:
    - node:
        role: heading (the section's level-2 heading)
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
      relation: { cardinality: "1", slotName: heading }
    - node:
        role: content
      relation: { cardinality: "1..*", slotName: default }
