---
# GuidesIcon — the Guides lens's rail glyph: a page with two lines,
# stroked in currentColor on a 16-unit box, rendered `size` pixels square
# and hidden from assistive tech. It styles nothing.
node:
  uri: docs.component.guides_icon
  edges:
    - node:
        role: page
      relation: { cardinality: "1", slotName: page }
    - node:
        role: lines
      relation: { cardinality: "1", slotName: lines }
