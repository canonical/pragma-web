---
# JourneysPage — the content of both journeys routes: the lens's visually
# hidden heading over the explorer, inside the error and loading
# boundaries. A subgrid pass-through of the canvas's columns, one released
# row, so the explorer lands on the page's own lines and the chain canvas,
# page, explorer, reading releases its block claim.
#
# The heading is hidden from sight and kept for assistive technology and
# as the section's label: an empty box out of the flow that clips what it
# holds. The strip's trail is the visible title.
#
# Bespoke: a route's content is the lens's own.
#
# Every decision is read through a component token declared on the root
# (`--journeys-page-*`), bound to the symbol named here.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: docs.component.journeys_page
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    layout.grid.rows: "minmax(0, 1fr)"
    spacing.gap: grid.gutter
    size.block: 100%
    size.min.block: 0
  edges:
    - node:
        role: heading (visually hidden; the strip's trail is the visible title)
        styles:
          layout.position: absolute
          size.inline: 0
          size.block: 0
          layout.overflow: hidden
          typography.whiteSpace: nowrap
      relation: { cardinality: "1", slotName: heading }
    - node:
        role: loading or error line
      relation: { cardinality: "0..1" }
    - node:
        uri: docs.component.journeys_explorer
      relation: { cardinality: "0..1", slotName: default }
