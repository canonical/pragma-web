---
# JourneysExplorer — the journeys canvas: the explorer's rail on the
# canvas's first two columns and, on the rest, one reading of the demand
# model, the table of every job or the graph of the filtered journeys, as
# the strip's switch chooses (`data-view`). A subgrid of the canvas's
# columns whose one row fills the canvas; its gap is the grid's gutter.
# The rail scrolls on its own behind a hairline divider; the reading's
# cell releases its claim on the row, so the table scrolls inside its own
# region and the graph pans.
#
# Reflow, bound in styles.css:
#   @container shell (width < 448px)  below one group: the rail and the
#     reading stack in two equal rows, both on every column, and the rail
#     loses its divider.
#
# Bespoke: the explorer's regions are the lens's own.
#
# Every decision is read through a component token declared on the root
# (`--journeys-explorer-*`), bound to the symbol or the literal named here.
#
# Token ledger:
#   1px: the rail's divider.
#   layout.grid.column "1 / -1", "1 / span 2", "3 / -1",
#     layout.grid.rows "minmax(0, 1fr)": structure. The 0 resets.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: docs.component.journeys_explorer
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    layout.grid.rows: "minmax(0, 1fr)"
    spacing.gap: grid.gutter
    size.block: 100%
    size.min.block: 0
  edges:
    - node:
        uri: docs.component.journey_rail
        styles:
          layout.grid.column: "1 / span 2"
          layout.overflow.block: auto
          size.min.block: 0
          appearance.border.inline.end.color: color.border.muted
          appearance.border.width: 1px
          appearance.border.style: solid
      relation: { cardinality: "1", slotName: explorer-rail }
    - node:
        role: main (the reading's cell)
        styles:
          layout.grid.column: "3 / -1"
          layout.type: grid
          layout.grid.rows: "minmax(0, 1fr)"
          spacing.gap: grid.gutter
          size.min.block: 0
          size.min.width: 0
        edges:
          - switch:
              on: view
              cases:
                - uri: docs.component.journey_table
                - uri: docs.component.journey_well
            relation: { cardinality: "1" }
      relation: { cardinality: "1", slotName: main }
