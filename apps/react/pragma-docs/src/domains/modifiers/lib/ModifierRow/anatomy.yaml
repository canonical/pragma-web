---
# ModifierRow: a modifier as a 32px list entry, or a 56px two-line one where
# an index opts in: the slot order mark, prefix, title, summary, facts. The
# summary is the first paragraph of the modifier's summary, the second line
# of a two-line row; the one fact is the modifier's family.
# Its mark is the modifier's glyph, so it names no kind; the prefix shows
# only off the page's ambient namespace (the components lens declares ds). A
# modifier has no home yet and reads as inert text. Projected onto the base
# form, which carries every style.
node:
  uri: docs.component.modifier_row
  projection:
    on: Modifier
  edges:
    - node:
        uri: prism.component.entity_row
        edges:
          - node:
              role: mark
              # The modifier's glyph, a published Icon (MODIFIER_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: summary
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: modifierFamily
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: modifierFamily
            relation:
              cardinality: "0..1"
              slotName: facts
      relation:
        cardinality: "1"
