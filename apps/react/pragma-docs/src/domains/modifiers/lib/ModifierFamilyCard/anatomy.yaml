---
# ModifierFamilyCard: a modifier family as a card in a grid of entities: the
# slot order mark, prefix, title, summary, facts. The summary is the first
# paragraph of the family's Markdown summary; the one fact counts the
# family's modifiers. A family has no depiction, so the card draws no
# specimen, and a card carries no address (the peek's line does).
# Its mark is the modifier family's glyph, so it names no kind; the prefix
# shows only off the page's ambient namespace (the components lens declares
# ds). A family has no home yet and reads as inert text. Projected onto the
# base form, which carries every style.
node:
  uri: docs.component.modifier_family_card
  projection:
    on: ModifierFamily
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The modifier family's glyph, a published Icon (MODIFIER_FAMILY_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: summary
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: modifiers
                    edges:
                      - node:
                          role: member
                          projection:
                            field: uri
                        relation:
                          # Each member counts once.
                          cardinality: "0..*"
                          projection:
                            field: modifiers
                  relation:
                    # The count of the family's modifiers.
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: facts
      relation:
        cardinality: "1"
