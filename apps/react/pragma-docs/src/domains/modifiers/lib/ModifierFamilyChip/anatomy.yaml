---
# ModifierFamilyChip: a modifier family as an inline mention: the slot order
# mark, prefix, title, status. A passage's own link text, when given, stands
# in for the title; the status is the published Badge counting the family's
# modifiers (Figma ZwVhG78TEaKIDLCdIdQ9Fi, node 449:22408). A linked chip
# peeks at the family: the peek useProjectionPeek returns for its absolute
# IRI (uri, the only address node(id:) accepts), mounted only when the peek
# opens.
# Its mark is the modifier family's glyph, so it names no kind; the prefix
# shows only off the page's ambient namespace (the components lens declares
# ds). A family has no home yet and reads as inert text. Projected onto the
# base form, which carries every style.
node:
  uri: docs.component.modifier_family_chip
  projection:
    on: ModifierFamily
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: mark
              # The modifier family's glyph, a published Icon (MODIFIER_FAMILY_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
                # The peek: the entity's card, read by its own query when open.
                - node:
                    uri: prism.component.projection_peek
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: status
              edges:
                - node:
                    uri: global.component.badge
                    edges:
                      - node:
                          role: member
                          projection:
                            field: uri
                        relation:
                          # Each member counts once.
                          cardinality: "0..*"
                          projection:
                            field: modifiers
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: status
      relation:
        cardinality: "1"
