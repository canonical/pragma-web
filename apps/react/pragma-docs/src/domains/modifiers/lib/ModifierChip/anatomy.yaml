---
# ModifierChip: a modifier as an inline mention.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, nodes 449:22408 and 462:280 (the
# chip with its key before the separator: "Modifier: Danger"). The key is
# the modifier's class; a passage's own link text, when given, stands in
# for the title.
# Projected onto EntityChip, which carries every style: this anatomy binds
# none. The home is the link the value renders through, resolved from the
# compact address; a modifier has no home yet and reads as inert text.
node:
  uri: docs.component.modifier_chip
  projection:
    on: Modifier
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: lead
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: lead
              projection:
                field: _meta.type
          - node:
              role: value
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: value
      relation:
        cardinality: "1"
