---
# ModifierGraphNode: a modifier as a node of a graph, two lines tall.
# Reference: Figma ZwVhG78TEaKIDLCdIdQ9Fi, nodes 566:2433 and 566:2357 (the
# compact address in the identifier face, then "kind in location" muted).
# The kind is the modifier's class; the location the address's prefix.
# Projected onto EntityGraphNode, native SVG, which carries every style:
# this anatomy binds none. The home is the link the title renders through,
# resolved from the compact address; a modifier has no home yet and reads
# as inert text.
node:
  uri: docs.component.modifier_graph_node
  projection:
    on: Modifier
  edges:
    - node:
        uri: prism.component.entity_graph_node
        edges:
          - node:
              role: title
              projection:
                field: _meta.curie
              edges:
                # The compact address is set in the identifier face.
                - node:
                    role: identifier
                  relation:
                    cardinality: "1"
                    slotName: identifier
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
          - node:
              role: location
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: location
      relation:
        cardinality: "1"
