---
# ModifierFamilyCommand: a modifier family as a result in the command
# palette: the slot order mark, title, address, kind, status. The palette's
# results mix every type, so the result carries its compact address and its
# class on its second line and no prefix; the status counts the family's
# modifiers. A family has no home yet and reads as inert text. Projected
# onto the base form, which carries every style.
node:
  uri: docs.component.modifier_family_command
  projection:
    on: ModifierFamily
  edges:
    - node:
        uri: prism.component.entity_command
        edges:
          - node:
              role: mark
              # The modifier family's glyph, a published Icon (MODIFIER_FAMILY_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: address
              projection:
                field: _meta.curie
            relation:
              cardinality: "1"
              slotName: address
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
          - node:
              role: status
              edges:
                - node:
                    role: count
                    projection:
                      field: uri
                  relation:
                    # Each member counts once.
                    cardinality: "0..*"
                    projection:
                      field: modifiers
            relation:
              cardinality: "1"
              slotName: status
      relation:
        cardinality: "1"
