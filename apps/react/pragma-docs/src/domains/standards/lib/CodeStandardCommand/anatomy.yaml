---
# CodeStandardCommand: a code standard as a result in the command palette:
# the slot order mark, title, address, kind, status. The palette's results
# mix every type, so the result carries its compact address and its class
# on its second line and no prefix; the status is the standard's first
# category. The title links to the standard's reading page. Projected onto
# the base form, which carries every style.
node:
  uri: docs.component.code_standard_command
  projection:
    on: CodeStandard
  edges:
    - node:
        uri: prism.component.entity_command
        edges:
          - node:
              role: mark
              # The code standard's glyph, a published Icon (CODE_STANDARD_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: address
              projection:
                field: _meta.curie
            relation:
              cardinality: "1"
              slotName: address
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
          - node:
              role: status
              projection:
                field: _meta.title
            relation:
              # The standard's first category.
              cardinality: "0..1"
              slotName: status
              projection:
                field: categories
      relation:
        cardinality: "1"
