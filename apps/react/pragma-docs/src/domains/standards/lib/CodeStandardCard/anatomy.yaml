---
# CodeStandardCard: a code standard as a card in a grid of entities: the
# slot order mark, prefix, title, summary, facts. The summary is the first
# paragraph of the standard's Markdown description; the one fact is its
# first category. A standard has no depiction, so the card draws no
# specimen, and a card carries no address (the peek's line does).
# Its mark is the code standard's glyph, so it names no kind; the prefix
# shows only off the page's ambient namespace (the standards lens declares
# cs). The title links to the standard's reading page. Projected onto the
# base form, which carries every style.
node:
  uri: docs.component.code_standard_card
  projection:
    on: CodeStandard
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The code standard's glyph, a published Icon (CODE_STANDARD_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: description
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: category
                    projection:
                      field: _meta.title
                  relation:
                    # The standard's first category.
                    cardinality: "0..1"
                    projection:
                      field: categories
            relation:
              cardinality: "0..1"
              slotName: facts
      relation:
        cardinality: "1"
