---
# CatalogList — the catalog: one jump link per tier, then each tier as a
# page section whose content is its components through NodeList, the
# shared list of nodes: the table of the facts the component lens
# displays, two lines a row, by default; the cards through the site's card
# arm, which the package's card switch reaches through the site slot, so a
# UI block's card keeps its rendered example. The sort and the selected
# component are the address's. Tiers run Global first, the rest
# alphabetically, untiered last. Every tier's list carries its own count.
# A graph with no components leaves the list's empty line. When the graph
# holds more than one page, a published Button loads the next hundred, and
# each count reads as the components loaded so far, since the connection
# carries no total; while pages remain the jump links' navigation opens
# with a muted line saying it holds the tiers of the components loaded so
# far, the line naming the navigation, a tier a later page brings taking
# its place in the same order.
#
# The root is a subgrid of the page over every column, its gap the grid's
# gutter on both axes; a tier's count spans its section's row, under the
# tier's name; the navigation's line and the jump links sit on one
# wrapping line, a gutter apart and on a shared baseline, the links with no
# markers or insets.
#
# Every decision is read through a component token declared on the root
# (`--catalog-list-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1": structure. layout.wrap wrap,
#   layout.align baseline, layout.listStyle none: keywords. The 0 resets on
#   the partial line, the list and the load-more line.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: docs.subcomponent.catalog_list
  projection:
    on: Query
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - node:
        role: tiers (the jump links' navigation)
        styles:
          layout.grid.column: "1 / -1"
          layout.type: flex
          layout.wrap: wrap
          layout.align: baseline
          spacing.gap: grid.gutter
        edges:
          - node:
              role: partial (the line naming the tiers loaded so far)
              styles:
                spacing.external.block.start: 0
                spacing.external.block.end: 0
                typography.color: color.text.muted
            relation: { cardinality: "0..1", slotName: partial }
          - node:
              role: links
              styles:
                layout.type: flex
                layout.wrap: wrap
                spacing.gap: grid.gutter
                layout.listStyle: none
                spacing.external.block.start: 0
                spacing.external.block.end: 0
                spacing.internal.inline.start: 0
              edges:
                - node:
                    role: tier link
                    projection:
                      field: tier.name
                  relation:
                    cardinality: "1..*"
                    projection:
                      field: components
            relation: { cardinality: "1", slotName: links }
      relation: { cardinality: "0..1", slotName: tiers }
    - node:
        uri: docs.component.page_section
        edges:
          - node:
              role: tier name
              projection:
                field: tier.name
            relation: { cardinality: "1" }
          - node:
              uri: prism.component.count_line
              styles:
                layout.grid.column: "1 / -1"
            relation: { cardinality: "1", slotName: count }
          - node:
              uri: prism.component.node_list
              edges:
                - node:
                    uri: docs.component.docs_card_projection
                  relation: { cardinality: "0..*", slotName: card }
                - node:
                    uri: docs.component.docs_row_projection
                  relation: { cardinality: "0..*", slotName: row }
                - node:
                    role: item key
                    projection:
                      field: uri
                  relation: { cardinality: "1..*" }
            relation: { cardinality: "1", slotName: list }
      relation:
        cardinality: "0..*"
        projection:
          field: components
    - node:
        uri: prism.component.node_list
      relation: { cardinality: "0..1", slotName: empty }
    - node:
        role: more (the load-more line)
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
        edges:
          - node:
              uri: global.component.button
            relation: { cardinality: "1" }
      relation: { cardinality: "0..1", slotName: more }
