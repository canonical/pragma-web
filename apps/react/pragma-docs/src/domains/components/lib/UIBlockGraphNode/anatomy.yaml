---
# UIBlockGraphNode: a UI block as a node of a graph drawing: the slot order
# mark, prefix, title. A graph node has no status and a typed one no kind.
# One projection serves every UI-block type: it reads only what the UIBlock
# interface declares, and the site's switches case it for Component,
# Pattern and Layout. Its mark is the UI block's glyph, so it names no kind;
# the prefix shows only off the page's ambient namespace (the components
# lens declares ds). Projected onto the base form, which carries every
# style.
node:
  uri: docs.component.ui_block_graph_node
  projection:
    on: UIBlock
  edges:
    - node:
        uri: prism.component.entity_graph_node
        edges:
          - node:
              role: mark
              # The UI block's glyph, a published Icon (UI_BLOCK_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
      relation:
        cardinality: "1"
