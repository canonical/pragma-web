---
# UIBlockCard: a UI block as a card: the slot order mark, prefix, title,
# summary, facts, status, then the specimen. A typed card names no address
# (the peek's line carries the CURIE) and no kind (its mark says it). The
# facts are the tier, the block it inherits from and its version, each cell
# naming its property in data-property; the status is its documentation
# stage; the specimen holds the published component, for a block the site
# renders.
# One projection serves every UI-block type: it reads only what the UIBlock
# interface declares, and the site's switches case it for Component,
# Pattern and Layout. Its mark is the UI block's glyph, so it names no kind;
# the prefix shows only off the page's ambient namespace (the components
# lens declares ds). Projected onto the base form, which carries every
# style.
node:
  uri: docs.component.ui_block_card
  projection:
    on: UIBlock
  edges:
    - node:
        uri: prism.component.entity_card
        edges:
          - node:
              role: mark
              # The UI block's glyph, a published Icon (UI_BLOCK_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: summary
              styles:
                typography.wrap: anywhere
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: facts
              edges:
                - node:
                    role: tier
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: tier
                - node:
                    role: inheritsFrom
                    projection:
                      field: _meta.title
                  relation:
                    # The first block it inherits from: the fact names one.
                    cardinality: "0..1"
                    projection:
                      field: inheritsFroms
                - node:
                    role: version
                    projection:
                      field: version
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "0..1"
              slotName: facts
          - node:
              role: status
              projection:
                field: _meta.title
            relation:
              # The block's documentation stage, a state of the block.
              cardinality: "0..1"
              slotName: status
              projection:
                field: documentationStages
          - node:
              uri: prism.component.entity_card.specimen
              edges:
                - node:
                    uri: docs.component.ui_block_example
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "1"
            relation:
              # The block as the published package renders it, for a block
              # the site has an example of (kind block).
              cardinality: "0..1"
              slotName: specimen
      relation:
        cardinality: "1"
