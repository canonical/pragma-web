---
# UIBlockChip: a UI block (a component, a pattern or a layout) as an inline
# mention: the slot order mark, prefix, title. A passage's own link text,
# when given, stands in for the title. A linked chip peeks at the block:
# the peek useProjectionPeek returns for its absolute IRI (uri, the only
# address node(id:) accepts), mounted only when the peek opens.
# One projection serves every UI-block type: it reads only what the UIBlock
# interface declares, and the site's switches case it for Component,
# Pattern and Layout. Its mark is the UI block's glyph, so it names no kind;
# the prefix shows only off the page's ambient namespace (the components
# lens declares ds). Projected onto the base form, which carries every
# style.
node:
  uri: docs.component.ui_block_chip
  projection:
    on: UIBlock
  edges:
    - node:
        uri: prism.component.entity_chip
        edges:
          - node:
              role: mark
              # The UI block's glyph, a published Icon (UI_BLOCK_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
                # The peek: the block's card, read by its own query when open.
                - node:
                    uri: prism.component.projection_peek
                    projection:
                      field: uri
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
      relation:
        cardinality: "1"
