---
# UIBlockRow: a UI block as a 32px list entry, or a 56px two-line one where
# an index opts in: the slot order mark, prefix, title, summary, status. The
# summary is the first paragraph of the block's summary, the second line of
# a two-line row; the status is the block's documentation stage.
# One projection serves every UI-block type: it reads only what the UIBlock
# interface declares, and the site's switches case it for Component,
# Pattern and Layout. Its mark is the UI block's glyph, so it names no kind;
# the prefix shows only off the page's ambient namespace (the components
# lens declares ds). Projected onto the base form, which carries every
# style.
node:
  uri: docs.component.ui_block_row
  projection:
    on: UIBlock
  edges:
    - node:
        uri: prism.component.entity_row
        edges:
          - node:
              role: mark
              # The UI block's glyph, a published Icon (UI_BLOCK_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: prefix
              projection:
                field: _meta.curie
            relation:
              cardinality: "0..1"
              slotName: prefix
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: summary
              projection:
                field: summary
            relation:
              cardinality: "0..1"
              slotName: summary
          - node:
              role: status
              projection:
                field: _meta.title
            relation:
              # The block's documentation stage, a state of the block.
              cardinality: "0..1"
              slotName: status
              projection:
                field: documentationStages
      relation:
        cardinality: "1"
