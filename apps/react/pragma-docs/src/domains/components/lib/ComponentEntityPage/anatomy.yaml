---
# ComponentEntityPage — the component route's content: the component,
# inside the error and loading boundaries, which the address keys, so a
# new component starts afresh. A page of the document archetype with no
# aside: the main column runs from the rail to the canvas's end. The root
# is a subgrid of the canvas's page grid over every column, its gap the
# grid's gutter on both axes; the loading line and the alert span it; it
# packs at the top and ends one loose step above the canvas's end. Bespoke:
# no published component is an entity page.
#
# Every decision is read through a component token declared on the root
# (`--component-entity-page-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1": structure. layout.alignSelf start: a
#   keyword. The 0 resets.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# container.gap.loose.
node:
  uri: docs.component.component_entity_page
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    layout.alignSelf: start
    spacing.gap: grid.gutter
    spacing.internal.block.end: container.gap.loose
  edges:
    - node:
        role: status (the loading line)
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: status }
    - node:
        role: alert (the error line, role alert)
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
      relation: { cardinality: "0..1", slotName: alert }
    - node:
        uri: docs.subcomponent.component_detail
      relation: { cardinality: "0..1", slotName: default }
