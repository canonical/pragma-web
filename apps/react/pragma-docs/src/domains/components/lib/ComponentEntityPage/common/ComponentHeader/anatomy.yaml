---
# ComponentHeader — the component page's header: the class's mark before
# the name as the page's level-1 heading (the compact address when it has
# no name), the summary
# on a reading measure of six intrinsic columns and at most 75 characters,
# then the status line: the tier and the first documentation stage, each
# only when the graph records it, and the compact address in the code
# face, muted, separated by middle dots (PS3 V1 `p.mockup-status-line`),
# each dot held on one line with the value before it, then core's Copy
# control for the address, which announces "Copied" (the entity page's
# header has the same parts).
# The page says the three here only; its facts hold the rest.
# Application UI, not prose: the heading and the summary sit one gutter
# apart.
#
# Every decision is read through a component token declared on the root
# (`--component-header-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1", "1 / span 6": structure. The 0 resets.
#   --component-header-summary-measure: 75ch  the summary's reading
#     measure (heuristic 75ch prose line).
#   --component-header-status-gap-block: space.050, -inline: space.100
#     the status line's gaps when it wraps and between its parts (PS3 V1).
#   --component-header-label-size: 1px  literal: the box of a value's
#     name, read by assistive technology and drawn nowhere (transparent,
#     its overflow hidden, out of the flow).
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: docs.subcomponent.component_header
  projection:
    on: Component
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - node:
        role: heading (the page's level-1 heading, the name, else the address)
        styles:
          layout.grid.column: "1 / -1"
          layout.type: flex
          layout.align: baseline
          spacing.gap.inline: grid.gutter
          spacing.external.block.start: 0
          spacing.external.block.end: 0
        edges:
          - node:
              role: mark (the Component class's glyph, hidden from assistive technology)
              element: svg
              attributes: { aria-hidden: "true" }
            relation: { cardinality: "1", slotName: mark }
          - node:
              role: name
              projection:
                field: name
            relation: { cardinality: "0..1" }
          - node:
              role: address
              projection:
                field: _meta.curie
            relation: { cardinality: "0..1" }
      relation: { cardinality: "1", slotName: heading }
    - node:
        role: summary
        projection:
          field: summary
        styles:
          layout.grid.column: "1 / span 6"
          size.max.width: "75ch"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
      relation: { cardinality: "0..1", slotName: summary }
    - node:
        role: status line (tier · stage · address)
        styles:
          layout.grid.column: "1 / -1"
          layout.type: flex
          layout.wrap: wrap
          layout.align: baseline
          spacing.gap.block: space.050
          spacing.gap.inline: space.100
          size.min.width: 0
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          typography.color: color.text.muted
        edges:
          - node:
              role: tier part (the value and the dot after it, kept on one line)
              styles:
                layout.type: flex
                layout.align: baseline
                spacing.gap.inline: space.100
              edges:
                - node:
                    role: value
                    projection:
                      field: tier.name
                    styles:
                      typography.color: color.text
                    edges:
                      - node:
                          role: label ("Tier:", for assistive technology only)
                          styles:
                            layout.position: absolute
                            size.width: "1px"
                            size.height: "1px"
                            layout.overflow: hidden
                            typography.whiteSpace: nowrap
                            appearance.opacity: 0
                        relation: { cardinality: "1", slotName: label }
                  relation: { cardinality: "1", slotName: value }
                - node:
                    role: separator (a middle dot, hidden from assistive technology)
                    attributes: { aria-hidden: "true" }
                  relation: { cardinality: "1", slotName: separator }
            relation: { cardinality: "0..1", slotName: part }
          - node:
              role: stage part (the first documentation stage and the dot after it)
              styles:
                layout.type: flex
                layout.align: baseline
                spacing.gap.inline: space.100
              edges:
                - node:
                    role: value
                    projection:
                      field: documentationStages._meta.title
                    styles:
                      typography.color: color.text
                    edges:
                      - node:
                          role: label ("Stage:", for assistive technology only)
                          styles:
                            layout.position: absolute
                            size.width: "1px"
                            size.height: "1px"
                            layout.overflow: hidden
                            typography.whiteSpace: nowrap
                            appearance.opacity: 0
                        relation: { cardinality: "1", slotName: label }
                  relation: { cardinality: "1", slotName: value }
                - node:
                    role: separator (a middle dot, hidden from assistive technology)
                    attributes: { aria-hidden: "true" }
                  relation: { cardinality: "1", slotName: separator }
            relation: { cardinality: "0..1", slotName: part }
          - node:
              role: address
              element: code
              projection:
                field: _meta.curie
              styles:
                size.min.width: 0
                typography.fontFamily: typography.text.primary.code.fontFamily
                typography.wrap: anywhere
            relation: { cardinality: "1", slotName: address }
          - node:
              role: copy (core's CopyButton for the address, "Copied" announced)
              element: button
            relation: { cardinality: "1", slotName: copy }
      relation: { cardinality: "1", slotName: status-line }
