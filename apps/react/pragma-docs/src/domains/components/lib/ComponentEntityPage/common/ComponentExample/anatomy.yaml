---
# ComponentExample — the component page's body before its sections: the
# block's rendered example, the published React component in its default
# state (UIBlockExample), server-rendered on a stage framed by a hairline
# that spans the main column. The frame opens with a one-line bar that
# bleeds to its edges, a hairline under it, holding the title "Example"
# (the catalog's word) at its start, small and bold, which names the
# stage's region (PS3 V1 `.mockup-stage-bar`); under the bar the component
# sits one loose step from the bar and the frame's bottom and one inline
# padding from its sides. The title is no heading: the page's sections
# carry the headings. The bar's controls (theme, width, code, platform)
# are not built. A block the published package does
# not implement has no example: the part says so in one muted line. A
# subgrid of the content over every column, its gap the grid's gutter.
#
# Every decision is read through a component token declared on the root
# (`--component-example-*`), bound to the symbol named here.
#
# Token ledger:
#   appearance.border.width 1px: the stage's and the bar's hairline; stroke
#   width has only primitives. layout.grid.column "1 / -1": structure. The
#   0 resets.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# container.gap.loose, component.padding.inline, space.050.
node:
  uri: docs.subcomponent.component_example
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - node:
        role: stage (a region named by its bar's title)
        element: section
        attributes: { aria-labelledby: component-example-title }
        styles:
          layout.grid.column: "1 / -1"
          size.min.width: 0
          appearance.border.width: 1px
          appearance.border.style: solid
          appearance.border.color: color.border.muted
        edges:
          - node:
              role: bar (one line, a hairline under it)
              styles:
                layout.type: flex
                layout.align: center
                spacing.internal.block.start: space.050
                spacing.internal.block.end: space.050
                spacing.internal.inline.start: component.padding.inline
                spacing.internal.inline.end: component.padding.inline
                appearance.border.width: 1px
                appearance.border.style: "none none solid"
                appearance.border.bottom.color: color.border.muted
              edges:
                - node:
                    role: title (the catalog's "Example", the region's name)
                    attributes: { id: component-example-title }
                    styles:
                      typography.size: typography.text.secondary.fontSize
                      typography.weight: typography.text.primary.bold.fontWeight
                  relation: { cardinality: "1", slotName: title }
            relation: { cardinality: "1", slotName: bar }
          - node:
              role: surface (the component's place under the bar)
              styles:
                layout.type: flex
                layout.align: center
                layout.wrap: wrap
                spacing.internal.block.start: container.gap.loose
                spacing.internal.block.end: container.gap.loose
                spacing.internal.inline.start: component.padding.inline
                spacing.internal.inline.end: component.padding.inline
              edges:
                - node:
                    uri: docs.component.ui_block_example
                  relation: { cardinality: "1" }
            relation: { cardinality: "1", slotName: surface }
      relation: { cardinality: "0..1", slotName: stage }
    - node:
        role: absent (the catalog's line for a block with no example)
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: absent }
