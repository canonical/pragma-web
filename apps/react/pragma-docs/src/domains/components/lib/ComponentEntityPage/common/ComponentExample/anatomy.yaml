---
# ComponentExample — the component page's body before its sections: the
# block's rendered example, the published React component in its default
# state (UIBlockExample), server-rendered on a stage framed by a hairline
# that spans the main column, with one loose step of space above and below
# the component and one inline padding beside it. It carries no heading:
# the stage is a region named "Example" (the catalog's word), and the
# page's sections carry the headings. A block the published package does
# not implement has no example: the part says so in one muted line. A
# subgrid of the content over every column, its gap the grid's gutter.
#
# Every decision is read through a component token declared on the root
# (`--component-example-*`), bound to the symbol named here.
#
# Token ledger:
#   appearance.border.width 1px: the stage's hairline; stroke width has
#   only primitives. layout.grid.column "1 / -1": structure. The 0 resets.
#
# Roster namespaces (accepted and tracked): grid.gutter,
# container.gap.loose, component.padding.inline.
node:
  uri: docs.subcomponent.component_example
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - node:
        role: stage (a region named by the catalog's "Example")
        element: section
        attributes: { aria-label: "{component.example}" }
        styles:
          layout.grid.column: "1 / -1"
          layout.type: flex
          layout.align: center
          layout.wrap: wrap
          spacing.internal.block.start: container.gap.loose
          spacing.internal.block.end: container.gap.loose
          spacing.internal.inline.start: component.padding.inline
          spacing.internal.inline.end: component.padding.inline
          appearance.border.width: 1px
          appearance.border.style: solid
          appearance.border.color: color.border.muted
        edges:
          - node:
              uri: docs.component.ui_block_example
            relation: { cardinality: "1" }
      relation: { cardinality: "0..1", slotName: stage }
    - node:
        role: absent (the catalog's line for a block with no example)
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          typography.color: color.text.muted
      relation: { cardinality: "0..1", slotName: absent }
