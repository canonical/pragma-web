---
# ComponentDetail — the component page's data-bearing interior: the page's
# one operation, read from the warm store. It renders, in order, the
# header with the key values, the rendered example, the anatomy tree, the
# properties and the relations. For an address the graph does not answer
# to, it renders a status line naming the address in the published
# InlineCode. It sets the document title either way. A subgrid of the page
# over every column, its gap the grid's gutter on both axes; each part
# places itself.
#
# Every decision is read through a component token declared on the root
# (`--component-detail-*`), bound to the symbol named here.
#
# Token ledger:
#   layout.grid.column "1 / -1": structure. The 0 resets.
#
# Roster namespaces (accepted and tracked): grid.gutter.
node:
  uri: docs.subcomponent.component_detail
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - node:
        role: not found (a status line naming the address)
        styles:
          layout.grid.column: "1 / -1"
          spacing.external.block.start: 0
          spacing.external.block.end: 0
          typography.color: color.text.muted
        edges:
          - node:
              uri: global.component.inline_code
            relation: { cardinality: "1" }
      relation: { cardinality: "0..1", slotName: not-found }
    - node:
        uri: docs.subcomponent.component_header
      relation: { cardinality: "0..1" }
    - node:
        uri: docs.subcomponent.component_example
      relation: { cardinality: "0..1" }
    - node:
        uri: docs.subcomponent.component_anatomy
      relation: { cardinality: "0..1" }
    - node:
        uri: docs.subcomponent.component_properties
      relation: { cardinality: "0..1" }
    - node:
        uri: docs.subcomponent.component_relations
      relation: { cardinality: "0..1" }
