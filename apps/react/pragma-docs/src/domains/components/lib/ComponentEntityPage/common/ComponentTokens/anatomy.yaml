---
# ComponentTokens (.../ComponentEntityPage/common/ComponentTokens/): the
# component's token bindings as a section's content, grouped by part
# (TokenBinding.node) and, within a part, in fallback order (rank ascending).
# A plain table until the dataviews rebase (30's note): Part (a row header
# spanning its bindings, one tbody per part), Token (the symbol's name after
# its namespace, monospace, broken anywhere so it reflows at 390), Order.
# A binding the graph records twice for one part (one symbol, one rank,
# read by two style properties) is one row. It scrolls sideways
# inside its own wrapper, never the page (W6a-A7). No heading of its own.
# Styles transcribe ComponentProperties' table (same folder level): copy its
# token bindings name for name under the `--component-tokens-*` prefix.
# Reference: PS3 V1 "tokens (grouped by part, with fallback order)"; 24 on Button.
#
# Token ledger (on `.ds.component-tokens`): ComponentProperties' ledger,
# renamed, plus:
#   --component-tokens-symbol-font-family:
#     typography.text.primary.code.fontFamily (the semantic code face the
#     app already reads, in place of the planner's literal stack)
node:
  uri: docs.subcomponent.component_tokens
  styles:
    layout.type: grid
    layout.grid.columns: subgrid
    layout.grid.column: "1 / -1"
    spacing.gap: grid.gutter
  edges:
    - node:
        role: scroll (the table's own scrolling region)
        styles:
          layout.grid.column: "1 / -1"
          layout.overflow.inline: auto
          size.min.width: 0
        edges:
          - node:
              role: table
              element: table
              styles:
                size.width: 100%
                layout.table.collapse: collapse
              edges:
                - node:
                    role: head (a column's header cell)
                    element: th
                    attributes: { scope: col }
                    styles:
                      typography.align: start
                      layout.verticalAlign: top
                      typography.color: color.text.muted
                      typography.weight: typography.text.primary.bold.fontWeight
                      spacing.internal.block.start: space.050
                      spacing.internal.block.end: space.050
                      spacing.internal.inline.start: 0
                      spacing.internal.inline.end: container.gap.default
                      appearance.border.width: 1px
                      appearance.border.style: "none none solid"
                      appearance.border.bottom.color: color.border.muted
                  relation: { cardinality: "3", slotName: head }
                - node:
                    role: part group (one tbody per part)
                    element: tbody
                    edges:
                      - node:
                          role: part (the group's header cell, spanning its rows)
                          element: th
                          attributes: { scope: rowgroup }
                          styles:
                            typography.align: start
                            layout.verticalAlign: top
                            spacing.internal.block.start: space.050
                            spacing.internal.block.end: space.050
                            spacing.internal.inline.start: 0
                            spacing.internal.inline.end: container.gap.default
                            appearance.border.width: 1px
                            appearance.border.style: "none none solid"
                            appearance.border.bottom.color: color.border.muted
                        relation: { cardinality: "1", slotName: part }
                      - node:
                          role: symbol (the token's name after its namespace)
                          element: td
                          styles:
                            typography.align: start
                            layout.verticalAlign: top
                            typography.fontFamily: typography.text.primary.code.fontFamily
                            typography.wrap: anywhere
                            spacing.internal.block.start: space.050
                            spacing.internal.block.end: space.050
                            spacing.internal.inline.start: 0
                            spacing.internal.inline.end: container.gap.default
                            appearance.border.width: 1px
                            appearance.border.style: "none none solid"
                            appearance.border.bottom.color: color.border.muted
                        relation: { cardinality: "1..*", slotName: symbol }
                      - node:
                          role: order (the symbol's place in the fallback order)
                          element: td
                          styles:
                            typography.align: start
                            layout.verticalAlign: top
                            spacing.internal.block.start: space.050
                            spacing.internal.block.end: space.050
                            spacing.internal.inline.start: 0
                            spacing.internal.inline.end: container.gap.default
                            appearance.border.width: 1px
                            appearance.border.style: "none none solid"
                            appearance.border.bottom.color: color.border.muted
                        relation: { cardinality: "1..*", slotName: order }
                  relation: { cardinality: "1..*", slotName: group }
            relation: { cardinality: "1", slotName: table }
      relation: { cardinality: "1", slotName: scroll }
