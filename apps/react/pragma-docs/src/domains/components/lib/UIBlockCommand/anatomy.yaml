---
# UIBlockCommand: a UI block as a result of the command palette: the slot
# order mark, title, address, kind, status. The palette mixes every type,
# so the command names its kind (the block's type) and carries its
# compact address on its second line, and no prefix; the status is its
# version, or its documentation stage when it has none.
# One projection serves every UI-block type; projected onto EntityCommand,
# which carries every style.
node:
  uri: docs.component.ui_block_command
  projection:
    on: UIBlock
  edges:
    - node:
        uri: prism.component.entity_command
        edges:
          - node:
              role: mark
              # The UI block's glyph, a published Icon (UI_BLOCK_MARK_ICON).
              edges:
                - node:
                    uri: global.component.icon
                  relation:
                    cardinality: "1"
            relation:
              cardinality: "1"
              slotName: mark
          - node:
              role: title
              projection:
                field: _meta.title
              edges:
                - node:
                    role: home
                    projection:
                      field: _meta.curie
                  relation:
                    cardinality: "0..1"
            relation:
              cardinality: "1"
              slotName: title
          - node:
              role: address
              projection:
                field: _meta.curie
            relation:
              cardinality: "1"
              slotName: address
          - node:
              role: kind
              projection:
                field: _meta.title
            relation:
              cardinality: "1"
              slotName: kind
              projection:
                field: _meta.type
          - node:
              role: status
              edges:
                - node:
                    role: version
                    projection:
                      field: version
                  relation:
                    cardinality: "0..1"
                - node:
                    role: stage
                    projection:
                      field: _meta.title
                  relation:
                    cardinality: "0..1"
                    projection:
                      field: documentationStages
            relation:
              cardinality: "0..1"
              slotName: status
      relation:
        cardinality: "1"
